- type: entity
  parent: [SolutionSpray, SolutionTiny, BaseItem]
  id: SprayFlowerPin
  name: 花形胸針 | flower pin
  description: 一枚可愛的花朵胸針。總覺得它哪裡不太對勁…… | A cute flower pin. Something seems off with it...
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Clothing/Neck/Misc/pins.rsi
    state: flower
  - type: Clothing
    equippedPrefix: flower
    sprite: Clothing/Neck/Misc/pins.rsi
    quickEquip: true
    slots:
    - neck
  - type: EquipSpray
    verbLocId: equip-spray-verb-press
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 30
  - type: RefillableSolution
    solution: spray
  - type: DrainableSolution
    solution: spray
  - type: SolutionTransfer
    maxTransferAmount: 30
    transferAmount: 30
  - type: UseDelay
  - type: Spray
    transferAmount: 5
    pushbackAmount: 30
    spraySound:
      path: /Audio/Effects/spray3.ogg
    sprayedPrototype: FlowerVapor
    vaporAmount: 1
    vaporSpread: 90
    sprayVelocity: 1.0
    sprayEmptyPopupMessage: pin-spray-popup-empty
  - type: ActionGrant
    actions:
    - ActionShootWater
  - type: ItemActionGrant
    activeIfWorn: true
