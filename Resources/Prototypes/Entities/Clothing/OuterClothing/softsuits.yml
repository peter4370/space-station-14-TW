#Emergency EVA
- type: entity
  parent: [ TemperatureProtectionMinimal, ClothingOuterEVASuitBaseToggleable ]
  id: ClothingOuterSuitEmergency
  name: 緊急壓力服 | emergency pressure suit
  description: 這套笨重且未經隔熱處理的壓力服，顯然並非為在太空中長時間使用而設計，儘管 NanoTrasen 聲稱它符合公司規定。 | This bulky, uninsulated pressure suit was clearly not meant for extended use in outer space, despite NanoTrasen's claims that it passes corporate regulations.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva_emergency.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetEVALarge
  - type: Tag
    tags:
    - CorgiWearable
    - ScurretWearable
    - MonkeyWearable
    - WhitelistChameleon

#Prisoner EVA
