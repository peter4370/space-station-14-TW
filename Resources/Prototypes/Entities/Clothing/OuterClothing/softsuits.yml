#Basic EVA
- type: entity
  parent: ClothingOuterEVASuitBase
  id: ClothingOuterHardsuitEVA
  name: EVA 防護服 | EVA suit
  description: 一款輕量級太空服，具備保護穿著者免受太空真空環境侵害的基本能力。 | A lightweight space suit with the basic ability to protect the wearer from the vacuum of space.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Suits/eva.rsi
  - type: Tag
    tags:
    - SuitEVA
    - MonkeyWearable
    - WhitelistChameleon

#Syndicate EVA
