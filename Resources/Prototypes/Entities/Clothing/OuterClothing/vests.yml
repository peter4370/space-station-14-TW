#NOTE: vests with armor belong to armor.yml

#Hazard vest
- type: entity
  parent: ClothingOuterStorageBase
  id: ClothingOuterVestHazard
  name: 高可見度背心 | hi-viz vest
  description: 一種用於施工區域的高可見度背心。 | A high-visibility vest used in work zones.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/hazard.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
    - state: icon-unshaded
      shader: shaded
      #This is a neat trick I found to sort of "hack" an emissive map into ss14. Basically, the icon-unshaded texture has an alpha channel.
      #Alpha doesn't work for unshaded, but for *shaded* it does, and by putting a shaded texture infront of the unshaded, we can dim the unshaded texture, effectively allowing brightness control.
      #I go further indepth on this in my PR, https://github.com/space-wizards/space-station-14/pull/37869
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/hazard.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
      - state: equipped-OUTERCLOTHING-unshaded
        shader: shaded
        #same trick here
  - type: Reflect
    reflectProb: 0.02
    reflects:
    - Energy
    reflectingInHands: false
  - type: Tag
    tags:
    - HiViz
    - WhitelistChameleon

#(Bartender) vest
- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterVest
  name: 背心 | vest
  description: 一件外層具橡膠質感且防水的厚背心。 | A thick vest with a rubbery, water-resistant shell.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/vest.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/vest.rsi

#Tank Harness
- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothingGasTanks]
  id: ClothingOuterVestTank
  name: 儲氣罐束帶 | tank harness
  description: 一款能固定瓦斯罐的簡易束帶。 | A simple harness that can hold a gas tank.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/tankharness.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/tankharness.rsi
  - type: Item
    size: Normal # Make smaller than typical outer clothing
    shape:
    - 0, 0, 0, 1

# Reporter unlockable PRESS vest
- type: entity
  parent: [ClothingOuterBase, AllowSuitStorageClothingGasTanks]
  id: ClothingOuterVestPress
  name: 記者背心 | press vest
  description: 一款專為無畏的現場記者設計的布製背心。去向那隻太空龍爭取一次專訪吧！ | A cloth vest for the fearless reporter in the field. Go land an interview with that space dragon!
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Vests/pressvest.rsi
    layers:
    - state: icon
    - state: icon-unshaded # See ClothingOuterVestHazard for why we double-add these unshaded states this way
      shader: unshaded
    - state: icon-unshaded
      shader: shaded
  - type: Clothing
    sprite: Clothing/OuterClothing/Vests/pressvest.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      - state: equipped-OUTERCLOTHING-unshaded
        shader: unshaded
      - state: equipped-OUTERCLOTHING-unshaded
        shader: shaded
