# Separate yml file for scrap armor since it has so many construction steps.
# Listed from first step of crafting to the final armor

- type: entity
  name: 鋼絲圍裙 | wired apron
  parent: BaseItem
  id: WiredApronBase
  description: 一條綴有編織線的圍裙。看起來似乎尚未完成。 | An apron threaded with cabling. It looks incomplete.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
    state: construction-1
  - type: Item
    size: Ginormous
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
  - type: Construction
    graph: scraparmor
    node: wiredapron

- type: entity
  name: 鋼製護裙 | steel-covered apron
  parent: BaseItem
  id: SteelApronBase
  description: 一件用多餘電纜隨意固定的、帶有鋼板襯裡的圍裙。以目前的狀態而言，一旦穿上，它會立刻散架。 | An apron with steel plating haphazardly affixed by spare cabling. In it's current state, it would fall apart immediately if worn.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
    state: construction-2
  - type: Item
    size: Ginormous
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
  - type: Construction
    graph: scraparmor
    node: steelapron

- type: entity
  name: 焊接鋼製圍裙 | welded steel apron
  parent: BaseItem
  id: WeldedSteelApronBase
  description: 一件附有焊接鋼板的護甲，該鋼板固定在備用纜線上。這套護甲已不再有解體的危險，但仍需進行額外加工才能確保穿戴穩固。 | An apron affixed with welded steel plating attached to spare cabling. The armor is no longer in danger of falling apart, but requires additional work to be worn securely.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
    state: construction-3
  - type: Item
    size: Ginormous
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
  - type: Construction
    graph: scraparmor
    node: weldedsteelapron

# The armor itself
- type: entity
  parent: [ClothingOuterBaseLarge, AllowSuitStorageClothing, BaseMajorContraband]
  id: ClothingOuterArmorScrap
  name: 廢棄盔甲 | scrap armor
  description: 一名騎兵閃閃發光的板甲。站住，否則你死定了。 | A tider's gleaming plate mail. Bail up, or you're a dead man.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
  - type: Item
    size: Ginormous
    shape:
    - 0,0,4,5
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/scrap_armor.rsi
    equipSound: /Audio/Effects/metal_scrape2.ogg
    unequipSound: /Audio/Effects/metal_scrape1.ogg
    equipDelay: 5
    unequipDelay: 5 #Its insane more armor/hardsuits don't have equip times tbh?
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5 #Some nukie tier physical protection...
        Heat: 0.8
        Radiation: 0.8 #Hey, it's a bunch of solid steel.
  - type: ExplosionResistance
    damageCoefficient: 0.80
  - type: ClothingSpeedModifier #But that protection comes at a price.
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: GroupExamine
  - type: Construction
    graph: scraparmor
    node: scraparmorfinished
