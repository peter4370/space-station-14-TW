- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRing
  name: 金戒指 | gold ring
  description: 一枚珍貴的戒指。 | A precious ring.
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRing
  name: 銀戒指 | silver ring
  description: 看起來比金色的稍微不那麼有價值。 | Looks slightly less valuable than a gold one.
  components:
  - type: Sprite
    layers:
      - state: ring

- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRingDiamond
  name: 黃金鑽戒 | gold diamond ring
  description: 採用以符合道德標準的方式開採的太空鑽石製成。 | Made from ethically mined space diamonds.
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"
      - state: gem
        color: "#c1ffff"
  - type: StaticPrice
    price: 1500

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRingDiamond
  name: 銀質鑽石戒指 | silver diamond ring
  description: 採用以符合道德標準的方式開採的太空鑽石製成。 | Made from ethically mined space diamonds.
  components:
  - type: Sprite
    layers:
      - state: ring
      - state: gem
        color: "#c1ffff"
  - type: StaticPrice
    price: 1400

- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: GoldRingGem
  name: 黃金寶石戒指 | gold gem ring
  description: 閃閃發亮又珍貴！ | Shiny and valuable!
  components:
  - type: Sprite
    layers:
      - state: ring
        color: "#ffc833"
      - state: gem
        map: [ "gemColor" ]
  - type: StaticPrice
    price: 2100
  - type: RandomSprite
    getAllGroups: true
    available:
      - gemColor:
          gem: Rainbow

- type: entity
  parent: [ RingBase, SilverRingBase ]
  id: SilverRingGem
  name: 銀製寶石戒指 | silver gem ring
  description: 閃閃發亮，但價值沒那麼高！ | Shiny and not quite as valuable!
  components:
  - type: Sprite
    layers:
      - state: ring
      - state: gem
        map: [ "gemColor" ]
  - type: StaticPrice
    price: 2000
  - type: RandomSprite
    getAllGroups: true
    available:
      - gemColor:
          gem: Rainbow
