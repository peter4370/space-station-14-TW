# Insulated Gloves (Yellow Gloves)
# Currently can not be greyscaled without looking like shit.
- type: entity
  parent: [ClothingHandsBase, BaseSlicingRefinable]
  id: ClothingHandsGlovesColorYellow
  name: 絕緣手套 | insulated gloves
  description: 這雙手套能保護佩戴者免於觸電。 | These gloves will protect the wearer from electric shocks.
  components:
  - type: FingerprintMask
  - type: Sprite
    sprite: Clothing/Hands/Gloves/Color/yellow.rsi
  - type: Clothing
    sprite: Clothing/Hands/Gloves/Color/yellow.rsi
  - type: ToolRefinable
    refineResult:
    - id: ClothingHandsGlovesFingerlessInsulated
  - type: Insulated
  - type: Fiber
    fiberMaterial: fibers-insulative
    fiberColor: fibers-yellow

# Budget Insulated Gloves
- type: entity
  parent: ClothingHandsGlovesColorYellow
  id: ClothingHandsGlovesColorYellowBudget
  name: 平價保暖手套 | budget insulated gloves
  description: 這副手套是那款備受追捧的手套的廉價仿品——這事絕對不可能搞砸。 | These gloves are cheap knockoffs of the coveted ones - no way this can end badly.
  components:
  - type: RandomInsulation
    # Why repeated numbers? So some numbers are more common, of course!
    list:
      - 0
      - 0
      - 0.5
      - 0.5
      - 0.5
      - 1.5
      - 1.5
      - 2
      - 2.5
      - 2.5
      - 3
      - 3.5
      - 4
  - type: Fiber
    fiberMaterial: fibers-insulative-frayed
    fiberColor: fibers-yellow

# Conductive Insulated Gloves
- type: entity
  parent: ClothingHandsGlovesColorYellow
  id: ClothingHandsGlovesConducting
  suffix: Conducting
  components:
  - type: Insulated
    coefficient: 5 # zap em good
