  name: 科學主任的高領衫 | research director's turtleneck
  description: 這是一件高領衫，專為那些具備勝任研究總監職位所需專業知識的人士所穿。其布料能提供輕微的防護，抵禦生物污染物。 | It's a turtleneck worn by those with the know-how to achieve the position of Research Director. Its fabric provides minor protection from biological contaminants.
