#Where all of the uniforms for the yet-to-be-implimented ship vs. ship gamemode go (or Nanotrasen VS. Syndicate, if you'd like.)
#In its own file to further avoid bloating jumpsuits.yml.

#CREW
#Recruit
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRecruitNT
  name: 新兵連身工作服 | recruit jumpsuit
  description: 一款配有藍色滾邊的優雅灰色連身工作服，非常適合氣質端莊的助手。 | A classy grey jumpsuit with blue trims. Perfect for the dignified helper.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/recruit_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/recruit_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitRecruitSyndie
  name: 黑幫招募連身衣 | syndicate recruit jumpsuit
  description: 一套令人起疑的深灰色連身工作服。彷彿乘客們還不夠心存疑慮似的。 | A dubious, dark-grey jumpsuit. As if passengers weren't dubious enough already.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/recruit_syndie.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/recruit_syndie.rsi

#Repairman
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRepairmanNT
  name: 維修工連身工作服 | repairman jumpsuit
  description: 這件連身工作服會讓你聯想到某個船員部門的工作崗位。但願你不必像那些怪胎一樣做同樣的工作。 | A jumpsuit that reminds you of a certain crew-sector work position. Hopefully, you won't have to do the same job as THOSE freaks.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/repairman_nt.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/ShipVsShip/repairman_nt.rsi

- type: entity
  parent: [ ClothingUniformBase, BaseSyndicateContraband ]
  id: ClothingUniformJumpsuitRepairmanSyndie
  name: 黑幫維修工連身工作服 | syndicate repairman jumpsuit
  description: 實用、時尚又酷勁十足。Nanotrasen 的工程師們都希望自己也能像這件單品一樣帥氣。 | Functional, fashionable, and badass. Nanotrasen's engineers wish they could look as good as this.
