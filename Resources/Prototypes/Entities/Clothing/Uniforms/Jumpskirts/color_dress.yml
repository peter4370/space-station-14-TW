# Black elegant dress
- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtBlackElegantDress
  name: 黑色優雅洋裝 | black elegant dress
  description: 一件綴有漂亮蝴蝶結的優雅洋裝。 | Elegant dress with a beautiful bow.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpskirts/ColorDress/elegantdress.rsi
    layers:
    - state: icon
    - state: icon-color
      color: "#212030"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#212030"
      right:
      - state: inhand-right
        color: "#212030"
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpskirts/ColorDress/elegantdress.rsi
    clothingVisuals:
      jumpsuit:
      - state: color-equipped-INNERCLOTHING
        color: "#212030"
      - state: equipped-INNERCLOTHING

