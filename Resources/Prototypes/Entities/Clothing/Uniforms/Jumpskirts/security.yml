- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpskirtPrisoner
  name: 囚犯式短裙 | prisoner jumpskirt
  description: 一款供囚犯使用的跳躍裙。其服裝感測器會隨時自動啟用。 | A jumpskirt used for prisoners. It has suit sensors automatically enabled at all times.
