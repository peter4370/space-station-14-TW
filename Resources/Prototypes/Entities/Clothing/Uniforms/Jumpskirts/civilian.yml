- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtCasualBlue
  name: 休閒款藍色連身裙 | casual blue jumpskirt
  description: 一件寬鬆的舊藍色襯衫搭配灰色裙子，非常適合想要放鬆的人。 | A loose worn blue shirt with a grey skirt, perfect for someone looking to relax.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuits/Civilian/casual.rsi
    layers:
    - state: icon-jumpskirt
    - state: icon-shirt
      color: "#134fc1"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-jumpskirt
      - state: inhand-left-shirt
        color: "#134fc1"
      right:
      - state: inhand-right-jumpskirt
      - state: inhand-right-shirt
        color: "#134fc1"
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuits/Civilian/casual.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-jumpskirt
      - state: equipped-INNERCLOTHING-shirt
        color: "#134fc1"

