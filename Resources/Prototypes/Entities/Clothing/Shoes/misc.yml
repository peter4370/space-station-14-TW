- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoeSlippersDuck
  name: 小鴨拖鞋 | ducky slippers
  description: 你真希望這些東西在你走路時能發出「嘎嘎」的叫聲。不過，好在它們沒有這樣做。 | You wish these made quacking sounds as you walked. It's a good thing they don't, though.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/duck-slippers.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Misc/duck-slippers.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCarpet
      params:
        variation: 0.07
  - type: Construction
    graph: ClothingShoeSlippersDuck
    node: shoes

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoeSlippersLizard
  name: 蜥蜴絨毛拖鞋 | lizard plushie slippers
  description: 一雙造型可愛、酷似蜥蜴人的拖鞋。搭配其他綠色服裝，你就會成為太空站上最酷的船員！ | An adorable pair of slippers that resemble a lizardperson. Combine this with some other green clothing and you'll be the coolest crewmember on the station!
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Misc/lizard-slippers.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Misc/lizard-slippers.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCarpet
      params:
        variation: 0.02
  - type: Construction
    graph: ClothingShoeSlippersLizard
    node: shoes
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 60
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber # Lose some fiber from gutting the lizard and turning it into a shoe. You monster.
        Quantity: 20
      - ReagentId: JuiceThatMakesYouWeh
        Quantity: 20

