- type: entity
  parent: ClothingShoesBase
  id: ClothingShoesSnakeskinBoots
  name: 蛇皮靴 | snakeskin boots
  description: 這雙由曾經極為珍貴的蛇皮製成的靴子，周遭的人肯定都會羨慕不已。 | Boots made of once-valuable snakeskin, everyone around you would have been jealous.
  components:
