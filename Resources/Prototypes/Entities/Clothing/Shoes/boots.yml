  - type: Sprite
    sprite: Clothing/Shoes/Boots/winterbootsweb.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Boots/winterbootsweb.rsi
  - type: FlavorProfile
    flavors:
      - cobwebs
    ignoreReagents:
      - Fiber
  - type: Solution
    solution: # 20 (10 (fiber count of web) * 2 (to craft))
      reagents:
      - ReagentId: Fiber
        Quantity: 20
  - type: ToolRefinable
    refineResult:
    - id: MaterialWebSilk1
      amount: 2
  - type: Construction
    graph: WebObjects
    node: boots

