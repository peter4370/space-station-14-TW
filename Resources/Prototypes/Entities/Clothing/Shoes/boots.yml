  id: ClothingShoesBootsWinterWeb
  name: 網路冬季靴 | web winter boots
  description: 這雙由緻密織帶製成的靴子，能助您度過最嚴寒的冬季。 | Boots made out of dense webbing to help survive even the coldest of winters.
