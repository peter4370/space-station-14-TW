- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesChef
  name: 廚師鞋 | chef shoes
  description: 堅固的鞋子，能將墜落物或刀具造成的傷害降至最低。 | Sturdy shoes that minimize injury from falling objects or knives.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/chef.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/chef.rsi

# stuff common to all clown & jester shoes
- type: entity
  abstract: true
  parent: [ClothingShoesBaseButcherable, ClothingSlotBase]
  id: ClothingShoesClownBase
  components:
  - type: ItemSlots
    slots:
      item:
        name: 服裝-靴子-配槍 | clothing-boots-sidearm
        ejectOnBreak: true
        whitelist:
          tags:
          - ToyKnife
          - ToySidearm

- type: entity
  parent: ClothingShoesClownBase
  id: ClothingShoesClown
  name: 小丑鞋 | clown shoes
  description: "惡作劇者標配的小丑鞋。天啊，這鞋也太大了吧！ | The prankster's standard-issue clowning shoes. Damn they're huge!"
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/clown.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/clown.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
  # for H.O.N.K. construction
  - type: Tag
    tags:
    - ClownShoes
    - WhitelistChameleon

- type: entity
  parent: ClothingShoesClown
  id: ClothingShoesClownBanana
  name: 香蕉小丑鞋 | banana clown shoes
  description: "當幽默與鞋履結合，便能將荒謬感提升至全新境界。 | When humor and footwear combine into new levels of absurdity."
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/clown_banana.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/clown_banana.rsi
  #- type: FootstepModifier You can add a sound effect when you make one that doesn't sound like a dog dying. -emo
  #  footstepSoundCollection:
  #    collection: FootstepSlip
  #    params:
  #      volume: -10
  #      variation: 0.10
  - type: Construction
    graph: BananaClownShoes
    node: shoes
  - type: Skates
    minimumSpeed: 20
    acceleration: 5

- type: entity
  parent: ClothingShoesClownBase
  id: ClothingShoesBling
  name: 閃亮小丑鞋 | bling clown shoes
  description: 採用精煉的香蕉礦製成，並以新鮮香蕉皮的果肉拋光。這些飾品展現出耀眼奪目的風采。 | Made of refined bananium and shined with the pulp of a fresh banana peel. These make a flashy statement.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/bling.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/bling.rsi
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
      params:
        variation: 0.17
  - type: PointLight
    enabled: true
    radius: 3
    energy: 2
    color: "#FFD800"
    netsync: false

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesCult
  name: 經典鞋款 | cult shoes
  description: 一雙由納爾西（Nar'Sie）追隨者所穿的靴子。 | A pair of boots worn by the followers of Nar'Sie.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/cult.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/cult.rsi

- type: entity
  parent: [ ClothingShoesBase, BaseJanitorContraband ]
  id: ClothingShoesGaloshes
  name: 雨鞋 | galoshes
  description: 專為降低清潔人員工作場所事故而設計的防滑橡膠靴；是清潔人員的寶貝。 | Specialised non-slip rubber boots, designed to reduce janitorial workplace accidents; a tider's treasure.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/galoshes.rsi
  - type: NoSlip
  - type: SlowedOverSlippery
    slowdownModifier: 0.7
  - type: SpeedModifierContactCapClothing
    maxContactSprintSlowdown: 0.7
    maxContactWalkSlowdown: 0.7

- type: entity
  parent: [ClothingShoesBaseButcherable, BaseHighlyIllegalContraband]
  id: ClothingShoesSpaceNinja
  name: 太空忍者鞋 | space ninja shoes
  description: 一雙配備內建磁性吸盤的奈米強化靴。 | A pair of nano-enhanced boots with built-in magnetic suction cups.
  components:
  - type: Sprite
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: Clothing
    sprite: Clothing/Shoes/Specific/spaceninja.rsi
  - type: NoSlip
  - type: Magboots # always have gravity because le suction cups
  - type: ClothingSpeedModifier
    # ninja are masters of sneaking around relatively quickly, won't break cloak
    walkModifier: 1.3
    sprintModifier: 1.3
  - type: FootstepModifier
    footstepSoundCollection: null

