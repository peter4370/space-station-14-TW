- type: entity
  parent: [ClothingShoesBase, BaseChameleon]
  id: ClothingShoesChameleon
  name: 黑色鞋子 | black shoes
  suffix: Chameleon
  description: 時尚的黑色鞋子。 | Stylish black shoes.
  components:
    - type: Tag
      tags: # ignore "WhitelistChameleon" tag
      - ClothMade
      - Recyclable
    - type: Sprite
      sprite: Clothing/Shoes/color.rsi
      layers:
      - state: icon
        color: "#3f3f3f"
      - state: soles-icon
    - type: Clothing
      sprite: Clothing/Shoes/color.rsi
      clothingVisuals:
        shoes:
        - state: equipped-FEET
          color: "#1d1d1d"
        - state: soles-equipped-FEET
    - type: Item
      inhandVisuals:
        left:
        - state: inhand-left
          color: "#3f3f3f"
        - state: soles-inhand-left
        right:
        - state: inhand-right
          color: "#3f3f3f"
        - state: soles-inhand-right
    - type: ChameleonClothing
      slot: [FEET]
      default: ClothingShoesColorBlack

- type: entity
  parent: ClothingShoesChameleon
