#EVA Helmet
- type: entity
  parent: ClothingHeadEVAHelmetBase
  id: ClothingHeadHelmetEVA
  name: EVA 頭盔 | EVA helmet
  description: 一款專為太空行走設計、雖舊卻經典的頭盔。因常讓安保人員感到疑神疑鬼而臭名昭著。 | An old-but-gold helmet designed for extravehicular activites. Infamous for making security officers paranoid.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/eva.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/eva.rsi
  - type: Tag
    tags:
    - HelmetEVA
    - WhitelistChameleon
    - CorgiWearable

