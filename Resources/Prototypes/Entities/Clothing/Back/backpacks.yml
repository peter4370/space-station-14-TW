- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackElectropack
  name: electropack | electropack
  suffix: SelfUnremovable
  description: 對該訊號施加電擊。此舉是用來控制一名特別危險的罪犯。 | Shocks on the signal. It is used to keep a particularly dangerous criminal under control.
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/electropack.rsi
    state: icon
  - type: Clothing
    stripDelay: 10
    equipDelay: 5 # to avoid accidentally falling into the trap associated with SelfUnremovableClothing
  - type: SelfUnremovableClothing
  - type: ShockOnTrigger
    targetContainer: true
    damage: 5
    duration: 3
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
      - Trigger

