- type: entity
  abstract: true
  id: BaseSubfloorAnchorStorage
  components:
  - type: Appearance
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Transform
    anchored: false
  - type: BlockAnchorOn
    blacklist:
      components:
      - AnchoredStorageFilter
  - type: Visibility
    layer: 1

- type: entity
  abstract: true
  parent: BaseSubfloorAnchorStorage
  id: BaseSubfloorAnchorStorageAnchored
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: false
    bodyType: Static

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, ClothingBackpackSatchel, BaseMinorContraband ]
  id: ClothingBackpackSatchelSmuggler
  name: 走私者的背包 | smuggler's satchel
  suffix: Empty
  description: 一個方便攜帶、看起來可疑的肩包。厚度剛剛好，可以塞進地磚底下。 | A handy, suspicious looking satchel. Just flat enough to fit underneath floor tiles.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon

- type: entity
  parent: [ BaseSubfloorAnchorStorage, ClothingBackpackSatchel, BaseMinorContraband ]
  id: ClothingBackpackSatchelSmugglerUnanchored
  name: 走私者的背包 | smuggler's satchel
  suffix: Empty, Unanchored
  description: 一個方便攜帶、看起來可疑的肩包。厚度剛剛好，可以塞進地磚底下。 | A handy, suspicious looking satchel. Just flat enough to fit underneath floor tiles.
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, BriefcaseSyndie, BaseMinorContraband ]
  id: BriefcaseSmugglerCash
  name: 走私者的公事包 | smuggler's briefcase
  suffix: Smuggler, Do Not Map
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: SpaceCash5000
          amount: !type:RangeNumberSelector
            range: 1, 11

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, ClothingBackpackDuffelClown, BaseMinorContraband ]
  id: ClothingBackpackDuffelClownSmuggler
  name: 走私者小丑旅行袋 | smuggler's clown duffel bag
  suffix: Smuggler, Do Not Map
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: RandomCapGunTable
        rolls: 4, 7

- type: entity
  parent: ClothingBackpackSatchelSmuggler
  id: ClothingBackpackSatchelSmugglerFilled
  suffix: Smuggler, Do Not Map
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: icon
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        tableId: FillSmugglerBackpack

- type: entity
  parent: MarkerBase
  id: RandomSatchelSpawner
  name: 隨機走私者背包生成器 | random smuggler's satchel spawner
  suffix: Do Not Map
  components:
  - type: Sprite
    layers:
      - sprite: Clothing/Back/Satchels/smuggler.rsi
        state: icon
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomSatchelTable
