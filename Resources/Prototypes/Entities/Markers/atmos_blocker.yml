- type: entity
  name: Atmos Fix 真空標記筆 | Atmos Fix Vacuum Marker
  id: AtmosFixBlockerMarker
  description: "真空，T20C | Vacuum, T20C"
  parent: MarkerBase
  components:
    - type: Sprite
      layers:
        - sprite: Markers/atmos.rsi # {
          state: base
          shader: unshaded
        - sprite: Markers/atmos.rsi
          shader: unshaded # }
          state: vacuum
    - type: AtmosFixMarker
      mode: 1

