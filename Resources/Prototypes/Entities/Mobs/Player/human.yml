#Syndie
- type: entity
  parent: MobHuman
  id: MobHumanSyndicateAgentBase
  name: 辛迪加特工 | syndicate agent
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes: [SyndicateOperativeGearExtremelyBasic]
    roleLoadout: [ RoleSurvivalSyndicate ]
  - type: RandomMetadata
    nameSegments:
    - NamesDeathCommandoFirst
    - NamesDeathCommandoLast
    nameFormat: name-format-standard
  - type: NpcFactionMember
    factions:
    - Syndicate

- type: entity
  parent: MobHumanSyndicateAgentBase
  id: MobHumanSyndicateAgent
  name: 辛迪加特工 | syndicate agent
  suffix: Human, Traitor
  components:
  # make the player a traitor once its taken
  - type: AutoTraitor
    profile: TraitorReinforcement

- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentMedic
  name: 辛迪加醫護人員 | syndicate medic
  components:
  - type: Loadout
    prototypes: [SyndicateReinforcementMedic]
    roleLoadout: [ RoleSurvivalSyndicate ]

- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentSpy
  name: 辛迪加間諜 | syndicate spy
  components:
  - type: Loadout
    prototypes: [SyndicateReinforcementSpy]
    roleLoadout: [ RoleSurvivalSyndicate ]

- type: entity
  parent: MobHumanSyndicateAgent
  id: MobHumanSyndicateAgentThief
  name: 辛迪加竊賊 | syndicate thief
  components:
  - type: Loadout
    prototypes: [SyndicateReinforcementThief]
    roleLoadout: [ RoleSurvivalSyndicate ]

- type: entity
  parent: MobHumanSyndicateAgentBase
  id: MobHumanSyndicateAgentNukeops # Reinforcement exclusive to nukeops uplink
  suffix: Human, NukeOps
  components:
  - type: NukeOperative
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-operator
  - type: Loadout
    prototypes: [SyndicateOperativeGearFullNoUplink]

# Nuclear Operative
- type: entity
  categories: [ HideSpawnMenu ]
  name: 核武特工 | Nuclear Operative
  parent: MobHuman
  id: MobHumanNukeOp
  components:
  - type: NukeOperative
  - type: RandomHumanoidAppearance

- type: entity
  categories: [ HideSpawnMenu ]
  parent: MobHuman
  id: MobHumanLoneNuclearOperative
  name: 獨行特工 | Lone Operative
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: NukeOperative
  - type: Loadout
    prototypes: [SyndicateLoneOperativeGearFull]
    roleLoadout: [ RoleSurvivalSyndicate ]
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicatePrefix
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-generic
  - type: NpcFactionMember
    factions:
    - Syndicate

# Wizard
- type: entity
  categories: [ HideSpawnMenu ]
  name: 巫師 | Wizard
  parent: MobHuman
  id: MobHumanWizard
  components:
  - type: RandomHumanoidAppearance
  - type: NpcFactionMember
    factions:
    - Wizard
