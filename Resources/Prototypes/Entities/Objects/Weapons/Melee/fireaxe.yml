- type: entity
  name: 消防斧 | fireaxe
  parent: [BaseItem, BaseEngineeringContraband]
  id: FireAxe
  description: 這確實是瘋子的武器。誰會想到用斧頭來火攻呢？ | Truly, the weapon of a madman. Who would think to fight fire with an axe?
  components:
  - type: Tag
    tags:
    - FireAxe
  - type: Execution
    doAfterDuration: 4.0
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    attackRate: 0.75
    damage:
      types:
        # axes are kinda like sharp hammers, you know?
        Blunt: 5
        Slash: 10
        Structural: 5
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 10
        Structural: 15
  - type: Item
    shape:
    - 1,0,2,5
    - 0,0,0,2
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/fireaxe.rsi
    size: Ginormous
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxe.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: Tool
    qualities:
    - Prying
    - Slicing
    - Sawing
  - type: ToolTileCompatible
  - type: Prying
  - type: UseDelay
    delay: 1
  - type: StealTarget
    stealGroup: FireAxe
  - type: IgniteOnMeleeHit
    fireStacks: -4

- type: entity
  id: FireAxeFlaming
  name: 消防斧 | fire axe
  parent: [ BaseSyndicateContraband, FireAxe ]
  description: 既然可以同時用火和斧頭對抗火勢，何必只用斧頭來撲火呢？現已配備堅固耐用的橡膠握柄！ | Why fight fire with an axe when you can fight with fire and axe? Now featuring rugged rubberized handle!
  components:
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
  - type: Item
    shape:
    - 1,0,2,5
    - 0,0,0,2
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    size: Ginormous
  - type: IgniteOnMeleeHit
    fireStacks: 1
  - type: Sprite
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Weapons/Melee/fireaxeflaming.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
