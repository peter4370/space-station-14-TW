- type: entity
  name: 儀式匕首 | ritual dagger
  parent: BaseItem
  id: RitualDagger
  description: 一把奇特的匕首，常被邪惡組織用於儀式與獻祭。 | A strange dagger used by sinister groups for rituals and sacrifices.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  name: 詭異之刃 | eldritch blade
  parent: BaseItem
  id: EldritchBlade
  description: 一把迸發著邪惡能量的嗡鳴之劍。 | A sword humming with unholy energy.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75
    damage:
      types:
        Slash: 16
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_blade.rsi
    slots:
    - back
  - type: DisarmMalus

- type: entity
  name: 不聖之鉞 | unholy halberd
  parent: BaseItem
  id: UnholyHalberd
  description: 一把似乎與其持有者息息相關的戰斧。 | A poleaxe that seems to be linked to its wielder.
  components:
  - type: Tool
    qualities:
    - Slicing
    - Sawing
  - type: Tag
    tags:
    - FireAxe
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 0.75
    damage:
      types:
        Blunt: 10
        Slash: 10
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 5
        Slash: 5
  - type: Item
    size: Ginormous
    shape:
    - 0,0,2,1
    - 1,2,1,5
    storedRotation: -45
  - type: Clothing
    sprite: Objects/Weapons/Melee/cult_halberd.rsi
    quickEquip: false
    slots:
    - back
  - type: UseDelay
    delay: 1
