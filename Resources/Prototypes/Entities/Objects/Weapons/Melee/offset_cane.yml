  id: OffsetCaneMime
  name: 條紋偏心手杖 | striped offset cane
  description: 一根黑白條紋手杖，非常適合用於無聲表演。 | A black and white striped cane, perfect for silent performances.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/mime.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/offset_canes/mime.rsi

