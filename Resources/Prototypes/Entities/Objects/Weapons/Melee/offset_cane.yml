- type: entity
  parent: BaseItem
  id: OffsetCane
  name: 標準偏移手杖 | standard offset cane
  description: 一支標準的偏心手杖，當雙腿無法勝任行走任務時，它是行動不可或缺的輔助工具。至於能否因此賦予你長者的智慧，那就不得而知了。 | A standard offset cane, essential for getting around when your legs aren't up to the task. May or may not grant you the wisdom of the elderly.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
    state: icon
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/offset_canes/standard.rsi
  - type: MobilityAid
#  - type: RandomSprite # Ideally I'd rather these be their own selectable item instead of randomly picked.
#    available:
#    - color: "#91949C"  # standard gray
#    - color: "#000000"  # black
#    - color: "#406BDE"  # blue
#    - color: "#00FFFF"  # cyan
#    - color: "#00FF00"  # green
#    - color: "#FF69B4"  # pink
#    - color: "#800080"  # purple
#    - color: "#FF0000"  # red
#    - color: "#FFFF00"  # yellow
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 5
  - type: StaminaDamageOnHit
    damage: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 3
  - type: UseDelay
    delay: 1

- type: entity
  parent: OffsetCane
  id: OffsetCaneClown
  name: 彩虹漸變手杖 | rainbow offset cane
  description: 一支彩虹色偏移手杖，非常適合小丑，以及那些喜歡在生活中增添一抹色彩的人。 | A rainbow offset cane, perfect for clowns and those who enjoy a splash of color in their lives.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/offset_canes/clown.rsi

- type: entity
