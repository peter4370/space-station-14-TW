  name: 灰色平頂帽 | grey flatcap
  description: 無論是勞工階級還是老詹金斯，這頂帽子都十分時髦。帽簷裡藏著玻璃碎片。 | Fashionable for both the working class and old man Jenkins. It has glass shards hidden in the brim.
