- type: entity
  parent: BaseItem
  id: BaseKnife
  abstract: true
  components:
  - type: Tag
    tags:
    - Knife
  - type: Execution
    doAfterDuration: 4.0
  - type: Utensil
    types:
      - Knife
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Sprite
  - type: Item
    size: Small
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg

- type: entity
  parent: BaseKnife
  id: KitchenKnife
  name: 廚房刀 | kitchen knife
  description: 由 Asters Merchant Guild 製造的一把通用型主廚刀。保證未來多年都能保持鋒利。 | A general purpose Chef's Knife made by Asters Merchant Guild. Guaranteed to stay sharp for years to come..
  components:
  - type: Tag
    tags:
    - Knife
    - KitchenKnife
  - type: Sprite
    sprite: Objects/Weapons/Melee/kitchen_knife.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/kitchen_knife.rsi
    storedOffset: -1,1
    storedRotation: -45
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.35,-0.2
          - -0.2,-0.35
          - 0.4,0.25
          - 0.25,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  name: 屠夫的菜刀 | butcher's cleaver
  parent: BaseKnife
  id: ButchCleaver
  description: 一把用於剁切和切碎肉類的巨大刀。其適用對象包括小丑及其衍生產品。 | A huge blade used for chopping and chopping up meat. This includes clowns and clown-by-products.
  components:
  - type: Tag
    tags:
    - Knife
    - Cleaver
  - type: Sprite
    sprite: Objects/Weapons/Melee/cleaver.rsi
    state: butch
  - type: MeleeWeapon
    wideAnimationRotation: -115
    attackRate: 1.5
    damage:
      types:
        Slash: 13
  - type: Item
    size: Normal
    sprite: Objects/Weapons/Melee/cleaver.rsi
  - type: GuideHelp
    guides:
    - Chef
    - FoodRecipes
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.48,-0.15
          - -0.3,-0.48
          - 0.48,-0.075
          - 0.3,0.3
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  name: 戰鬥刀 | combat knife
  parent: [BaseKnife, BaseSecurityContraband]
  id: CombatKnife
  description: 一把專為近身搏鬥設計的致命刀具。 | A deadly knife intended for melee confrontations.
  components:
  - type: Tag
    tags:
    - CombatKnife
    - Knife
  - type: Sprite
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 12
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 10
  - type: Item
    sprite: Objects/Weapons/Melee/combat_knife.rsi
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/combat_knife.rsi
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 225
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
          - -0.4,-0.2
          - -0.2,-0.4
          - 0.4,0.2
          - 0.2,0.4
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2

- type: entity
  name: 求生刀 | survival knife
  parent: [BaseSecurityCargoContraband, CombatKnife]
  id: SurvivalKnife
  description: 對抗太空鯉魚的首選暨最終手段。 | Weapon of first and last resort for combatting space carp.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/survival_knife.rsi
    state: icon
  - type: Item
    sprite: Objects/Weapons/Melee/survival_knife.rsi
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/survival_knife.rsi

- type: entity
  name: 庫克里刀 | kukri knife
  parent: [BaseSecurityCargoContraband, CombatKnife]
  id: KukriKnife
  description: 專業人士有其標準。要彬彬有禮。要高效。並要擬定計畫，將你遇到的每個人都殺光。 | Professionals have standards. Be polite. Be efficient. Have a plan to kill everyone you meet.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/kukri_knife.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 15
  - type: Item
    sprite: Objects/Weapons/Melee/kukri_knife.rsi
    storedSprite: null

- type: entity
  parent: [ CombatKnife, BaseXenoborgContraband ]
  id: XenoborgBioKnife
  name: 生物刀 | bio knife
  description: 會與特定代謝型目標融合，並對這些目標造成額外傷害！ | Melds itself to specific metabolizers and will deal extra damage to those targets!
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/bioknife.rsi
    state: icon
  - type: MeleeWeapon
    attackRate: 1.0
    damage:
      types:
        Slash: 10
  - type: Item
    sprite: Objects/Weapons/Melee/bioknife.rsi
  - type: BonusDamageOnMetabolism
    selectedMetabolizer: Human
    excludedMetabolizers:
    - Vox # Their biology is resistant to this!
    # The rest of these are just so we don't clog up the menu with useless items.
    - Bloodsucker
    - Dragon
    - Changeling
    damage:
      types:
        Poison: 10

- type: entity
