- type: entity
  parent: WeaponWandBase
  id: WeaponWandPolymorphBase
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: poly
    - state: poly-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCarp
    capacity: 5

- type: entity
  name: 鯉魚變形魔杖 | wand of carp polymorph
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphCarp
  description: 因為當你需要快速準備一條鯉魚柳，而那條「小丑」看起來肉質鮮嫩多汁的時候。 | For when you need a carp filet quick and the clown is looking juicy.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCarp
    capacity: 5
    count: 5

- type: entity
  name: 猴形變幻魔杖 | wand of monkey polymorph
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphMonkey
  description: 當你需要一位猴子朋友的時候。 | For when you need a monkey friend.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltMonkey
    capacity: 5
    count: 5

- type: entity
  name: 火球法杖 | wand of fireball
  parent: WeaponWandBase
  id: WeaponWandFireball
  description: 天啊！ | Great big balls of fire!
  components:
  - type: Sprite
    layers:
    - state: fire
    - state: fire-effect
      map: ["effect"]
  - type: Gun
    fireRate: 0.25
    soundGunshot:
      path: /Audio/Magic/fireball.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectileFireball
    capacity: 5
    count: 5

- type: entity
  name: 置物櫃的魔杖 | wand of the locker
  description: 讓書呆子們保持距離！ | Stuff nerds at a distance!
  parent: WeaponWandBase
  id: WeaponWandLocker
  components:
  - type: Sprite
    layers:
    - state: locker
      map: ["base"]
    - state: locker-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_animation.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectileLocker
    capacity: 5
    count: 5
  - type: Item
    size: Normal
    inhandVisuals:
      left:
      - state: locker-inhand-left
      right:
      - state: locker-inhand-right
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        effect:
          True: { visible: False }
          False: { visible: True }
        base:
          True: { visible: True }
          False: { visible: False }

- type: entity
  name: 瞬間致死魔法杖 | magical wand of instant death
  parent: WeaponWandBase
  id: WeaponWandDeath
  description: 唯有「太空巫師」研發團隊中最優秀、最聰明的成員齊心協力，才打造出這件傑作。 | Only the best and brightest of the Space Wizards R&D team worked together to create this beauty.
  components:
  - type: Sprite
    layers:
    - state: death
    - state: death-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mateba.ogg # PUNCH
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: BulletInstakillMagic
    capacity: 3
    count: 3

- type: entity
  name: 進入之杖 | wand of entrance
  parent: WeaponWandBase
  id: WeaponWandPolymorphDoor
  description: 當你需要一條逃離路線時。 | For when you need a get-away route.
  components:
  - type: Sprite
    layers:
    - state: door
    - state: door-effect
      map: ["effect"]
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_door.ogg
    projectileSpeed: 25
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltDoor
    capacity: 10
    count: 10

- type: entity
  name: 小丑魔杖 | wand of cluwning
  parent: WeaponWandPolymorphBase
  id: WeaponWandCluwne
  description: 把他們變成小丑，讓他們的處境更加惡劣。 | Make their situation worse by turning them into a cluwne.
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltCluwne
    capacity: 3
    count: 3

- type: entity
  parent: WeaponWandPolymorphBase
  id: WeaponWandPolymorphBread
  name: 魔法麵包棒 | magic bread wand
  description: 把所有朋友都變成麵包吧！你的老闆！你的敵人！你的狗！把所有東西都變成麵包！ | Turn all your friends into bread! Your boss! Your enemies! Your dog! Make everything bread!
  components:
  - type: BasicEntityAmmoProvider
    proto: ProjectilePolyboltBread
    capacity: 10
    count: 10
