# Rockets

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocket
  name: PG-7VL 手榴彈 | PG-7VL grenade
  description: 一款專為 RPG-7 火箭筒設計的 1.5 型彈頭。呈管狀。 | A 1.5 warhead designed for the RPG-7 launcher. Has tubular shape.
  components:
  - type: Tag
    tags:
      - CartridgeRocket
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletRocket
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    state: rpg
  - type: StaticPrice
    price: 20

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: CartridgeRocketSlow
  name: PG-7VL 手榴彈「蝸牛火箭」 | PG-7VL grenade "Snail-Rocket"
  description: 一款專為 RPG-7 火箭筒設計的 1.5 型彈頭。其飛行速度異常緩慢。 | A 1.5 warhead designed for the RPG-7 launcher. It's unusually slow.
  components:
    - type: Tag
      tags:
        - CartridgeRocket
    - type: Item
      size: Small
    - type: CartridgeAmmo
      proto: BulletWeakRocket
      deleteOnSpawn: true
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
      state: frag
    - type: StaticPrice
      price: 20

# Grenades

- type: entity
  abstract: true
  parent: [BaseItem, BaseMajorContraband]
  id: BaseGrenade
  name: 基礎手榴彈 | base grenade
  components:
  - type: Tag
    tags:
    - Grenade
  - type: Item
    size: Small
  - type: Sprite

- type: entity
  parent: BaseGrenade
  id: GrenadeBaton
  name: 警棍型手榴彈 | baton grenade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeBaton
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeBlast
  name: 爆破手榴彈 | blast grenade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeBlast
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: blast
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeFlash
  name: 閃光彈 | flash grenade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeFlash
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: flash
