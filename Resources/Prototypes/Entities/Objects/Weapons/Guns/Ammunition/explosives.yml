- type: entity
  parent: BaseGrenade
  id: GrenadeFrag
  name: 破片手榴彈 | frag grenade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeFrag
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: frag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeCleanade
  name: 清潔手榴彈彈藥 | cleanade grenade round
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeCleanade
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: cleanade
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeEMP
