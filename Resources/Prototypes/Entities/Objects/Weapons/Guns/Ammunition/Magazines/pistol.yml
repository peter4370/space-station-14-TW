- type: entity
  parent: BaseMagazinePistol
  id: MagazinePistol
  name: 手槍彈匣（.35自動） | pistol magazine (.35 auto)
  description: 適用於手槍的 10 發單排彈匣。設計用於裝填通用動能彈藥。 | 10-round single-stack magazine for pistols. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistol
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

