- type: entity
  parent: [ BaseItem, BaseSecurityContraband ]
  id: MagazinePistolSubMachineGunTopMounted
  name: WT550 彈匣（.35 自動式，頂部裝填） | WT550 magazine (.35 auto top-mounted)
  description: 專為 WT550 衝鋒槍設計的非傳統式 30 發頂部供彈彈匣。適用於裝填通用動能彈藥。 | Unconventional 30-round top feeding magazine for the WT550 SMG. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: Item
    storedRotation: 90
  - type: Tag
    tags:
      - MagazinePistolSubMachineGunTopMounted
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: CartridgePistol
    whitelist:
      tags:
      - CartridgePistol
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Pistol/smg_mag_top_mounted.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-1
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: false
  - type: Appearance
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  parent: MagazinePistolSubMachineGunTopMounted
