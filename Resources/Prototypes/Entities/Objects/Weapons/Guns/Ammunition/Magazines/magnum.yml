  name: 手槍彈匣（.45馬格南） | pistol magazine (.45 magnum)
  description: 適用於大口徑手槍的 7 發單排彈匣。設計用於裝填通用動能彈藥。 | 7-round single stack magazine for large-caliber pistols. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnum
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
