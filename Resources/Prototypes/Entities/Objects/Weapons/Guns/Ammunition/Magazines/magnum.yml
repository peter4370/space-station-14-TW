- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumPractice
  name: 手槍彈匣（.45馬格南練習用） | pistol magazine (.45 magnum practice)
  description: 適用於大口徑手槍的 7 發單排彈匣。專為裝填無害的練習彈藥而設計。 | 7-round single stack magazine for large-caliber pistols. Intended to hold harmless practice ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumPractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: stripe
      color: "#dbdbdb"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#dbdbdb"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#dbdbdb"

