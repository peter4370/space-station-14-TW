- type: entity
  abstract: true
  parent: [ BaseMagazinePistol, BaseSecurityContraband ]
  id: BaseMagazineMagnum
  name: 手槍彈匣（.45馬格南） | pistol magazine (.45 magnum)
  components:
  - type: Tag
    tags:
      - MagazineMagnum
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeMagnum
    capacity: 7

- type: entity
  parent: BaseMagazineMagnum
  id: MagazineMagnumEmpty
  name: 手槍彈匣（任何型號的 .45 馬格南） | pistol magazine (.45 magnum any)
  suffix: empty
  description: 適用於大口徑手槍的 7 發單排彈匣。 | 7-round single stack magazine for large-caliber pistols.
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

- type: entity
  parent: BaseMagazineMagnum
