- type: entity
  abstract: true
  parent: [ BaseItem, BaseSecurityContraband ]
  id: BaseMagazineShotgun
  name: 彈藥鼓（.50口徑子彈） | ammo drum (.50 shells)
  components:
  - type: Tag
    tags:
    - MagazineShotgun
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - ShellShotgun
    capacity: 8
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#d73307"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#d73307"
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Shotgun/m12.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineShotgunEmpty
  name: 彈藥鼓（任何型號的.50口徑子彈） | ammo drum (.50 shells any)
  suffix: empty
  description: 一種大型鼓狀彈匣，用於某些軍用級自動霰彈槍。 | A large drum magazine used by some military-grade automatic shotguns.
  parent: BaseMagazineShotgun
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  parent: BaseMagazineShotgun
  id: MagazineShotgun
  name: 彈鼓（.50 錘頭彈） | ammo drum (.50 pellet)
  description: 一種用於部分軍用級自動霰彈槍的大型鼓狀彈匣。設計用於裝載通用動能彈藥。 | A large drum magazine used by some military-grade automatic shotguns. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgun
  - type: Sprite
    layers:
    - state: pellets
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#ba7710"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#ba7710"

- type: entity
  parent: BaseMagazineShotgun
  id: MagazineShotgunBeanbag
  name: 彈藥鼓（.50 豆袋彈） | ammo drum (.50 beanbag)
  description: 一種用於部分軍用級自動霰彈槍的大型鼓狀彈匣。設計用途是裝載非致命性的豆袋彈。 | A large drum magazine used by some military-grade automatic shotguns. Intended to hold less-than-lethal beanbag ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: ShellShotgunBeanbag
  - type: Sprite
    layers:
    - state: beanbag
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#30722d"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#30722d"

