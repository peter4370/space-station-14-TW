  description: 一種用於部分軍用級自動霰彈槍的大型鼓狀彈匣。專門用於裝載自燃式燃燒彈藥。 | A large drum magazine used by some military-grade automatic shotguns. Intended to hold self-igniting incendiary ammunition.
