- type: entity
  abstract: true
  parent: [ BaseCartridge, BaseSecurityContraband ]
  id: BaseCartridgeRifle
  name: 子彈（.20 步槍） | cartridge (.20 rifle)
  components:
  - type: Tag
    tags:
      - CartridgeRifle
  - type: CartridgeAmmo
    proto: BulletRifle
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifle
  name: 子彈（.20 步槍） | cartridge (.20 rifle)
  description: 一種用於戰鬥步槍的現代中口徑彈藥。標準動能彈藥在大多數情況下都很常見且實用。 | A modern intermediate cartridge for combat rifles. Standard kinetic ammunition is common and useful in most situations.
  components:
  - type: CartridgeAmmo
    proto: BulletRifle

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRiflePractice
  name: 子彈（.20 步槍練習用） | cartridge (.20 rifle practice)
  description: 一種用於戰鬥步槍的現代化中口徑彈藥。練習彈會發射一顆石灰彈頭，雖然會帶來些許刺痛感，但除此之外並不會造成任何持久性傷害。 | A modern intermediate cartridge for combat rifles. Practice ammunition fires a chalk projectile that stings a little, but otherwise causes no lasting damage.
  components:
  - type: CartridgeAmmo
    proto: BulletRiflePractice
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#dbdbdb"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleIncendiary
  name: 子彈（.20 步槍燃燒彈） | cartridge (.20 rifle incendiary)
  description: 一種用於戰鬥步槍的現代中口徑彈藥。燃燒彈內含自燃化合物，能使目標起火燃燒。 | A modern intermediate cartridge for combat rifles. Incendiary ammunition contains a self-igniting compound that sets targets ablaze.
  components:
  - type: CartridgeAmmo
    proto: BulletRifleIncendiary
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#ff6e52"

- type: entity
  parent: BaseCartridgeRifle
  id: CartridgeRifleUranium
  name: 子彈（.20 步槍鈾彈） | cartridge (.20 rifle uranium)
  description: 一種用於作戰步槍的現代化中口徑子彈。鈾彈藥以裂變材料取代子彈的鉛芯，從內部對目標進行輻射照射。 | A modern intermediate cartridge for combat rifles. Uranium ammunition replaces the lead core of the bullet with fissile material, irradiating targets from the inside.
  components:
  - type: CartridgeAmmo
    proto: BulletRifleUranium
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#65fe08"
