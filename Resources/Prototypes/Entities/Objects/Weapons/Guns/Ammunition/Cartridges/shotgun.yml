- type: entity
  abstract: true
  parent: BaseCartridge
  id: BaseShellShotgun
  name: 彈殼（.50） | shell (.50)
  components:
  - type: Tag
    tags:
    - ShellShotgun
  - type: CartridgeAmmo
    soundEject:
      collection: ShellEject
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/shotgun_shell.rsi
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityBartenderContraband ]
  id: ShellShotgunBeanbag
  name: 彈殼（.50 豆袋彈） | shell (.50 beanbag)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。豆袋彈藥內含一枚非致命性彈頭，可使目標昏迷。 | The standard cartridge used by most modern shotguns. Beanbag ammunition contains a single less-than-lethal projectile that can stun targets.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: beanbag
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunBeanbag
  - type: SpentAmmoVisuals
    state: "beanbag"

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband]
  id: ShellShotgunSlug
  name: 彈殼（.50 口徑子彈） | shell (.50 slug)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。單發彈（Slug）彈藥內含一顆高密度彈頭，其有效射程比散彈（Pellet）彈藥更遠。 | The standard cartridge used by most modern shotguns. Slug ammunition contains a single high-density projectile effective at longer ranges than pellet ammunition.
  components:
  - type: Sprite
    layers:
      - state: slug
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunSlug
  - type: SpentAmmoVisuals
    state: "slug"

- type: entity
  parent: BaseShellShotgun
  id: ShellShotgunFlare
  name: 彈殼（.50 擴口） | shell (.50 flare)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。照明彈內含一顆燃燒明亮的彈頭，其用途在於照明與信號傳達，而非作戰。 | The standard cartridge used by most modern shotguns. Flare ammunition contains a single brightly-burning projectile intended for illumination and signalling, rather than combat.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: flare
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunFlare
  - type: SpentAmmoVisuals
    state: "flare"

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband ]
  id: ShellShotgun
  name: 彈殼（.50 號彈丸） | shell (.50 pellet)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。標準動能彈藥在大多數情況下都很常見且實用。 | The standard cartridge used by most modern shotguns. Standard kinetic ammunition is common and useful in most situations.
  components:
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunSpread

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband ]
  id: ShellShotgunIncendiary
  name: 炮彈（.50 燃燒彈） | shell (.50 incendiary)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。燃燒彈內含一種自燃化合物，能使目標起火燃燒。 | The standard cartridge used by most modern shotguns. Incendiary ammunition contains a self-igniting compound that sets targets ablaze.
  components:
  - type: Sprite
    layers:
      - state: incendiary
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunIncendiarySpread
  - type: SpentAmmoVisuals
