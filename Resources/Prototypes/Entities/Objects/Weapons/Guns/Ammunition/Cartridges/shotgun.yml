- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband ]
  id: ShellShotgunPractice
  name: 子彈（.50 練習用） | shell (.50 practice)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。練習用彈藥會射出石灰彈丸，雖然會帶來些許刺痛感，但除此之外並不會造成任何持久的傷害。 | The standard cartridge used by most modern shotguns. Practice ammunition fires chalk pellets that sting a little, but otherwise cause no lasting damage.
  components:
  - type: Sprite
    layers:
      - state: practice
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunPracticeSpread
  - type: SpentAmmoVisuals
    state: "practice"

- type: entity
  parent: [ SolutionAmmo, SolutionToolVeryTiny, BaseShellShotgun, BaseSecurityContraband ]
  id: ShellTranquilizer
  name: 彈殼（.50 鎮靜劑） | shell (.50 tranquilizer)
  description: 這是大多數現代霰彈槍所使用的標準彈匣。鎮靜劑彈藥內含一支裝有強力鎮靜劑的彈道注射器，能讓目標安全地陷入睡眠。 | The standard cartridge used by most modern shotguns. Tranquilizer ammunition contains a single ballistic syringe loaded with a strong sedative that harmlessly puts targets to sleep.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: tranquilizer
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: CartridgeAmmo
    proto: PelletShotgunTranquilizer
  - type: ChemicalAmmo
  - type: Solution
    solution:
      reagents:
      - ReagentId: ChloralHydrate
        Quantity: 7.5
  - type: SolutionTransfer
    maxTransferAmount: 7
  - type: SpentAmmoVisuals
    state: "tranquilizer"

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband ]
  id: ShellShotgunImprovised
  name: 自製霰彈槍彈殼 | improvised shotgun shell
  description: 一枚裝有玻璃碎片塊的自製霰彈槍彈。效果出乎意料地好，但彈著範圍過於廣泛，連穀倉那樣寬闊的目標都打不中。 | A homemade shotgun shell loaded with chunks of glass shrapnel. Surprisingly effective, but the spread is so wide that you couldn't hit the broad side of a barn.
  components:
  - type: Tag
    tags:
    - ShellShotgun
    - ShellShotgunLight
  - type: Sprite
    layers:
      - state: improvised
        map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Construction
    graph: ImprovisedShotgunShellGraph
    node: shell
  - type: CartridgeAmmo
    proto: PelletShotgunImprovisedSpread
  - type: SpentAmmoVisuals
    state: "improvised"

- type: entity
  parent: [ BaseShellShotgun, BaseSecurityContraband ]
  id: ShellShotgunUranium
  name: 鈾製霰彈槍彈殼 | uranium shotgun shell
  description: 這是大多數現代霰彈槍所使用的標準彈匣。鈾彈藥將霰彈的鉛芯替換為裂變材料，從內部輻射目標。 | The standard cartridge used by most modern shotguns. Uranium ammunition replaces the lead core of the pellets with fissile material, irradiating targets from the inside.
  components:
    - type: Sprite
      layers:
        - state: depleted-uranium
          map: [ "enum.AmmoVisualLayers.Base" ]
    - type: CartridgeAmmo
      proto: PelletShotgunUraniumSpread
    - type: SpentAmmoVisuals
      state: "depleted-uranium"
