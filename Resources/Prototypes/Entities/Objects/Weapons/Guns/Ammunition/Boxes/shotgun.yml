- type: entity
  abstract: true
  parent: BaseItem
  id: BaseAmmoProvider
  components:
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Item
    size: Normal
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi

- type: entity
  abstract: true
  parent: BaseAmmoProvider
  id: AmmoProviderShotgunShell
  components:
    - type: Sprite
      sprite: Objects/Weapons/Guns/Ammunition/Boxes/shotgun.rsi
    - type: BallisticAmmoProvider
      mayTransfer: true
      whitelist:
        tags:
        - ShellShotgun
      capacity: 16
    - type: MagazineVisuals
      magState: mag
      steps: 5
      zeroVisible: false
    - type: Appearance

# Shotgun Shells
- type: entity
  parent: AmmoProviderShotgunShell
  id: BoxBeanbag
  name: 彈藥箱（.50 豆袋彈） | ammunition box (.50 beanbag)
  description: 一個裝有.50口徑霰彈槍彈的紙箱。原本是用來裝非致命性豆袋彈的。 | A cardboard box of .50 shotgun shells. Intended to hold less-than-lethal beanbag ammunition.
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgunBeanbag
    - type: MagazineVisuals
      magState: mag-beanbag
      steps: 5
      zeroVisible: false
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-beanbag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: beanbag

- type: entity
  parent: AmmoProviderShotgunShell
  id: BoxLethalshot
  name: 彈藥箱（.50 鉛彈） | ammunition box (.50 pellet)
  description: 一盒 .50 口徑霰彈槍彈藥的紙盒。原設計用於盛裝通用動能彈藥。 | A cardboard box of .50 shotgun shells. Intended to hold general-purpose kinetic ammunition.
  components:
    - type: BallisticAmmoProvider
      proto: ShellShotgun
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: lethal

