  name: 彈藥箱（.35自動手槍鈾彈） | ammunition box (.35 auto uranium)
  description: 一個裝有.35自動手槍子彈的紙箱。原本是用來裝載特殊鈾芯彈藥的。 | A cardboard box of .35 auto rounds. Intended to hold exotic uranium-core ammunition.
