- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxPistol
  name: 彈藥箱（.35自動手槍） | ammunition box (.35 auto)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgePistol
    proto: CartridgePistol
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/pistol.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistol
  name: 彈藥箱（.35自動手槍） | ammunition box (.35 auto)
  description: 一個裝有 .35 自動手槍子彈的紙箱。原定用於盛裝通用動能彈藥。 | A cardboard box of .35 auto rounds. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistol
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxPistol
  id: MagazineBoxPistolPractice
  name: 彈藥箱（.35自動手槍練習用） | ammunition box (.35 auto practice)
  description: 一個裝有.35自動手槍子彈的紙箱。原意是存放無害的練習彈藥。 | A cardboard box of .35 auto rounds. Intended to hold harmless practice ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgePistolPractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: practice

- type: entity
  id: MagazineBoxPistolIncendiary
  parent: BaseMagazineBoxPistol
  name: 彈藥箱（.35 自動式燃燒彈） | ammunition box (.35 auto incendiary)
  description: 一盒 .35 自動手槍子彈的紙盒。原定用於裝載自燃式燃燒彈。 | A cardboard box of .35 auto rounds. Intended to hold self-igniting incendiary ammunition.
