- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxRifle
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle
    proto: CartridgeRifle
    capacity: 50
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifleBig
  name: 彈藥箱（.20 步槍） | ammunition box (.20 rifle)
  suffix: Big
  components:
  - type: BallisticAmmoProvider
    capacity: 200
    proto: CartridgeRifle
  - type: Sprite
    layers:
    - state: base-big
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-big-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag-big
    steps: 4
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRifle
  name: 彈藥箱（.20 步槍） | ammunition box (.20 rifle)
  description: 一盒裝有.20口徑步槍子彈的紙箱。原定用於存放通用動能彈藥。 | A cardboard box of .20 rifle rounds. Intended to hold general-purpose kinetic ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRifle
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: BaseMagazineBoxRifle
  id: MagazineBoxRiflePractice
  name: 彈藥箱（.20口徑步槍練習用） | ammunition box (.20 rifle practice)
  description: 一個裝有.20口徑步槍子彈的紙箱。原本是用來裝無害的練習彈藥的。 | A cardboard box of .20 rifle rounds. Intended to hold harmless practice ammunition.
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRiflePractice
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: practice

- type: entity
  id: MagazineBoxRifleIncendiary
  parent: BaseMagazineBoxRifle
  name: 彈藥箱（.20口徑步槍燃燒彈） | ammunition box (.20 rifle incendiary)
  description: 一盒裝有 .20 口徑步槍子彈的紙箱。原定用於裝載自燃式燃燒彈。 | A cardboard box of .20 rifle rounds. Intended to hold self-igniting incendiary ammunition.
