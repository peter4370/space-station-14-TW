- type: entity
  id: MagazineBoxRifleUranium
  parent: BaseMagazineBoxRifle
  name: 彈藥箱（.20口徑步槍鈾彈） | ammunition box (.20 rifle uranium)
  description: 一盒裝有.20口徑步槍子彈的紙箱。原本是用來裝載特殊鈾芯彈藥的。 | A cardboard box of .20 rifle rounds. Intended to hold exotic uranium-core ammunition.
