  id: DrinkMopwataBottleRandom
  name: 美味的莫帕塔 | delicious mopwata
  description: 一瓶霧蒙蒙的棕色玻璃瓶，瓶身上的標籤已褪色，畫著一把拖把。瓶內裝滿了渾濁的……陳年酒液。 | A foggy brown bottle with a faded label depicting a mop. It comes full of murky... vintage.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Mopwata
        Quantity: 50 # Extra space for the random fill
  - type: RandomFillSolution
    solution: drink
    weightedRandomId: RandomFillMopwata
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mopwata.rsi
