- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, SolutionSmall, DrinkBase, DrinkBaseOpenable, DrinkVisualsAllFilled ]
  id: BaseSqueezeBottle
  components:
  - type: Openable
    sound:
      collection: packetOpenSounds
  - type: Sprite
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-6
      map: [ "enum.SolutionContainerLayers.Fill" ] # already has liquid, so no visible: false
    - state: icon-front
      map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 6
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceGlue
  name: 太空膠管 | space glue tube
  description: 這款高性能黏合劑專為極其複雜的機械設備維護而設計。請勿飲用！ | High performance glue intended for maintenance of extremely complex mechanical equipment. DON'T DRINK!
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glue-tube.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceGlue
        Quantity: 60
  - type: Glue

- type: entity
  parent: BaseSqueezeBottle
  id: DrinkSpaceLube
  name: 太空潤滑管 | space lube tube
  description: 一款專為維護極其複雜的機械設備而設計的高性能潤滑劑。 | High performance lubricant intended for maintenance of extremely complex mechanical equipment.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/lube-tube.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 60
  - type: Lube

# Find your nearest clown and give them a gift :o)
- type: entity
  parent: BluespaceBeaker
  id: BottomlessLube
  name: 無底潤滑劑量杯 | bottomless lube beaker
  suffix: DEBUG
  description: 這只異常的燒杯能無限生產太空潤滑劑，因此必須嚴加看管，以免落入不法之徒手中。 | This anomalous beaker infinitely produces space lube and as such is to be closely guarded such that it doesn't fall in the wrong hands.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 960
  - type: SolutionRegeneration
    generated:
      reagents:
      - ReagentId: SpaceLube
        Quantity: 240

- type: entity
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  id: DrinkJarWhat
  name: 一罐什麼東西 | jar of something
  description: 實在很難說這到底是什麼。 | You can't really tell what this is.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jar_what.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true

