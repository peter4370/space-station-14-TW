- type: entity
  abstract: true
  parent: [DrinkBaseMaterialStrongMetal, SolutionSmall, DrinkBase, DrinkBaseOpenable, DrinkVisualsOpenable]
  id: FlaskBase
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Openable
    sound:
      collection: flaskOpenSounds
    closeable: true
    closeSound:
      collection: flaskCloseSounds

# Flasks

- type: entity
  parent: [DrinkBaseMaterialStrongMetal, SolutionSmall, DrinkBase]
  id: DrinkFlaskOld
  name: 舊酒壺 | old flask
  description: 一個破舊的老酒壺，蓋子似乎遺失了。 | A decrepit old flask, its lid seems to be missing.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask_old.rsi
  - type: FitsInDispenser
    solution: drink

- type: entity
  parent: FlaskBase
  id: DrinkShinyFlask
  name: 閃亮的水壺 | shiny flask
  description: 一個閃亮的金屬水壺。上面似乎刻著一個希臘符號。 | A shiny metal flask. It appears to have a Greek symbol inscribed on it.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/shinyflask.rsi

- type: entity
  parent: FlaskBase
  id: DrinkMREFlask
  suffix: Full
  name: MRE 水壺 | MRE flask
  description: 一只舊軍用水壺，裝滿了專為士兵準備的頂級飲品。 | An old military flask, filled with the finest contents for soldiers.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mreflask.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 60
  - type: TrashOnSolutionEmpty
    solution: drink

