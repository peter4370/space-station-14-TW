## Filled

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoco
  name: 熱巧克力 | hot chocolate
  suffix: Full
  description: 一種由融化的巧克力與熱牛奶調製而成的熱飲。 | A heated drink consisting melted chocolate and heated milk.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: HotCocoa
        Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite
    layers:
    - state: icon
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: DrinkBaseMug
  id: DrinkHotCoffee
  name: 咖啡 | coffee
  suffix: Full
  description: 咖啡是一種以咖啡樹的烘焙種子（通常稱為咖啡豆）沖泡而成的飲品。 | Coffee is a brewed drink prepared from roasted seeds, commonly called coffee beans, of the coffee plant.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Coffee
        Quantity: 30
  - type: Icon
    sprite: Objects/Consumable/Drinks/mug.rsi
    state: icon-vend-brown
  - type: Sprite
    layers:
    - state: icon
    - state: fill-3
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: DrinkBaseMug
