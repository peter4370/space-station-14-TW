# A cup is a small container used to hold liquids for drinking.[1]
- type: entity
  abstract: true
  parent: [SolutionTiny, DrinkBase]
  id: DrinkBaseCup
  components:
  - type: Item
    size: Tiny
  - type: FitsInDispenser
    solution: drink
  - type: SolutionTransfer
    canChangeTransferAmount: true
    maxTransferAmount: 10
  - type: StaticPrice
    price: 10

# A mug is a type of cup.[2]
- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPorcelain, DrinkBaseCup, DrinkVisualsFill ]
  id: DrinkBaseMug
  name: 馬克杯 | mug
  description: 一個馬克杯。 | A mug.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mug.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    inHandsFillBaseName: null

## Misc Cups

- type: entity
  parent: [DrinkBaseMaterialGold, DrinkBaseCup]
  id: DrinkGoldenCup
  name: 金盃 | golden cup
  description: 一座金杯。 | A golden cup.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/golden_cup.rsi
  - type: StaticPrice
    price: 125

- type: entity
  parent: DrinkBaseMug # a teacup is basically a mug
  id: DrinkTeacupEmpty
  name: 茶杯 | teacup
  description: 一個素面白色瓷茶杯。 | A plain white porcelain teacup.
  components:
  - type: Solution
    solution:
      maxVol: 17 # About 5 imperial fluid ounces which is the english measurement for a teacup. Also I think fucked up volume sizes are funny. HAHAHAHAHAHAHA
  - type: Sprite
    sprite: Objects/Consumable/Drinks/teacup.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 4

- type: entity
  parent: [ DrinkBaseMaterialGlass, DrinkBaseCup, DrinkVisualsFillOverlay ]
  id: DrinkGlassCoupeShaped
  name: 杯型玻璃杯 | coupe glass
  description: 一款經典的細頸雙耳酒杯，是銀河系各地貨箱上「易碎品」標籤的象徵。 | A classic thin neck coupe glass, the icon of fragile labels on crates around the galaxy.
  components:
  - type: Item
    size: Small
  - type: Sprite
    sprite: Objects/Consumable/Drinks/glass_coupe_shape.rsi
  - type: SolutionContainerVisuals
    inHandsMaxFillLevels: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true

- type: entity
  parent: [DrinkBaseMaterialCardboard, DrinkBaseCup, DrinkBaseEmptyTrash, DrinkVisualsFill]
  id: DrinkWaterCup
  name: 水杯 | water cup
  description: 一個紙製水杯。 | A paper water cup.
  components:
  - type: Solution
    solution:
      maxVol: 10 # Miserably small
  - type: Sprite
    sprite: Objects/Consumable/Drinks/water_cup.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    inHandsFillBaseName: null
  - type: Tag
    tags:
    - Trash
    - WhitelistChameleon
  - type: Clothing
    slots:
    - HEAD
    quickEquip: false
    sprite: Clothing/Head/Hats/party_water_cup.rsi
  - type: SpillWhenWorn
    solution: drink

