  name: Smite 蔓越莓罐頭 | Smite Cranberry can
  description: 大家想來一杯「Smite 蔓越莓」嗎？深受各地管理員喜愛。請適量飲用。節慶限定款！ | Y'all want a Smite Cranberry? Beloved by administrators everywhere. Drink in moderation. A limited run for the holidays!
