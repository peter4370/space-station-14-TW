  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
      - tomato
  - type: Sprite
    state: tomato
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 45
      - ReagentId: Vitamin
        Quantity: 5
  - type: Tag
    tags:
    - Fruit # ???
# Tastes like pasta, tomato.

- type: entity
  parent: [SolutionNormal, FoodNoodlesBase]
  id: FoodNoodlesCopy
  name: 複製文 | copypasta
  description: 你最好別試這個，總聽到大家說這有多糟糕…… | You probably shouldn't try this, you always hear people talking about how bad it is...
