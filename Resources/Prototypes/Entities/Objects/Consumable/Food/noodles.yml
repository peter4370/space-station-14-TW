# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_meal.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionSmall, FoodInjectableBase]
  id: FoodNoodlesBase
  description: 這真是道美味的義大利麵啊！ | Now that's a nice pasta!
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    sprite: Objects/Consumable/Food/noodles.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30

# Noodles

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodlesBoiled
  name: 水煮義大利麵 | boiled spaghetti
  description: 這是一盤普通的麵，需要多加些配料才行。 | A plain dish of noodles, this needs more ingredients.
  components:
  - type: Item
    storedOffset: 0,-4
  - type: FlavorProfile
    flavors:
      - pasta
  - type: Sprite
    state: boiled
# Tastes like pasta.

- type: entity
  parent: FoodNoodlesBase
  id: FoodNoodles
  name: 義大利麵 | spaghetti
  description: 義大利麵配番茄碎。就跟你那個虐待你的父親以前做的一樣！ | Spaghetti and crushed tomatoes. Just like your abusive father used to make!
