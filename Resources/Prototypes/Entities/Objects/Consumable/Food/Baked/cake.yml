# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodCakeBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/cake.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 60
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: Sugar
        Quantity: 10
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - Cake
  - type: SecretStash
    maxItemSize: "Normal"
    secretStashName: secret-stash-cake
    damageEatenItemInside:
      types:
        Slash: 7.5
  - type: ToolOpenable
    openToolQualityNeeded: Slicing
    closeToolQualityNeeded: Slicing
    verbOnly: true
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}

- type: entity
  parent: [SolutionVeryTiny, FoodCakeBase]
  id: FoodCakeSliceBase
  abstract: true
  description: 只是一片蛋糕，足夠大家分了。 | Just a slice of cake, it is enough for everyone.
  components:
  - type: FlavorProfile
    flavors:
      - sweet
  - type: Edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 7.5
      - ReagentId: Vitamin
        Quantity: 1.25
      - ReagentId: Sugar
        Quantity: 1.25
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Cake
    - Slice

# Custom Cake Example

- type: entity
  name: 藍莓蛋糕 | blueberry cake
  parent: [FoodCakeBase, BaseSlicingRefinableFood]
  id: FoodCakeBlueberry
  description: 會讓牙齒變色。 | Stains your teeth.
  components:
  - type: Sprite
    layers:
    - state: plain
    - state: alpha-filling
      color: blue
  - type: ToolRefinable
    refineResult:
    - id: FoodCakeBlueberrySlice
      amount: 8
  - type: Tag
    tags:
    - Cake
    - Fruit
  - type: Item
    inhandVisuals:
      left:
      - state: plain-inhand-left
      - state: alpha-filling-inhand-left
        color: blue
      right:
      - state: plain-inhand-right
      - state: alpha-filling-inhand-right
        color: blue

- type: entity
  name: 藍莓切片 | blueberry slice
  parent: FoodCakeSliceBase
  id: FoodCakeBlueberrySlice
  description: 會讓牙齒變色。 | Stains your teeth.
  components:
  - type: Sprite
    layers:
    - state: plain-slice
    - state: alpha-slice-filling
      color: blue
  - type: Tag
    tags:
    - Cake
    - Fruit
    - Slice
  - type: Item
    inhandVisuals:
      left:
      - state: plain-slice-inhand-left
      - state: alpha-slice-filling-inhand-left
        color: blue
      right:
      - state: plain-slice-inhand-right
      - state: alpha-slice-filling-inhand-right
        color: blue

