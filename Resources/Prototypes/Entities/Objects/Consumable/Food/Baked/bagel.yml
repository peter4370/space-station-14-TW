# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodBagelBase
  description: 一個美味的貝果。 | A delicious bagel.
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bagel.rsi
    state: bagel
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10

- type: entity
  parent: FoodBagelBase
  id: FoodBagel
  name: 貝果 | bagel

- type: entity
  parent: FoodBagelBase
  id: FoodBagelPoppy
  name: 罌粟籽貝果 | poppy seed bagel
  description: 一個美味的貝果，表面撒上了浸泡過比卡里丁(bicaridine)的罌粟籽。 | A delicious bagel topped with bicaridine-infused poppy seeds.
  components:
  - type: FlavorProfile
    flavors:
      - bread
      - medicine
  - type: Sprite
    state: bagel-poppy
  - type: Solution
    solution:
      reagents:
      - ReagentId: Bicaridine
        Quantity: 5
      - ReagentId: Nutriment
        Quantity: 10

- type: entity
  parent: FoodBagelBase
  id: FoodBagelCotton
  name: 棉質貝果 | cotton bagel
  description: 一款以棉花麵團製成的美味貝果。 | A delicious bagel made with cotton dough.
  components:
  - type: FlavorProfile
    flavors:
    - bread
    - cotton
  - type: Sprite
    state: bagel-cottondough
  - type: Edible
    requiresSpecialDigestion: true
  - type: Tag
    tags:
    - ClothMade
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
