# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_baked_whole.yml & food_baked_single.yml
# Base

- type: entity
  abstract: true
  parent: [SolutionNormal, FoodInjectableBase]
  id: FoodBreadBase
  components:
  - type: Item
    size: Normal
  - type: FlavorProfile
    flavors:
      - bread
  - type: Sprite
    sprite: Objects/Consumable/Food/Baked/bread.rsi
  - type: Tag
    tags:
    - Bread
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 80

- type: entity
  parent: [SolutionVeryTiny, FoodBreadBase]
  id: FoodBreadSliceBase
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: FlavorProfile
    flavors:
      - bread
  - type: Tag
    tags:
    - Bread
    - Slice
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10 # 1/8 of a loaf of bread

# Custom Bread Example

- type: entity
  name: 火山麵包 | volcanic loaf
  parent: [FoodBreadBase, BaseSlicingRefinableFood]
  id: FoodBreadVolcanic
  description: 一塊深色的麵包。外觀類似浮石。 | A dark loaf. Resembles pumice.
  components:
  - type: Sprite
    layers:
    - state: alpha
      color: "#281415"
    - state: alpha-filling
      color: "#FF613F"
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadVolcanicSlice
      amount: 8

- type: entity
  name: 火山切片 | volcanic slice
  parent: FoodBreadSliceBase
  id: FoodBreadVolcanicSlice
  description: 一片黑麵包。外觀類似浮石。 | A slice of dark loaf. Resembles pumice.
  components:
  - type: Sprite
    layers:
    - state: alpha-slice
      color: "#281415"
    - state: alpha-slice-filling
      color: "#FF613F"

