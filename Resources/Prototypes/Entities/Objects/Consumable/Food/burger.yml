# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_single.yml
# Bun

- type: entity
  parent: [FoodBreadSliceBase, BaseSlicingRefinableFood]
  id: FoodBreadBun
  name: bun | bun
  description: 一個漢堡麵包。圓圓的，拿起來很方便。 | A hamburger bun. Round and convenient to hold.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
    layers:
    - state: bun
  - type: ToolRefinable
    refineResult:
    - id: FoodBreadBunTop
    - id: FoodBreadBunBottom

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunBottom
  name: 底部麵包胚 | bottom bun
  description: 是時候開始堆疊漢堡塔了。 | It's time to start building the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: Burger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: Solution
    solution:
      maxVol: 7.5
      canReact: false # Dont want cause reactions inside burgers after merging ingredients, TODO Remove
      reagents:
      - ReagentId: Nutriment
        Quantity: 5 # 1/2 of a bun

- type: entity
  parent: FoodBreadSliceBase
  id: FoodBreadBunTop
  name: 高馬尾 | top bun
  description: 為您的漢堡塔畫下完美的句點。 | The perfect finish for your burger tower.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/burger_sequence.rsi
    layers:
    - state: bun_top
  - type: Solution
    solution:
      maxVol: 7.5
      canReact: false # Dont want cause reactions inside burgers after merging ingredients, TODO Remove
      reagents:
      - ReagentId: Nutriment
        Quantity: 5 # 1/2 of a bun
  - type: FoodSequenceElement
    entries:
      Burger: BunTopBurger

# Base

- type: entity
  abstract: true
  parent: FoodInjectableBase
  id: FoodBurgerBase
  components:
  - type: FlavorProfile
    flavors:
      - bun
      - meaty
  - type: Sprite
    sprite: Objects/Consumable/Food/burger.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 30
      - ReagentId: Protein
        Quantity: 10
      - ReagentId: Vitamin
        Quantity: 10
  - type: Item
    sprite: Objects/Consumable/Food/burger.rsi
    shape:
    - 0,0,1,0

