# Cotton Bun

- type: entity
  parent: [FoodBreadSliceBase, BaseSlicingRefinable]
  id: FoodCottonBun
  name: 棉花饅頭 | cotton bun
  description: 一個棉質漢堡麵包。柔軟、圓潤，拿在手上很方便。 | A cotton hamburger bun. Soft, round and convenient to hold.
  components:
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Fiber
        Quantity: 5
  - type: ToolRefinable
    refineTime: 1
    refineResult:
    - id: FoodCottonBunTop
      amount: 1
    - id: FoodCottonBunBottom
      amount: 1
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice


- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunBottom
  name: 棉質底層髮髻 | cotton bottom bun
  description: 是時候讓飛蛾們體驗這座漢堡塔了。 | It's time for moths to experience the burger tower.
  components:
  - type: Item
    size: Normal #patch until there is an adequate resizing system in place
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    drawdepth: Mobs
    noRot: true
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_bottom
    - map: ["foodSequenceLayers"]
  - type: FoodSequenceStartPoint
    key: CottonBurger
    maxLayers: 10
    startPosition: 0, 0
    offset: 0, 0.07
    minLayerOffset: -0.05, 0
    maxLayerOffset: 0.05, 0
    nameGeneration: food-sequence-cotton-burger-gen
  - type: Appearance
  - type: FoodMetamorphableByAdding
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.5
      - ReagentId: Fiber
        Quantity: 2.5
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice

- type: entity
  parent: FoodBreadSliceBase
  id: FoodCottonBunTop
  name: 棉質高馬尾 | cotton top bun
  description: 為您的纖維漢堡塔畫下完美的句點。 | The perfect finish for your fibrous burger tower.
  components:
  - type: Edible
    requiresSpecialDigestion: true
  - type: Sprite
    sprite: Objects/Consumable/Food/cottonburger.rsi
    layers:
    - state: cottonbun_top
  - type: Solution
    solution:
      maxVol: 7.5
      reagents:
      - ReagentId: Nutriment
        Quantity: 2.5
      - ReagentId: Fiber
        Quantity: 2.5
  - type: FoodSequenceElement
    entries:
      CottonBurger: CottonBunTopBurger
  - type: Tag
    tags:
    - ClothMade
    - Bread
    - Slice
