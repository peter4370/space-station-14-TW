# Shakers

- type: entity
  parent: [SolutionVeryTiny, BaseFoodCondiment] # TODO: This should not inherit TrashOnSolutionEmpty, SpaceGarbage and the price of 0
  id: BaseFoodShaker
  abstract: true
  name: 空的搖酒器 | empty shaker
  description: 一種用於儲存和分裝香料的調味料罐。 | A shaker used to store and dispense spices.
  components:
  - type: Item
    size: Tiny
  - type: Edible
    edible: Drink
    solution: food
    destroyOnEmpty: false
    utensil: None # don't conflict with stirring
  - type: SolutionTransfer
    transferAmount: 1
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpillBehavior { }
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    state: shaker-empty
  - type: RefillableSolution
    solution: food

- type: entity
  parent: BaseFoodShaker
  id: FoodShakerSalt
  name: 鹽罐 | salt shaker
  description: 鹽。推測源自太空中的海洋。 | Salt. From space oceans, presumably.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: TableSalt
        Quantity: 15
  - type: Sprite
    state: shaker-salt
  - type: Icon
    state: shaker-salt
  - type: Tag
    tags:
      - SaltShaker

- type: entity
  parent: BaseFoodShaker
  id: FoodShakerPepper
  name: 胡椒罐 | pepper shaker
  description: 常被用來為食物增添風味，或讓人生噴嚏。 | Often used to flavor food or make people sneeze.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Blackpepper
        Quantity: 15
  - type: Sprite
    state: shaker-pepper
  - type: Icon
    state: shaker-pepper
  - type: Tag
    tags:
      - PepperShaker
