# Trash

- type: entity
  parent: BaseItem
  id: FoodFrozenSnowconeTrash
  name: 紙錐 | paper cone
  description: 一個用來裝冰涼點心的皺巴巴紙錐。毫無價值。 | A crumpled paper cone used for an icy treat. Worthless.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    state: cone-trash
  - type: Tag
    tags:
    - Trash

- type: entity
  name: 冰棒棍 | popsicle stick
  parent: BaseItem
  id: FoodFrozenPopsicleTrash
  description: 曾經盛裝著美味的點心。如今，卻已空空如也。 | Once held a delicious treat. Now, 'tis barren.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
    layers:
      - state: stick
        map: [ "enum.DamageStateVisualLayers.Base" ]
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
          stick: ""
          stick2: ""
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage
