# When adding new food also add to random spawner located in Resources\Prototypes\Entities\Markers\Spawners\Random\Food_Drinks\food_snack.yml
# Base

- type: entity
  parent: [SolutionVeryTiny, FoodInjectableBase]
  id: FoodFrozenBase
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Consumable/Food/frozen.rsi
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10

# Ice-cream

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwich
  name: 冰淇淋三明治 | ice-cream sandwich
  description: 附有獨立包裝的便攜式冰淇淋。 | Portable ice-cream in its own packaging.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenSandwichStrawberry
  name: 草莓冰淇淋三明治 | strawberry ice-cream sandwich
  description: 草莓口味的便攜式冰淇淋，附有獨立包裝。 | Portable ice-cream in its own packaging of the strawberry variety.
  components:
  - type: Item
    shape:
    - 0,0,1,0
  - type: Sprite
    state: sandwich-strawberry

- type: entity
  name: 太空冰凍 | space freezy
  parent: FoodFrozenBase
  id: FoodFrozenFreezy
  description: 太空中最好吃的冰淇淋。 | The best ice-cream in space.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  name: 聖代冰淇淋 | ice-cream sundae
  parent: FoodFrozenBase
  id: FoodFrozenSundae
  description: 一道經典的甜點。 | A classic dessert.
  components:
  - type: Sprite
    state: spacefreezy

- type: entity
  parent: FoodFrozenBase
  id: FoodFrozenCornuto
  name: cornuto | cornuto
  description: 一個那不勒斯香草與巧克力口味的冰淇淋甜筒。上面撒了些焦糖堅果，看起來令人垂涎。 | A Neapolitan vanilla and chocolate ice-cream cone. It menaces with a sprinkling of caramelized nuts.
  components:
  - type: Item
    storedRotation: -45
  - type: Sprite
    state: cornuto
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Theobromine
        Quantity: 1

# Popsicle

- type: entity
  name: 橘子霜淇淋 | orange creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleOrange
  description: 一款經典的橘味奶油冰棒。一份充滿陽光氣息的冰涼點心。 | A classic orange creamsicle. A sunny frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: orange
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: 莓果霜淇淋 | berry creamsicle
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleBerry
  description: 一款風味鮮活的莓果奶油冰棒。一款莓果風味絕佳的冰品。 | A vibrant berry creamsicle. A berry good frozen treat.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: popsicle-base
    - state: popsicle
      color: red
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Tag
    tags:
    - Fruit
    - Creamsicle

- type: entity
  name: 巨無霸冰淇淋 | jumbo ice-cream
  parent: FoodFrozenBase
  id: FoodFrozenPopsicleJumbo
  description: 一款裹滿濃郁巧克力的奢華冰淇淋。它的尺寸比你記憶中的要小一些。 | A luxurious ice-cream covered in rich chocolate. It's smaller than you remember.
  components:
  - type: Sprite
    layers:
    - state: stick
    - state: jumbo
  - type: Edible
    trash:
    - FoodFrozenPopsicleTrash
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 10
      - ReagentId: Theobromine
        Quantity: 1

# Snowcone

# Use this one as a base for other colored snowcones. Apply a color to the alpha
# layer depending on soda/syrup/waterever. Name and description will also have
# to be modified.
- type: entity
  name: 甜味刨冰 | sweet snowcone
  #  name: [Flavor] snowcone
  parent: FoodFrozenBase
  id: FoodFrozenSnowconeBase
  description: 這只是刨冰和簡單糖漿，完全不用費什麼功夫。 | It's just shaved ice and simple syrup, minimum effort.
  #  description: [Liquid] drizzled over a snowball in a paper cup.
  components:
    - type: Sprite
      layers:
        - state: cone
        - state: alpha-filling
    #      color: foo
    - type: Edible
      trash:
      - FoodFrozenSnowconeTrash
    - type: Solution
      solution:
        reagents:
          - ReagentId: Ice
            Quantity: 8
          - ReagentId: Water
            Quantity: 2
          - ReagentId: Sugar
            Quantity: 2

- type: entity
  name: 沒有味道的刨冰 | flavorless snowcone
  parent: FoodFrozenSnowconeBase
