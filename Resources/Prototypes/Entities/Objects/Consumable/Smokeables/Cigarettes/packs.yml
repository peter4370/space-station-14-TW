- type: entity
  id: CigPackGreen
  parent: CigPackBase
  name: 斯佩斯曼菸草小包 | Spessman's Smokes packet
  description: 包裝上的標籤寫著：「緩慢地死去，難道不是一種改變嗎？」 | A label on the packaging reads, Wouldn't a slow death make a change?
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/green.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/green.rsi

