        amount: 10

- type: entity
  id: CigPackMixed
  parent: CigPackMixedBase
  name: 丹的濕透香菸 | Dan's soaked smokes
  suffix: Mixed
  description: 丹與 NT 化學部門合作，處理了多餘的化學品，祝您愉快。 | Dan worked with NT chemistry to dispose of excess chemicals, ENJOY.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/Packs/mixed.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:NestedSelector
        rolls: !type:RangeNumberSelector
          range: 2, 9
        tableId: RandomSoakedSmokeTable

