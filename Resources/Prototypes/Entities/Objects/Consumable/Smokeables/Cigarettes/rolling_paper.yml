- type: entity
  parent: BaseStorageItem
  name: 一包捲菸紙 | pack of rolling paper
  id: PackPaperRolling
  description: 一包薄紙片，用來製作細緻的菸草製品。 | A pack of thin pieces of paper used to make fine smokeables.
  components:
  - type: Storage
    grid:
    - 0,0,3,1
    whitelist:
      tags:
      - RollingPaper
      - CigFilter
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: PaperRolling
        amount: 4
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigpapers
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi

- type: entity
  parent: PackPaperRolling
  name: 一包附濾嘴的捲菸紙 | pack of rolling paper with filters
  id: PackPaperRollingFilters
  description: 一包濾嘴和薄紙片，用來製作細緻的可吸煙物。 | A pack of filters and thin pieces of paper used to make fine smokeables.
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: PaperRolling
          amount: 2
        - id: CigaretteFilter
          amount: 2

- type: entity
  id: PaperRolling
  name: 捲菸紙 | rolling paper
  description: 一種薄紙，用來製作高品質的煙草製品。 | A thin piece of paper used to make fine smokeables.
  suffix: Full
  parent: BaseItem
  components:
  - type: Stack
    stackType: PaperRolling
    count: 5
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigpaper
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    size: Tiny
  - type: Tag
    tags:
    - RollingPaper
    - Trash
  - type: SpaceGarbage

- type: entity
  id: PaperRolling1
  suffix: Single
  parent: PaperRolling
  components:
    - type: Stack
      count: 1

- type: entity
  id: CigaretteFilter
  name: 香菸濾嘴 | cigarette filter
  description: 一條堅挺的紙條，用作手工香菸的濾嘴。 | A strip of firm paper used as a filter for handmade cigarettes.
  suffix: Full
  parent: BaseItem
  components:
  - type: Stack
    stackType: CigaretteFilter
    count: 5
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    state: cigfilter
  - type: Item
    sprite: Objects/Consumable/Smokeables/Cigarettes/paper.rsi
    size: Tiny
  - type: Tag
    tags:
    - CigFilter
    - Trash

- type: entity
  id: CigaretteFilter1
  suffix: Single
  parent: CigaretteFilter
  components:
    - type: Stack
      count: 1
