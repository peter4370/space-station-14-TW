- type: entity
  id: Cigar
  parent: BaseCigar
  name: 雪茄 | cigar
  description: "一捲棕色的菸草，還有……嗯，你也不太確定是什麼。 | A brown roll of tobacco and... well, you're not quite sure."
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    state: unlit-icon
  - type: Tag
    tags:
      - Cigar
      - Trash
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny
    sprite: Objects/Consumable/Smokeables/Cigars/cigar.rsi
    heldPrefix: unlit

- type: entity
  id: CigarSpent
  parent: Cigar
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
  - type: Tag
    tags:
      - Cigar
      - Trash
      - Burnt

- type: entity
  id: CigarGold
  parent: Cigar
  name: 頂級哈瓦那雪茄 | premium Havanian cigar
  description: 一款只適合頂尖中的頂尖人士的雪茄。 | A cigar fit for only the best of the best.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    state: unlit-icon
  - type: Clothing
    sprite: Objects/Consumable/Smokeables/Cigars/cigar-gold.rsi
    slots: [ mask ]
    equippedPrefix: unlit
  - type: Item
    size: Tiny

- type: entity
  id: CigarGoldSpent
  parent: CigarGold
  suffix: spent
  components:
  - type: Sprite
    state: burnt-icon
  - type: Smokable
    state: Burnt
