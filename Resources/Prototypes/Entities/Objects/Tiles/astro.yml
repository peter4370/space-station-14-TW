
# Faux science tiles
- type: entity
  id: FloorTileItemAstroGrass
  parent: FloorTileItemBase
  name: astro-grass | astro-grass
  description: 這款人造草不僅能遮蓋線材，甚至還附有逼真的 NanoTrimmings！ | Fake grass that covers up wires and even comes with realistic NanoTrimmings!
  components:
  - type: Sprite
    state: astrograss
  - type: Item
    heldPrefix: grass
  - type: FloorTile
    outputs:
    - Plating
    - FloorAstroGrass
  - type: Stack
    stackType: FloorTileAstroGrass

