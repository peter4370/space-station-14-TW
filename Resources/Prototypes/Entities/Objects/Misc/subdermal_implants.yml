- type: entity
  id: BaseSubdermalImplant
  name: 植入物 | implant
  description: 一種可植入皮下的微型晶片。 | A microscopic chip that's injected under the skin.
  abstract: true
  components:
  - type: SubdermalImplant
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu

#Fun implants

- type: entity
  parent: BaseSubdermalImplant
  id: SadTromboneImplant
  name: 悲傷的小號植入物 | sad trombone implant
  description: 當使用者死亡時，這顆植入體會奏起一首悲傷的曲子。 | This implant plays a sad tune when the user dies.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState # admeme implanting a chair with trombone implant needs to give the chair mobstate so it can die first
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      collection: SadTrombone
      params:
        variation: 0.125

- type: entity
  parent: BaseSubdermalImplant
  id: LightImplant
  name: 光植入物 | light implant
  description: 此植入物在啟動時會從使用者的皮膚表面發出光芒。 | This implant emits light from the user's skin on activation.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionToggleLight
  - type: PointLight
    enabled: false
    radius: 2.5
    softness: 5
    lightMask: ConeSingle
    autoRot: true
  - type: UnpoweredFlashlight

- type: entity
  parent: BaseSubdermalImplant
  id: BikeHornImplant
  name: 自行車喇叭植入物 | bike horn implant
  description: 這款植入裝置讓使用者能夠隨時隨地按喇叭。 | This implant lets the user honk anywhere at any time.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateHonkImplant
  - type: TriggerOnActivateImplant
  - type: EmitSoundOnTrigger
    predicted: true
    sound:
      collection: BikeHorn
      params:
        variation: 0.125

#Security implants

- type: entity
  parent: BaseSubdermalImplant
  id: TrackingImplant
  name: 追蹤植入物 | tracking implant
  description: 此植入體配備了一個追蹤裝置，並連接至太空服感測器網路。 | This implant has a tracking device attached to the suit sensor network.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      whitelist:
        components:
        - MobState # admeme implanting a chair with tracking implant needs to give the chair mobstate so it can die first
    - type: SuitSensor
      randomMode: false
      controlsLocked: true
      mode: SensorCords
      activationContainer: "implant"
    - type: DeviceNetwork
      deviceNetId: Wireless
      transmitFrequencyId: SuitSensor
    - type: StationLimitedNetwork
    - type: WirelessNetworkConnection
      range: 500

#Traitor implants

- type: entity
  parent: BaseSubdermalImplant
  id: StorageImplant
  name: 儲存植入物 | storage implant
  description: 這項植入物運用「藍域」技術，能在人體內建立隱藏的儲存空間。 | This implant grants hidden storage within a person's body using bluespace technology.
  categories: [ HideSpawnMenu ]
  components:
    - type: StorageImplant
    - type: SubdermalImplant
      implantAction: ActionOpenStorageImplant
      whitelist:
        components:
        - Hands # no use giving a mouse a storage implant, but a monkey is another story...
    - type: Storage
      grid:
      - 0,0,0,1
      - 1,0,1,0
      - 1,2,1,2
      - 2,1,2,2
    - type: ContainerContainer
      containers:
        storagebase: !type:Container
          ents: [ ]
    - type: UserInterface
      interfaces:
        enum.StorageUiKey.Key:
          type: StorageBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: FreedomImplant
  name: 自由植入物 | freedom implant
  description: 此植入裝置可讓使用者最多掙脫手銬三次，之後便會停止運作。 | This implant lets the user break out of hand restraints up to three times before ceasing to function anymore.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateFreedomImplant
    whitelist:
      components:
      - Cuffable # useless if you cant be cuffed
  - type: TriggerOnActivateImplant
  - type: UncuffOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplant
  name: 無線電植入裝置 | radio implant
  description: 此植入體讓使用者無需佩戴耳機，即可接取「辛迪加」頻道。 | This implant grants access to the Syndicate channel without a headset.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - Syndicate

- type: entity
  parent: BaseSubdermalImplant
  id: UplinkImplant
  name: 上行鏈路植入物 | uplink implant
  description: 此植入裝置讓使用者能隨心所欲地連線至辛迪加的隱藏上行通道。 | This implant lets the user access a hidden Syndicate uplink at will.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionOpenUplinkImplant
    whitelist:
      components:
      - Hands # prevent mouse buying grenade penguin since its not telepathic
  - type: RemoteStore
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: EmpImplant
  name: 電磁脈衝植入裝置 | EMP implant
  description: 此植入裝置在啟動時會產生電磁脈衝。 | This implant creates an electromagnetic pulse when activated.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateEmpImplant
  - type: TriggerOnActivateImplant
  - type: EmpOnTrigger
    range: 2.75
    energyConsumption: 50000
    disableDuration: 10

- type: entity
  parent: BaseSubdermalImplant
  id: ScramImplant
  name: scram 植入物 | scram implant
  description: 此植入體在啟動時，會將使用者隨機傳送至大範圍內的某處。 | This implant randomly teleports the user within a large radius when activated.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateScramImplant
  - type: TriggerOnActivateImplant
  - type: ScramOnTrigger
    targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: DnaScramblerImplant
  name: DNA 紊亂器植入物 | DNA scrambler implant
  description: 此植入物可讓使用者隨機變更外貌與姓名一次。 | This implant lets the user randomly change their appearance and name once.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionActivateDnaScramblerImplant
    whitelist:
      components:
      - HumanoidProfile # syndies cant turn hamlet into a human
  - type: TriggerOnActivateImplant
  - type: DnaScrambleOnTrigger
    targetUser: true
  - type: DeleteOnTrigger

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseSubdermalImplant
  id: ChameleonControllerImplant
  name: 變色龍控制器植入物 | chameleon controller implant
  description: 透過這個植入物，您可以立即改變所有穿著的變色龍服裝的外觀。 | This implant allows you to instantly change the appearance of all worn chameleon clothing.
  components:
  - type: ChameleonControllerImplant
  - type: SubdermalImplant
    implantAction: ActionChameleonController
  - type: UseDelay
    delay: 1
  - type: UserInterface
    interfaces:
      enum.ChameleonControllerKey.Key:
        type: ChameleonControllerBoundUserInterface

- type: entity
  parent: BaseSubdermalImplant
  id: VoiceMaskImplant
  name: 身分掩飾植入物 | identity mask implant
  description: 這款植入物能讓你隨心所欲地改變身分。 | This implant allows you to change your identity at will.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: ActionChangeVoiceMaskImplant
  - type: VoiceMask
    overrideIdentity: true
    changeIDName: true
  - type: UserInterface
    interfaces:
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface

#Nuclear Operative/Special Exclusive implants

- type: entity
  parent: BaseSubdermalImplant
  id: MicroBombImplant
  name: 微型炸彈植入物 | micro-bomb implant
  description: 此植入體會在啟動時或使用者死亡時引爆使用者。 | This implant detonates the user upon activation or upon death.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateMicroBomb
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: ExplodeOnTrigger
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: Explosive
    explosionType: MicroBomb
    totalIntensity: 120
    intensitySlope: 5
    maxIntensity: 30
    canCreateVacuum: false
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu
    - MicroBomb


- type: entity
  parent: BaseSubdermalImplant
  id: MacroBombImplant
  name: 巨型炸彈植入物 | macro-bomb implant
  description: 這枚植入物會在預先設定的倒數結束後，於死亡時引發一場大規模爆炸。 | This implant creates a large explosion on death after a preprogrammed countdown.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      permanent: true
    - type: ReplacementImplant
      whitelist:
        tags:
        - MicroBomb # replace microbomb implant with macrobomb
    - type: TriggerOnMobstateChange #activates the timer
      mobState:
      - Dead
      preventSuicide: true
    - type: TimerTrigger
      delay: 7
      beepSound:
        path: /Audio/Machines/Nuke/general_beep.ogg
        params:
          volume: -2
    - type: ExplodeOnTrigger
      keysIn:
      - timer
    - type: GibOnTrigger
      targetUser: true
      deleteItems: true
      keysIn:
      - timer
    - type: Explosive
      explosionType: Default
      totalIntensity: 3500
      intensitySlope: 15
      maxIntensity: 70
      canCreateVacuum: true

- type: entity
  parent: BaseSubdermalImplant
  id: DeathAcidifierImplant
  name: 死亡酸化植入體 | death-acidifier implant
  description: 這枚植入體會在使用者死亡時，將其本人及其裝備一併熔化。 | This implant melts the user and their equipment upon death.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    implantAction: ActionActivateDeathAcidifier
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: TriggerOnActivateImplant
  - type: GibOnTrigger
    targetUser: true
    deleteItems: true
  - type: SpawnOnTrigger
    proto: Acidifier
    predicted: true

- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleImplant
  name: 「死亡呻吟」植入裝置 | death rattle implant
  description: 若使用者陷入危急狀態或死亡，此植入體將通知「辛迪加」無線電頻道。 | This implant will inform the Syndicate radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
    - type: SubdermalImplant
      permanent: true
      whitelist:
        components:
        - MobState # admeme implanting a chair with rattle implant needs to give the chair mobstate so it can die first
    - type: TriggerOnMobstateChange
      mobState:
      - Critical
      - Dead
    - type: RattleOnTrigger
      targetUser: true

- type: entity
  parent: BaseSubdermalImplant
  id: FakeMindShieldImplant
  name: 偽造的「心靈護盾」植入物 | fake mindshield implant
  description: 此植入裝置能讓植入者產生一組偽訊號，NT 安全頭盔會利用這組訊號來識別植入了「心智護盾」的個體。 | This implant allows the implanter to produce a fake signal that NT security huds use to identify individuals implanted with a mindshield.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: FakeMindShieldToggleAction
  - type: FakeMindShield

# Sec and Command implants

- type: entity
  parent: BaseSubdermalImplant
  id: MindShieldImplant
  name: 心靈屏障植入物 | mindshield implant
  description: 這枚植入物將確保對納諾特拉森的忠誠，並防止精神控制裝置的運作。 | This implant will ensure loyalty to Nanotrasen and prevent mind control devices.
  categories: [ HideSpawnMenu ]
  components:
   - type: SubdermalImplant
   - type: MindShieldImplant
   - type: MindShield

# Centcomm implants

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantCentcomm
  name: 無線電植入裝置 | radio implant
  description: 此植入裝置可讓使用者無需頭戴式耳機即可接通 Centcomm 頻道。僅限 Centcomm 員工使用。 | This implant grants access to the Centcomm channel without a headset. Only authorized for Centcomm employees.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - CentCom

- type: entity
  parent: DeathRattleImplant
  id: DeathRattleImplantCentcomm
  name: 中央司令部「臨終呻吟」植入裝置 | centcomm death rattle implant
  description: 倘若使用者陷入危急狀況或身亡，此植入裝置將通知中央司令部（Centcomm）的無線電頻道。 | This implant will inform the Centcomm radio channel should the user fall into critical condition or die.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: CentCom
