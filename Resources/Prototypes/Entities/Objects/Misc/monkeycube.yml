- type: entity
  parent: BoxCardboard
  name: 猴子魔方盒 | monkey cube box
  id: MonkeyCubeBox
  description: Drymate 品牌的猴子方塊。只要加水即可！ | Drymate brand monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: MonkeyCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: BaseItem
  abstract: true
  suffix: Wrapped
  id: BaseWrappedCube
  components:
  - type: Item
    size: Tiny
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi

- type: entity
  parent: BaseWrappedCube
  name: 猴子方塊 | monkey cube
  id: MonkeyCubeWrapped
  description: 拆開這個包裝，就能得到一個猴子魔方。 | Unwrap this to get a monkey cube.
  components:
  - type: SpawnItemsOnUse
    items:
    - id: MonkeyCube
  - type: Sprite
    state: wrapper
  - type: Tag
    tags:
    - MonkeyCube

- type: entity
  parent: MonkeyCubeBox
  name: 科博爾德立方體盒子 | kobold cube box
  id: KoboldCubeBox
  description: 濃縮的科博爾德裝在立方體裡。只要加水即可！ | Condensed kobolds in a cube. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: KoboldCubeWrapped
        amount: 8
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_kobold

- type: entity
  parent: MonkeyCubeBox
  name: 變體魔方盒 | variant cube box
  id: VariantCubeBox
  description: 既有小妖魔方塊，也有猴子方塊。只要加點水就行！ | Both kobold cubes and monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: KoboldCubeWrapped
          amount: 4
        - id: MonkeyCubeWrapped
          amount: 4
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box_variant

- type: entity
  parent: BaseWrappedCube
  name: 科博爾德方塊 | kobold cube
  id: KoboldCubeWrapped
  description: 拆開這個包裝，即可獲得一個哥布林魔方。 | Unwrap this to get a kobold cube.
  components:
  - type: SpawnItemsOnUse
    items:
      - id: KoboldCube
  - type: Sprite
    state: wrapper_kobold

- type: entity
  parent: MonkeyCubeBox
  name: 猴子方塊盒 | monkey cube box
  suffix: Syndicate
  id: SyndicateSpongeBox
  description: Drymate 品牌的猴子方塊。只要加水即可！ | Drymate brand monkey cubes. Just add water!
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: SyndicateSpongeWrapped
        amount: 6
  - type: Sprite
    sprite: Objects/Misc/monkeycube.rsi
    state: box

- type: entity
  parent: MonkeyCubeWrapped
  name: 猴子方塊 | monkey cube
  suffix: Wrapped, Syndicate
  id: SyndicateSpongeWrapped
  components:
  - type: SpawnItemsOnUse
    items:
      - id: SyndicateSponge
