- type: entity
  abstract: true
  parent: BaseItem
  id: BaseCoin
  name: 硬幣 | coin
  description: 一片扁平的金屬片。倘若它仍在流通，通膨早就讓它一文不值了。既然它已經不再流通，那它的價值就足以讓人把它收在書裡。 | A flat bit of metal. If it was still in circulation, inflation would've made it worthless. Since it isn't, it's worth enough to keep in a book.
  components:
  - type: Dice
    sides: 2
    currentValue: 1
    sound: !type:SoundCollectionSpecifier
      collection: Coin
    values: CoinFaces
    examineLandedOnText: dice-component-roll-specific
    examineObjectText: null # no need to show how many sides it has, it's a coin
  - type: Tag
    tags:
    - Dice
  - type: UseDelay
  - type: Sprite
    sprite: Objects/Misc/coins.rsi
  - type: Item
    size: Tiny

