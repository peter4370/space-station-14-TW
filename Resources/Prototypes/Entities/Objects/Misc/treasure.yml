- type: entity
  parent: BaseItem
  id: TreasureDatadiskEncrypted
  name: 加密資料碟 | encrypted datadisk
  description: 一張舊的資料光碟。比你更懂行的人或許能解密它，並從中挖掘出一些精彩內幕。而你唯一能做的，就是把它賣掉。 | An old data disk. Someone savvier than you could unencrypt it and learn something juicy. All you can do is sell it.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: datadisk_base
      color: "#868686"
    - state: datadisk_label
    - state: datadisk_encrypted
  - type: PointLight
    radius: 1.5
    energy: 0.5
    castShadows: false
    color: "#0000ff"
  - type: StaticPrice
    price: 500

- type: entity
  parent: BaseItem
  id: TreasureHardDiskDrive
  name: 硬碟機 | hard disk drive
  description: 一款專為1980年左右舊式地球技術設計的磁碟機。說不定會有某位收藏家想把這玩意兒據為己有。 | A disk drive designed for old Earth technology, circa 1980. There's probably some kind of collector who might want to get their paws on this.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: harddisk
      map: [ "base" ]
  - type: Item
    storedRotation: -90
  - type: RandomSprite
    available:
    - base:
        harddisk: ""
        harddisk_mini: ""
        harddisk_micro: ""
  - type: StaticPrice
    price: 275

- type: entity
  parent: BaseItem
  id: TreasureFlopDiskDrive
  name: 軟碟機 | floppy disk drive
  description: 一種用於從軟碟讀取資料的裝置。可惜的是，如今軟碟上唯一儲存的，只剩下核彈操作手冊了。 | A drive for reading off info off of floppy disks. Shame that the only things stored on them nowadays are nuclear bomb operations.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: flopdrive
  - type: Item
    storedRotation: -90
  - type: StaticPrice
    price: 350

- type: entity
  parent: BaseItem
  id: TreasureCDDrive
  name: 光碟機 | CD drive
  description: 一種用來從光碟讀取資料的裝置。如今這已經不算什麼實用的東西了，除非你打算搭飛機去某個地方。 | A piece of tech for reading data off of CDs. Nowadays that's not the most useful thing, unless you plan on flying somewhere.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cddrive
  - type: Item
    storedRotation: -90
  - type: StaticPrice
    price: 300

- type: entity
  parent: BaseItem
  id: TreasureCPUSupercharged
  name: 超頻處理器 | supercharged CPU
  description: 某種超級外星太空科技。可惜現在所有的電腦都已經配備 CPU 了。 | Some kind of super alien space tech. Shame all the computers already come with CPUs nowadays.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    layers:
    - state: cpu_super
  - type: Item
    size: Tiny
  - type: StaticPrice
    price: 750

- type: entity
  parent: BaseItem
  id: TreasureSampleTube
  name: 樣本管 | sample tube
  description: 一根玻璃管，裡面裝著某種黏稠物質。看起來很容易碎。 | A glass tube with some sort of goop in it. Looks prone to breaking.
  components:
  - type: Sprite
    sprite: Objects/Misc/sample_tubes.rsi
    layers:
    - state: blank
      map: [ "base" ]
  - type: RandomSprite
    available:
    - base:
        blank: ""
        power: ""
        reinforcer: ""
        energy: ""
        synchronizer: ""
        stabilizer: ""
  - type: StaticPrice
    price: 120

