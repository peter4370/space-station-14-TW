- type: entity
  id: BedsheetCaptain
  parent: BedsheetBase
  name: 船長床單 | captain's bedsheet
  description: 上面印有 Nanotrasen 的標誌，並採用了一種革命性的新型紗線編織而成，保證對大多數非化學物質的滲透率僅為 0.01%，深受多數現代船長青睞。 | It has a Nanotrasen symbol on it, and was woven with a revolutionary new kind of thread guaranteed to have 0.01% permeability for most non-chemical substances, popular among most modern captains.
  components:
  - type: Sprite
    state: sheetcaptain
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/captain.rsi
  - type: StealTarget
    stealGroup: HeadBedsheet

- type: entity
  id: BedsheetCE
  parent: BedsheetBase
  name: CE 的床單 | CE's bedsheet
  description: 上面飾有扳手標誌。它具有高度反光性且抗污，因此您無需擔心被機油弄髒。 | It's decorated with a wrench emblem. It's highly reflective and stain resistant, so you don't need to worry about ruining it with oil.
  components:
  - type: Sprite
    state: sheetce
  - type: Clothing
    sprite: Clothing/Neck/Bedsheets/ce.rsi
  - type: StealTarget
    stealGroup: HeadBedsheet

- type: entity
