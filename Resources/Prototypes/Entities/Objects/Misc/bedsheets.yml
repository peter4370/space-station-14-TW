- type: entity
  parent: BaseItem
  id: BedsheetBase
  name: 床單底布 | BedsheetBase
  abstract: true
  description: 一款出乎意料地柔軟的亞麻床單。 | A surprisingly soft linen bedsheet.
  placement:
    mode: SnapgridCenter
    snap:
    - Bed
  components:
  - type: Sprite
    sprite: Objects/Misc/bedsheets.rsi
    noRot: true
  - type: Item
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: StaticPrice
    price: 12
  - type: Tag
    tags:
    - Bedsheet

