- type: entity
  parent: BaseBoardEntity
  id: ParchisBoard
  name: 帕奇斯棋盤 | parchís board
  description: 一款以「X」與「O」為主題的棋盤遊戲，以摧毀無數友誼而聞名。 | Cross and circle board game famous for destroying countless friendships.
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/parchis.rsi
    state: board
  - type: TabletopGame
    boardName: tabletop-parchis-board-name
    size: 574, 574
    setup:
      !type:TabletopParchisSetup
      boardPrototype: &ParchisBoard ParchisBoardTabletop

- type: entity
  parent: BaseBoardTabletop
  id: *ParchisBoard
  name: 帕奇斯 | parchís
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/parchis_tabletop.rsi
    state: board

