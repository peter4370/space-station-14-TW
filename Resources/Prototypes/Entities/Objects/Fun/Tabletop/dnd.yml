# When adding a new battlemap, also add it to id: AllBattlemapsTable

# Board item (given to players)
- type: entity
  abstract: true
  parent: BaseBoardEntity
  id: BaseBattlemap
  name: 戰場地圖 | battlemap
  description: 一張讓您展開史詩級地城探險的戰鬥地圖，不含配件！ | A battlemap for your epic dungeon exploring to begin, pieces not included!
  components:
  - type: Sprite
    state: icon
  - type: TabletopGame
    boardName: tabletop-battlemap-board-name

- type: entity
  parent: BaseBattlemap
  id: GrassBattlemap
  name: 草地戰場地圖 | grass battlemap
  description: 一張讓您展開史詩級地城探險的戰鬥地圖，不含配件！ | A battlemap for your epic dungeon exploring to begin, pieces not included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/grassbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &GrassBoard GrassBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: MoonBattlemap
  name: 月球戰場地圖 | moon battlemap
  description: 一張讓您展開史詩級月球探險的戰場地圖，不包含遊戲部件！ | A battlemap for your epic moon exploring to begin, pieces not included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/moonbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &MoonBoard MoonBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: SandBattlemap
  name: 沙地戰場地圖 | sand battlemap
  description: 一張讓您展開史詩級海灘篇章的戰場地圖，棋子不包含在內！ | A battlemap for your epic beach episodes to begin, pieces not included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/sandbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &SandBoard SandBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: SnowBattlemap
  name: 雪地戰場地圖 | snow battlemap
  description: 一張供你展開嚴寒探險的戰場地圖，不包含遊戲配件！ #if this isn't funny enough i can remove it | A battlemap for your frigid exploring to begin, pieces not included! # if this isn't funny enough i can remove it
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/snowbm.rsi
  - type: TabletopGame
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &SnowBoard SnowBoardTabletop

- type: entity
  parent: BaseBattlemap
  id: ShipBattlemap
  name: 艦船戰鬥地圖 | ship battlemap
  description: 一張讓您展開史詩級太空探險的戰鬥地圖，不包含遊戲配件！ | A battlemap for your epic space exploring to begin, pieces not included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Tabletop/Battlemaps/shipbm.rsi
  - type: TabletopGame
    size: 543, 543
    setup:
      !type:TabletopEmptySetup
      boardPrototype: &ShipBoard ShipBoardTabletop

# Background entity (actually shown in the board)
