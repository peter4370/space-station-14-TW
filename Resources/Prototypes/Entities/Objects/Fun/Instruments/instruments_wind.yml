- type: entity
  parent: BaseWoodwindInstrument
  id: SaxophoneInstrument
  name: 薩克斯風 | saxophone
  description: 一種樂器。你大概可以把它改編成純正的爵士樂。 | An instrument. You could probably grind this into raw jazz.
  components:
  - type: Instrument
    program: 66
  - type: SwappableInstrument
    instrumentList:
      "Soprano": {64: 0}
      "Alto": {65: 0}
      "Tenor": {66: 0}
      "Baritone": {67: 0}
  - type: Sprite
    sprite: Objects/Fun/Instruments/saxophone.rsi
  - type: Extractable
    grindableSolutionName: instrument
  - type: Solution
    id: instrument
    solution:
      maxVol: 20 # Based on material balance and not container balance so no size parent.
      reagents:
      - ReagentId: Brass
        Quantity: 10

