- type: entity
  id: ContrabassInstrument
  parent: BasePlaceableInstrument
  name: 低音提琴 | contrabass
  description: 非常適合打出一段優美的爵士節奏。 | Perfect for laying down a nice jazzy beat.
  components:
  - type: Instrument
    program: 43
  - type: Sprite
    state: contrabass
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds: *ThresholdsFurnitureStrongWood
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.30
        density: 180
        mask:
        - Impassable
        - HighImpassable
        - MidImpassable
        layer:
        - Opaque
        - HighImpassable
        - MidImpassable
        - BulletImpassable

