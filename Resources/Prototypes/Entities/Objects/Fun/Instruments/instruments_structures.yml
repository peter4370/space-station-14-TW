- type: entity
  name: 教堂管風琴 | church organ
  parent: BasePlaceableInstrumentRotatable
  id: ChurchOrganInstrument
  description: 這東西真的糟透了！ | This thing really blows!
  components:
  - type: Instrument
    program: 19
  - type: Sprite
    state: church-organ
  - type: Damageable
