- type: entity
  parent: BaseHandheldInstrument
  id: BasePercussionInstrument
  abstract: true
  components:
  - type: Tag
    tags:
    - PercussionInstrument

- type: entity
  parent: BasePercussionInstrument
  id: GlockenspielInstrument
  name: 鋼片琴 | glockenspiel
  components:
  - type: Instrument
    program: 9
  - type: Sprite
    sprite: Objects/Fun/Instruments/glockenspiel.rsi

- type: entity
  parent: BasePercussionInstrument
  id: MusicBoxInstrument
  name: 音樂盒 | music box
  description: 玩這款遊戲會讓你感到自己遠離了那些可怕的機械人偶。 | Playing this makes you feel safe from scary animatronics.
  components:
  - type: Instrument
    program: 10
  - type: Sprite
    sprite: Objects/Fun/Instruments/musicbox.rsi
  - type: Item
    size: Small

- type: entity
  parent: BasePercussionInstrument
  id: XylophoneInstrument
  name: 木琴 | xylophone
  description: 彩虹色的鋼片琴。 | Rainbow colored glockenspiel.
  components:
  - type: Instrument
    program: 13
  - type: Sprite
    sprite: Objects/Fun/Instruments/structureinstruments.rsi
    state: xylophone

- type: entity
  parent: BaseHandheldInstrument
  id: MicrophoneInstrument
  name: 麥克風 | microphone
  description: 非常適合盡情高歌。 | Perfect for singing your heart out.
  components:
  - type: Instrument
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Aah": {52: 0}
      "Ooh": {53: 0}
      "Kweh": {4: 100} # Defined in space-station-14.sf2
      "Waa": {5: 100} # Defined in space-station-14.sf2
      "Wah": {6: 100} # Defined in space-station-14.sf2
  - type: Sprite
    sprite: Objects/Fun/Instruments/microphone.rsi
  - type: Item
    size: Small
    storedSprite:
      state: storage
      sprite: Objects/Fun/Instruments/microphone.rsi


- type: entity
  parent: BasePercussionInstrument
  id: WoodblockInstrument
  name: 木版畫 | woodblock
  description: 如果你反覆聽這首歌夠久，它就會不自覺地縈繞在你的腦海中。 | If you listen to this enough it'll start driving itself into your mind.
  components:
  - type: Instrument
    program: 115
  - type: Sprite
    sprite: Objects/Fun/Instruments/woodblock.rsi

- type: entity
  parent: BasePercussionInstrument
  id: ReverseCymbalsInstrument
  name: 反向鈸 | reverse cymbals
  description: 我覺得你搞反了吧？ | I think you have it the wrong way around?
  components:
  - type: Instrument
    program: 119
  - type: Sprite
    sprite: Objects/Fun/Instruments/reversecymbal.rsi
