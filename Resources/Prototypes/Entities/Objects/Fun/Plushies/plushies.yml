    sprite: Mobs/Ghosts/revenant.rsi
    state: icon
    noRot: true
  - type: Item
    size: Normal
  - type: MultiHandedItem
  - type: Construction
    graph: PlushieGhostRevenant
    node: plushie
  - type: FoodSequenceElement
    entries:
      CottonBurger: RevenantPlushie

- type: entity
  parent: BasePlushie
  id: PlushieBee
  name: 蜜蜂絨毛玩偶 | bee plushie
  description: 一個可愛的玩具，模樣活脫脫就像一個更可愛的程式設計師。除非是怪物，否則根本不會把它碾碎。 | A cute toy that resembles an even cuter programmer. You'd have to be a monster to grind this up.
