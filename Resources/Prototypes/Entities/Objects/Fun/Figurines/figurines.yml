- type: entity
  parent: BaseFigurine
  id: ToyNuke
  name: 核武玩具 | nuke toy
  description: 一個核裂變爆炸裝置的塑膠模型。不含鈾……大概吧。 | A plastic model of a Nuclear Fission Explosive. No uranium included... probably.
  components:
  - type: Sprite
    sprite: Objects/Fun/toy_nuke.rsi
    state: icon
  - type: Clothing
    quickEquip: false
    sprite: Objects/Fun/toy_nuke.rsi
    slots:
    - HEAD
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.12"
  - type: Tag
    tags:
    - Figurine
    - Payload
  - type: UseDelay
    delay: 180.0
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Machines/Nuke/nuke_alarm.ogg
      params:
        volume: -5
        maxDistance: 10

