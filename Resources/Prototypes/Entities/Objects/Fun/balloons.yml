# When adding new balloons, also add it to id: AllMiscToysTable

- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBalloon
  components:
  - type: Sprite
    noRot: true
  - type: Item
    size: Small
  - type: EmitSoundOnCollide
    sound: &SoundBalloonHit
      path: /Audio/Effects/balloon_hits.ogg
  - type: EmitSoundOnLand
    sound: *SoundBalloonHit
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: TileFrictionModifier
    modifier: 0.3
  - type: Tag
    tags:
    - Balloon

- type: entity
  parent: BaseBalloon
  id: BalloonSyn
  name: 辛迪·巴隆 | syndie balloon
  description: 頒發給那些在辛迪樂園（Syndieland）的「原子龍捲風」遊樂設施中倖存下來、最勇敢的勇者。 | Handed out to the bravest souls who survived the "atomic twister" ride at Syndieland.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/syndicate.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/syndicate.rsi
  - type: StaticPrice
    price: 100 # Entertainment.

- type: entity
  parent: BaseBalloon
  id: BalloonNT
  name: NanoTrasen 氣球 | nanotrasen balloon
  description: 專為對「辛迪加」特工造成最大心理傷害而設計。 | Specially designed to inflict maximum psychological damage to Syndicate operatives.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/nanotrasen.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/nanotrasen.rsi

- type: entity
  parent: BaseBalloon
  id: BalloonCorgi
  name: 柯基氣球 | corgi balloon
  description: 就像養了一隻真正的狗一樣——只是更輕盈許多。 | Just like owning a real dog - but a lot floatier.
  components:
  - type: Sprite
    sprite: Objects/Fun/Balloons/corgi.rsi
    state: icon
  - type: Item
    sprite: Objects/Fun/Balloons/corgi.rsi
