- type: entity
  parent: PowerCellSmall
  id: PowerCellSmallNuclear
  name: 小容量核能電池 | small-capacity nuclear power cell
  description: 一種自充電式電池，設計上以犧牲容量為代價，換取快速的充電速率。 | A self rechargeable power cell, designed for fast recharge rate at the expense of capacity.
  components:
  - type: BatterySelfRecharger
    autoRechargeRate: 36 # 10 seconds to recharge
    autoRechargePauseTime: 30
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Uranium
        Quantity: 5

