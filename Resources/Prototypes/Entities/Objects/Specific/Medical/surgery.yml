# Base

- type: entity
  parent: BaseItem
  id: BaseToolSurgery
  abstract: true
  components:
  - type: Sprite
  - type: StaticPrice
    price: 20
  - type: Tag
    tags:
    - SurgeryTool

# Cautery

- type: entity
  name: 電灼術 | cautery
  id: Cautery
  parent: BaseToolSurgery
  description: 一種用於燒灼開放性傷口的外科器械。 | A surgical tool used to cauterize open wounds.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    state: cautery
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/cautery.rsi
    storedRotation: 90
  - type: MeleeWeapon
    damage:
       types:
        Heat: 5
    soundHit:
      path: /Audio/Effects/lightburn.ogg

# Drill

- type: entity
  name: 鑽頭 | drill
  id: Drill
  parent: BaseToolSurgery
  description: 一種用於在硬質材料上鑽孔的手術鑽頭。 | A surgical drill for making holes into hard material.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/drill.rsi
    state: drill
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/drill.rsi
    shape:
    - 0,0,1,0
    - 1,1,1,1
  - type: MeleeWeapon
    damage:
      types:
        Piercing: 10
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: StaticPrice
    price: 40

# Scalpel

- type: entity
  name: 手術刀 | scalpel
  id: Scalpel
  parent: BaseToolSurgery
  description: 一種用於在皮膚上切開切口的外科器械。 | A surgical tool used to make incisions into flesh.
  components:
  - type: Tool
    qualities:
    - Slicing
    speedModifier: 0.66 # pretend the sixes go on forever :)
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    state: scalpel
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scalpel.rsi
    storedRotation: 90
  - type: MeleeWeapon
    wideAnimationRotation: 90
    swingLeft: true
    attackRate: 1.5
    damage:
      types:
        Slash: 8
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg

- type: entity
  name: shiv | shiv
  id: ScalpelShiv
  parent: Scalpel
  description: 一塊尖銳的玻璃，邊緣經過打磨，並用膠帶纏繞作為握柄。 # Could become a decent tool or weapon with right tool mods. | A pointy piece of glass, abraded to an edge and wrapped in tape for a handle. # Could become a decent tool or weapon with right tool mods.
  components:
  - type: Sprite
    state: shiv
  - type: Item
    heldPrefix: shiv
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.375,-0.15,0.35,0.12"
        density: 20 # derived from base_item
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2


- type: entity
  name: 先進手術刀 | advanced scalpel
  id: ScalpelAdvanced
  parent: Scalpel
  description: 採用較昂貴的材質製成，鋒利度更高，且整體而言更為可靠。 | Made of more expensive materials, sharper and generally more reliable.
  components:
  - type: Sprite
    state: advanced
  - type: Item
    heldPrefix: advanced
  - type: MeleeWeapon
    damage:
      types:
        Slash: 12

- type: entity
  name: 雷射手術刀 | laser scalpel
  id: ScalpelLaser
  parent: Scalpel
  description: 一種利用定向雷射進行切割、而非使用刀片的手術刀，不僅能進行更精確的手術，同時在切割時還能進行電凝止血。 | A scalpel which uses a directed laser to slice instead of a blade, for more precise surgery while also cauterizing as it cuts.
  components:
  - type: Sprite
    state: laser
  - type: Item
    heldPrefix: laser

# Scissors

- type: entity
  name: 牽開器 | retractor
  id: Retractor
  parent: BaseToolSurgery
  description: 一種用於撐開切口的外科器械。 | A surgical tool used to hold open incisions.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    state: retractor
  - type: Item
    sprite: Objects/Specific/Medical/Surgery/scissors.rsi
    storedRotation: 90

- type: entity
  name: 止血器 | hemostat
  id: Hemostat
  parent: Retractor
  description: 一種用於壓迫血管以防止出血的外科器械。 | A surgical tool used to compress blood vessels to prevent bleeding.
  components:
  - type: Sprite
    state: hemostat
  - type: Item
    heldPrefix: hemostat
    storedRotation: 90

  # - type: entity
  #   name: bone setter
  #   id: BoneSetter
  #   parent: Retractor
  #   description: A surgical tool used for setting bones.
  #   components:
# Saws

- type: entity
  name: 金屬鋸 | metal saw
  id: Saw
  parent: BaseToolSurgery
  description: 用於將木材及其他物品鋸成碎片。或在緊急情況下，用來鋸骨頭。 | For cutting wood and other objects to pieces. Or sawing bones, in case of emergency.
  components:
  - type: Utensil
    types:
      - Knife
  - type: Sprite
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    state: saw
  - type: Item
    size: Normal
    sprite: Objects/Specific/Medical/Surgery/saw.rsi
    storedRotation: 90
  - type: Tool
    qualities:
    - Sawing
    - Slicing
# No melee for regular saw because have you ever seen someone use a band saw as a weapon? It's dumb.

- type: entity
  name: choppa | choppa
  id: SawImprov
  parent: Saw
  description: 一把由你能找到的任何鋒利而兇惡的物品製成的邪惡鋸齒刀刃。 # It would make a pretty decent weapon, given there are more space for some tool mods too. | A wicked serrated blade made of whatever nasty sharp things you could find. # It would make a pretty decent weapon, given there are more space for some tool mods too.
  components:
  - type: Sprite
    state: improv
  - type: Item
    size: Small
    heldPrefix: improv
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Tool
    speedModifier: 0.5

- type: entity
  name: 圓鋸 | circular saw
  id: SawElectric
  parent: Saw
  description: 適用於重型切割作業。 | For heavy duty cutting.
  components:
  - type: Sprite
    state: electric
  - type: Item
    heldPrefix: electric
  - type: MeleeWeapon
    damage:
      types:
        Slash: 15
    soundHit:
      path: /Audio/Items/drill_hit.ogg
  - type: Tool
    speedModifier: 1.5

- type: entity
  name: 進階圓鋸 | advanced circular saw
  id: SawAdvanced
  parent: [ SawElectric, BaseSyndicateContraband ]
  description: Interdyne 的尖端手術鋸。無論手術過程多麼混亂，皆保證保持一塵不染且無菌。 | Interdyne's state-of-the-art surgical saw. Guaranteed to stay spotless and sterile, no matter how messy the job.
  components:
  - type: Sprite
    state: advanced
  - type: Item
    heldPrefix: advanced
  - type: MeleeWeapon
    attackRate: 1.5
  - type: Tool
    speedModifier: 2.0
