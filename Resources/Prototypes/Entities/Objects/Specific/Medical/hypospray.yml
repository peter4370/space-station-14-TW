  id: Hypospray
  name: 低壓噴霧器 | hypospray
  description: 一種用於向患者快速給藥的無菌注射器。 | A sterile injector for rapid administration of drugs to patients.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/hypospray.rsi
    layers:
    - state: hypo
      map: ["enum.SolutionContainerLayers.Base"]
    - state: hypo_fill1
      map: ["enum.SolutionContainerLayers.Fill"]
      visible: false
  - type: Item
    sprite: Objects/Specific/Medical/hypospray.rsi
