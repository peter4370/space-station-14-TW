- type: entity
  parent: BaseItem
  id: WireBrush
  name: 鋼絲刷 | wire brush
  description: 一款刷毛粗硬的鋼絲刷，即使是最頑固的鏽斑也能輕鬆刮除。 | A bristly steel wire brush, perfect for scraping away even the toughest patches of rust.
  components:
  - type: Sprite
    sprite: Objects/Specific/Janitorial/wirebrush.rsi
    state: icon
  - type: Item
    storedSprite:
      sprite: Objects/Specific/Janitorial/wirebrush.rsi
      state: storage
    size: Small
  - type: Tag
    tags:
    - WireBrush
  - type: PhysicalComposition
    materialComposition:
      Steel: 50
      Plastic: 50
  - type: Tool
    qualities:
    - Brushing
    useSound:
      path: /Audio/Items/wirebrushing.ogg
  - type: StaticPrice
    price: 22
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Piercing: 3
    soundHit:
      path: "/Audio/Weapons/bladeslice.ogg"

- type: entity
  parent: WireBrush
  id: WireBrushElectrical
  name: 電線刷 | electrical wire brush
  description: 一款刷毛粗硬的鋼絲刷，配備可活動刷頭，讓清潔工作變得輕鬆許多。 | A bristly steel wire brush with a moving head, allowing for a way easier time cleaning.
  components:
  - type: Tool
    speedModifier: 1.5
