- type: entity
  name: 太空聖經 | space bible
  description: 全新《星際穿越》第 2340 版。 | New Interstellar Version 2340.
  parent: BaseStorageItem
  id: Bible
  components:
  - type: UseDelay
    delay: 10.0
  - type: Bible
    damage:
      types:
        Blunt: -5
        Piercing: -5
        Slash: -5
        Heat: -5
        Cold: -5
        Shock: -5
    damageOnFail:
      types:
        Blunt: 5
        Piercing: 5
        Slash: 5
        Asphyxiation: 15
    damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
      types:
        Heat: 10
  - type: MeleeWeapon
    soundHit:
      collection: Punch
    damage:
      types:
        Holy: 25
        Blunt: 1
  - type: Prayable
    bibleUserOnly: true
  - type: Summonable
    summonEntity: SpawnPointGhostRemilia
  - type: ReactionMixer
    mixMessage: "bible-mixing-success"
    reactionTypes:
    - Holy
  - type: Sprite
    sprite: Objects/Specific/Chapel/bible.rsi
    state: icon
  - type: Item
    size: Small
    sprite: Objects/Specific/Chapel/bible.rsi
  - type: Clothing
    slots:
    - Belt
  - type: Storage
    grid:
    - 0,0,0,1
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - Book
  - type: StealTarget
    stealGroup: Bible

- type: entity
  parent: [Bible, BaseSyndicateContraband]
  name: 《死靈之書》 | necronomicon
  description: "有一則備註：克拉圖、維拉塔、尼克托——別再忘記了！ | There's a note: Klatuu, Verata, Nikto -- Don't forget it again!"
  id: BibleNecronomicon
  components:
  - type: Bible
    damage:
      types:
        Caustic: 20 ## ~15 dps
    damageOnFail:
      types:
        Blunt: 5
        Piercing: 5
        Slash: 5
        Asphyxiation: 25
    damageOnUntrainedUse:
      types:
        Caustic: 50
    failChance: 0
    healFailOthersText: necro-heal-fail-others
    healFailSelfText: necro-heal-fail-self
    healSuccessOthersText: necro-heal-success-others
    healSuccessSelfText: necro-heal-success-self
    healSound: "/Audio/Effects/lightburn.ogg"
    healingLightEffect: EvilLightEffect
  - type: Summonable
    summonEntity: SpawnPointGhostCerberus
    respawnTime: 300
  - type: Sprite
    sprite: Objects/Specific/Chapel/necronomicon.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/necronomicon.rsi

- type: entity
  parent: BaseAction
  id: ActionBibleSummon
  name: 召喚使魔 | Summon familiar
  description: 召喚一隻能協助你的使魔；當靈魂入體後，它便會獲得類人智慧。 | Summon a familiar that will aid you and gain humanlike intelligence once inhabited by a soul.
  components:
  - type: Action
    useDelay: 1
  - type: Sprite
    sprite: Clothing/Head/Hats/witch.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:SummonActionEvent

- type: entity
  id: BibleDruid
  name: 德魯伊石板 | druidic tablet
  parent: Bible
  description: "這就是德魯伊的謎團！ | It's the mystery of the druids!"
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/mysteryofthedruids.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/mysteryofthedruids.rsi

- type: entity
  id: BibleCommunistManifesto
  name: 《共產黨宣言》 | communist manifesto
  parent: Bible
  description: "撕下資本主義那張「人性」的面具。 | Remove the mask of humanity from Capital."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/communistmanifesto.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/communistmanifesto.rsi

- type: entity
  id: BibleNarsie
  name: 《納爾西之書》 | tome of nar'sie
  parent: Bible
  description: "一本渾身沾滿鮮血的書，究竟會出什麼差錯呢？ | What could possibly go wrong with a book covered in blood?"
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/tomeofnarsie.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/tomeofnarsie.rsi

- type: entity
  id: BibleNanoTrasen
  name: 《納諾特拉西穆斯法典》 | codex nanotrasimus
  parent: Bible
  description: "一本載有《神聖操作程序》的熟悉書籍。 | A familiar book containing the Sacred Operating Procedures."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/codexnanotrasimus.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/codexnanotrasimus.rsi

- type: entity
  id: BibleHonk
  name: 「嗶嗶媽」的歡樂 | mirth of the honkmother
  parent: Bible
  description: "啊，偉大而光榮的母親，歡樂之主，面具與歡鬧之女，她在我們這些小丑之中實為蒙福者。 | Oh great and glorious Mother, Mistress of Mirth, Matron of Mask and Merriments, Blessed is she amongst us jesters."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/honk.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/honk.rsi

- type: entity
  id: BibleRatvar
  name: 拉特瓦爾錠 | tablet of ratvar
  parent: Bible
  description: "「鐘齒教」的一件神聖聖物，曾獲得「鐘齒正義」拉特瓦爾的祝福。 | A holy relic of the Clockwork Cult, blessed by the Clockwork Justice, Ratvar."
  components:
  - type: Sprite
    sprite: Objects/Specific/Chapel/ratvartablet.rsi
  - type: Item
    sprite: Objects/Specific/Chapel/ratvartablet.rsi

- type: entity
  id: HolyLightEffect
  categories: [ HideSpawnMenu ]
  components:
    - type: PointLight
      enabled: true
      radius: 1.5
      energy: 20
      color: lightgoldenrodyellow
      netsync: false
    - type: LightFade
      duration: 0.7
    - type: TimedDespawn
      lifetime: 0.7

- type: entity
  id: EvilLightEffect
  categories: [ HideSpawnMenu ]
  parent: HolyLightEffect
  components:
    - type: PointLight
      color: red
