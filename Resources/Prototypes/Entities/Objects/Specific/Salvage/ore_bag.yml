- type: entity
  name: 礦石袋 | ore bag
  id: OreBag
  parent: BaseStorageItem
  description: 一款堅固耐用的背包，專為回收專家與礦工設計，用於搬運大量礦石。當繫在腰帶上時，會使附近的礦石磁化。 | A robust bag for salvage specialists and miners alike to carry large amounts of ore. Magnetises any nearby ores when attached to a belt.
  components:
  - type: MagnetPickup
  - type: Sprite
    sprite: Objects/Specific/Mining/ore_bag.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Specific/Mining/ore_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ArtifactFragment
        - Ore
  - type: Dumpable

- type: entity
  parent: OreBag
  id: BorgOreBag
  name: 一體式礦石袋 | integrated ore bag
  description: 一個嵌入採礦機械人框架的大型礦石袋。拿在手中時，會使附近的礦石磁化。 | A large ore bag built into the frame of a mining cyborg. Magnetises any nearby ores when held.
  components:
    - type: MagnetPickup
      slotFlags: null
      requireActiveHand: true
    - type: Storage
      grid:
      - 0,0,9,5
