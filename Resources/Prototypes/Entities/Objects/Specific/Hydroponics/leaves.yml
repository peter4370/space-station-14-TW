# Leaves
# TODO We have mortar and pestle, all these ground items are very stupid and should just be made by grinding leaves instead of through construction.

- type: entity
  name: 大麻葉 | cannabis leaves
  parent: ProduceBaseRuminant
  id: LeavesCannabis
  description: "最近已在大多數星系中合法化。 | Recently legalized in most galaxies."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/cannabis.rsi
  - type: Produce
    plantId: CannabisPlants
  - type: Edible # Precursor to the one true edible
  - type: Solution
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 15

- type: entity
  name: 乾燥的大麻葉 | dried cannabis leaves
  parent: ProduceBaseRuminant
  id: LeavesCannabisDried
  description: "乾燥的大麻葉，已準備好待研磨。 | Dried cannabis leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesCannabisDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
    state: dried

- type: entity
  name: 研磨大麻 | ground cannabis
  parent: [SolutionFood, SolutionTiny, BaseItem]
  id: GroundCannabis
  description: "研磨好的大麻，隨時帶你展開一場奇幻之旅。 | Ground cannabis, ready to take you on a trip."
  components:
  - type: Stack
    stackType: GroundCannabis
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: THC
        Quantity: 30 # Takes 2 dried leaves to make one ground cannabis.
  - type: Sprite
    sprite: Objects/Misc/reagent_fillings.rsi
    state: powderpile
    color: darkgreen
  - type: Construction
    graph: smokeableGroundCannabis
    node: ground
  - type: Tag
    tags:
      - Smokable
  - type: Item
    size: Tiny

- type: entity
  name: 彩虹大麻葉 | rainbow cannabis leaves
  parent: LeavesCannabis
  id: LeavesCannabisRainbow
  description: "它本來就該發光成那樣嗎……？ | Is it supposed to be glowing like that...?"
  components:
  - type: Sprite
    layers:
    - sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
      state: produce
      shader: unshaded
  - type: Produce
    plantId: RainbowCannabisPlants
  # disabled because 50 morbillion point lights still break the lighting engine
  #- type: PointLight
  #  radius: 1.5
  #  energy: 2
  #- type: RgbLightController
  #  cycleRate: 0.6
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 6
      - ReagentId: Lipolicide
        Quantity: 3
      - ReagentId: MindbreakerToxin
        Quantity: 2
      - ReagentId: Happiness
        Quantity: 2
#       - ReagentId: ColorfulReagent
#         Quantity: 1
      - ReagentId: Psicodine
        Quantity: 1

- type: entity
  name: 乾燥的彩虹大麻葉 | dried rainbow cannabis leaves
  parent: LeavesCannabisRainbow
  id: LeavesCannabisRainbowDried
  description: "乾燥的彩虹大麻葉，已準備好進行研磨。 | Dried rainbow cannabis leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesCannabisRainbowDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
    state: dried

- type: entity
  name: 研磨過的彩虹大麻 | ground rainbow cannabis
  parent: GroundCannabis
  id: GroundCannabisRainbow
  description: "研磨過的彩虹大麻，隨時準備帶你展開一場奇幻之旅。 | Ground rainbow cannabis, ready to take you on a trip."
  components:
  - type: Stack
    stackType: GroundCannabisRainbow
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: SpaceDrugs
        Quantity: 12
      - ReagentId: Lipolicide
        Quantity: 6
      - ReagentId: MindbreakerToxin
        Quantity: 4
      - ReagentId: Happiness
        Quantity: 4
#       - ReagentId: ColorfulReagent
#         Quantity: 2
      - ReagentId: Psicodine
        Quantity: 2
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/rainbow_cannabis.rsi
    state: powderpile_rainbow
    color: white
  - type: Construction
    graph: smokeableGroundCannabisRainbow
    node: groundRainbow

- type: entity
  name: 茶葉 | tea leaves
  parent: ProduceBaseRuminant
  id: LeavesTea
  description: "可曬乾後用來泡茶。 | Can be dried out to make tea."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tea_plant.rsi
  - type: Produce
    plantId: TeaPlantPlants
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vitamin
        Quantity: 15

- type: entity
  name: 乾燥茶葉 | dried tea leaves
  parent: ProduceBaseRuminant
  id: LeavesTeaDried
  description: "乾燥的茶葉，已準備好待研磨。 | Dried tea leaves, ready to be ground."
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Vitamin
        Quantity: 10
      - ReagentId: TeaPowder # Convert some of the Vitamin to Tea
        Quantity: 5
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tea_plant.rsi
    state: dried

- type: entity
  name: 菸葉 | tobacco leaves
  parent: ProduceBaseRuminant
  id: LeavesTobacco
  description: "把牠們曬乾，做成菸捲。 | Dry them out to make some smokes."
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
  - type: Produce
    plantId: TobaccoPlants
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 5

- type: entity
  name: 乾燥的菸葉 | dried tobacco leaves
  parent: LeavesTobacco
  id: LeavesTobaccoDried
  description: "乾燥的菸葉，已準備好進行研磨。 | Dried tobacco leaves, ready to be ground."
  components:
  - type: Stack
    stackType: LeavesTobaccoDried
    count: 1
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/tobacco.rsi
    state: dried

- type: entity
  name: 煙絲 | ground tobacco
  parent: [SolutionFood, SolutionTiny, BaseItem]
  id: GroundTobacco
  description: "煙絲，非常適合用來手捲香菸。 | Ground tobacco, perfect for hand-rolled cigarettes."
  components:
  - type: Stack
    stackType: GroundTobacco
    count: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nicotine
        Quantity: 10
  - type: Sprite
    sprite: Objects/Misc/reagent_fillings.rsi
    state: powderpile
    color: brown
  - type: Construction
    graph: smokeableGroundTobacco
    node: ground
  - type: Tag
    tags:
      - Smokable
  - type: Item
    size: Tiny
