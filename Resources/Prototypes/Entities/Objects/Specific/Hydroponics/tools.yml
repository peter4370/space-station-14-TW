- type: entity
  name: 迷你鋤頭 | mini hoe
  parent: BaseItem
  id: HydroponicsToolMiniHoe
  description: 它用來除草或搔背。 | It's used for removing weeds or scratching your back.
  components:
  - type: Tag
    tags:
    - Hoe
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 6
  - type: Item
    sprite: Objects/Tools/Hydroponics/hoe.rsi
    storedSprite:
      state: storage
      sprite: Objects/Tools/Hydroponics/hoe.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: BotanyHoe

- type: entity
  name: 修枝剪 | plant clippers
  parent: BaseItem
  id: HydroponicsToolClippers
  description: 一種用於從植物中採集樣本的工具。 | A tool used to take samples from plants.
  components:
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 90
    damage:
      types:
        Slash: 7
  - type: Item
    sprite: Objects/Tools/Hydroponics/clippers.rsi
    storedRotation: -90
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: BotanySampleTaker
  - type: Tool
    qualities:
    - Shearing

- type: entity
  name: 鐮刀 | scythe
  parent: BaseItem
  id: HydroponicsToolScythe
  description: 這件工具配備了一把鋒利且彎曲的刀刃，握柄則採用長型纖維金屬材質，讓您能輕鬆收穫親手播下的種子。 | A sharp and curved blade on a long fibremetal handle, this tool makes it easy to reap what you sow.
  components:
  - type: Tool
    qualities:
    - Slicing
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    damage:
      types:
        Slash: 10
  - type: Item
    size: Normal
  - type: Clothing
    sprite: Objects/Tools/Hydroponics/scythe.rsi
    slots:
    - back
  - type: StaticPrice
    price: 40
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100

- type: entity
  name: 斧頭 | hatchet
  parent: BaseItem
  id: HydroponicsToolHatchet
  description: 一把鋒利無比的斧頭，配有短小的纖維金屬斧柄。它擁有悠久的劈砍歷史，但如今主要用於劈柴。 | A very sharp axe blade upon a short fibremetal handle. It has a long history of chopping things, but now it is used for chopping wood.
  components:
  - type: Tool
    qualities:
    - Slicing
    - Sawing
  - type: Tag
    tags:
    - BotanyHatchet
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 135
    swingLeft: true
    damage:
      types:
        Slash: 8
        Piercing: 2
  - type: Item
    sprite: Objects/Tools/Hydroponics/hatchet.rsi
    storedSprite:
      state: storage
      sprite: Objects/Tools/Hydroponics/hatchet.rsi
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 鏟子 | spade
  parent: BaseItem
  id: HydroponicsToolSpade
  description: 一種用於挖掘和搬運泥土的小型工具。 | A small tool for digging and moving dirt.
  components:
  - type: Tag
    tags:
    - BotanyShovel
  - type: Sprite
    sprite: Objects/Tools/Hydroponics/spade.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 8
        Piercing: 2 # I guess you can stab it into them?
    soundHit:
      collection: MetalThud
  - type: Item
    sprite: Objects/Tools/Hydroponics/spade.rsi
    storedSprite:
      state: storage
      sprite: Objects/Tools/Hydroponics/spade.rsi
  - type: Shovel
    speedModifier: 0.75 # slower at digging than a full-sized shovel
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  name: 植物袋 | plant bag
  id: PlantBag
  parent: BaseStorageItem
  description: 一款專為植物學家設計的袋子，方便他們搬運大量採集的植物標本。 | A bag for botanists to easily move their huge harvests.
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/Equipment/plant_bag.rsi
    state: icon
  - type: Item
    storedRotation: -90
  - type: Clothing
    quickEquip: false
    slots:
    - belt
  - type: Storage
    grid:
    - 0,0,7,4
    maxItemSize: Small
    quickInsert: true
    areaInsert: true
    whitelist:
      components:
        - Produce
        - Seed
  - type: Dumpable
