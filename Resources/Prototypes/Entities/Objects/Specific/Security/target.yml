- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: BaseTargetIndestructible
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_stake
    noRot: true
  - type: Repairable
  - type: DamagePopup
    allowTypeChange: true
    damagePopupType: Combined
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 200
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: InteractionOutline
  - type: Physics
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  abstract: true
  parent: BaseTargetIndestructible
  id: BaseTarget
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 5
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


- type: entity
  parent: BaseTarget
  id: TargetHuman
  name: 人類目標 | human target
  description: 一個射擊靶。這個靶子是人。 | A shooting target. This one is a human.
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_h

- type: entity
  parent: BaseTarget
  id: TargetSyndicate
  name: 集團目標 | syndicate target
  description: 一個射擊靶。這個靶是黑手黨的探員。 | A shooting target. This one is a syndicate agent.
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_s

- type: entity
  parent: BaseTarget
  id: TargetClown
  name: 小丑靶子 | clown target
  description: 一個射擊靶。這個靶子是小丑。 | A shooting target. This one is a clown.
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_c

# put it on a salvage or something
- type: entity
  parent: BaseTargetIndestructible
  id: TargetStrange
  name: 奇怪的目標 | strange target
  description: 一個射擊靶。你不太確定這到底是什麼，但它看起來格外堅固。 | A shooting target. You aren't quite sure what this one is, but it seems to be extra robust.
  components:
  - type: Sprite
    sprite: Objects/Specific/Security/target.rsi
    state: target_f
