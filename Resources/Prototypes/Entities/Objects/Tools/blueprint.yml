- type: entity
  parent: BaseItem
  id: BaseBlueprint
  name: 藍圖 | blueprint
  description: 某台機器的藍圖。可裝入自動車床中。 | A blueprint for some machine. It can be inserted into an autolathe.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Tools/blueprint.rsi
    state: icon
  - type: Item
    size: Normal
    shape:
    - 0,0,2,0
    storedSprite:
      sprite: Objects/Tools/blueprint.rsi
      state: storage
  - type: Blueprint
  - type: StaticPrice
    price: 1000
  - type: Tag
    tags:
    - BlueprintAutolathe

