- type: entity
  name: T-ray 掃描器 | t-ray scanner
  parent: BaseItem
  id: trayScanner
  description: 一款利用太赫茲輻射來偵測地板下基礎設施的高科技掃描裝置。 | A high-tech scanning device that uses Terahertz Radiation to detect subfloor infrastructure.
  components:
  - type: Sprite
    sprite: Objects/Tools/t-ray.rsi
    layers:
    - state: tray-off
      map: ["base"]
  - type: TrayScanner
  - type: Item
    sprite: Objects/Tools/t-ray.rsi
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TrayScannerVisual.Visual:
        base:
          On: { state: tray-on }
          Off: { state: tray-off }
  - type: PhysicalComposition
    materialComposition:
      Steel: 400
      Glass: 150
  - type: StaticPrice
    price: 85
  - type: UseDelay
    delay: 1
