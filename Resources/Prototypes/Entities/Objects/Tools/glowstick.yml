- type: entity
  abstract: true
  parent: BaseItem
  id: GlowstickBase
  name: 螢光棒 | glowstick
  description: 在狂歡派對和緊急情況下都很實用。 | Useful for raves and emergencies.
  components:
  - type: SpaceGarbage
  - type: ExpendableLight
    glowDuration: 900 # time in seconds
    glowColorLit: "#F6F7E9"
    fadeOutDuration: 300
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    iconStateLit: glowstick_lit
    iconStateSpent: glowstick_unlit
    litSound:
      path: /Audio/Items/Handcuffs/rope_breakout.ogg
  - type: Sprite
    sprite: Objects/Misc/glowstick.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: glowstick_base
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: glowstick_glow
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: glowstick_unlit
  - type: Item
    sprite: Objects/Misc/glowstick.rsi
    heldPrefix: unlit
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#F6F7E9"
    radius: 5
    energy: 0
    netsync: false
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour # slowly fade in once activated
      id: turn_on
      interpolate: Linear
      maxDuration: 10.0
      startValue: 0.0
      endValue: 3.0
      property: Energy
    - !type:FadeBehaviour # fade out energy as it burns out
      id: fade_out
      interpolate: Linear
      maxDuration: 10 # 300.0
      startValue: 3.0
      endValue: 0.2
      property: Energy
    - !type:FadeBehaviour # fade out radius as it burns out
      id: fade_out
      interpolate: Linear
      maxDuration: 10 # 300.0
      startValue: 5.0
      endValue: 1.5
  - type: Tag
    tags:
    - Trash

- type: entity
  parent: GlowstickBase
  id: GlowstickRed
  name: 紅色發光棒 | red glowstick
  components:
  - type: ExpendableLight
    spentName: expendable-light-spent-red-glowstick-name
