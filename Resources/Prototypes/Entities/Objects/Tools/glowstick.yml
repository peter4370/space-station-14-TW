# ----------------------------------------------------------------------------
# THE FOLLOWING ARE ALL DUMMY ENTITIES USED TO TEST THE LIGHT BEHAVIOUR SYSTEM
# ----------------------------------------------------------------------------
- type: entity
  name: 光脈衝測試 | light pulse test
  parent: BaseItem
  id: LightBehaviourTest1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/glowstick.rsi
    layers:
    - state: glowstick_base
    - state: glowstick_unlit
      shader: unshaded
      color: "#FF0000"
  - type: Item
    sprite: Objects/Misc/glowstick.rsi
    heldPrefix: unlit
  - type: PointLight
    enabled: true
    color: "#FF0000"
    radius: 5
  - type: LightBehaviour
    behaviours:
    - !type:PulseBehaviour
      interpolate: Cubic
      maxDuration: 10.0
      startValue: 1.0
      endValue: 7.0
      isLooped: true
      property: Energy
      enabled: true

- type: entity
