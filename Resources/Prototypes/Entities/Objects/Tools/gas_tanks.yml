    sprite: Objects/Tanks/emergency_clown.rsi
  - type: Item
    sprite: Objects/Tanks/emergency_clown.rsi
    storedSprite:
      state: storage
      sprite: Objects/Tanks/emergency_clown.rsi
  - type: Clothing
    sprite: Objects/Tanks/emergency_clown.rsi

- type: entity
  parent: GasTankRoundBase
  id: AirTank
  name: 氣罐 | air tank
  description: 有人要混合油嗎？它能裝 5 公升汽油。 | Mixed anyone? It can hold 5 L of gas.
  components:
  - type: GasTank
    releasePressure: 101.3

- type: entity
  parent: GasTankRoundBase
  id: NitrousOxideTank
  name: 一氧化二氮儲氣罐 | nitrous oxide tank
  description: 內含空氣與一氧化二氮的混合氣體。請務必避免以純 N2O 進行補充。此氣瓶可容納 5 公升氣體。 | Contains a mixture of air and nitrous oxide. Make sure you don't refill it with pure N2O. It can hold 5 L of gas.
  components:
  - type: Sprite
    sprite: Objects/Tanks/anesthetic.rsi
  - type: Item
    sprite: Objects/Tanks/anesthetic.rsi
  - type: GasTank
    releasePressure: 30.4
  - type: Clothing
    sprite: Objects/Tanks/anesthetic.rsi

- type: entity
  # it's a square so no rolling dough
