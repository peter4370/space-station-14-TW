  id: PlasmaTank
  name: 等離子體槽 | plasma tank
  description: 內含危險等離子體。請勿吸入。極易燃。可容納 5 公升氣體。 | Contains dangerous plasma. Do not inhale. Extremely flammable. It can hold 5 L of gas.
  components:
  - type: Sprite
    sprite: Objects/Tanks/plasma.rsi
  - type: Item
    sprite: Objects/Tanks/plasma.rsi
  - type: GasTank
    releasePressure: 101.3
  - type: Clothing
    sprite: Objects/Tanks/plasma.rsi
    slots:
