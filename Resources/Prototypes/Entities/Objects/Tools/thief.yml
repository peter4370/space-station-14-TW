- type: entity
  parent: BaseMinorContraband
  id: ThiefBeacon
  name: 竊盜信標 | thieving beacon
  description: 一種裝置，能在輪班結束時將周圍的一切傳送至竊賊的金庫中。 | A device that will teleport everything around it to the thief's vault at the end of the shift.
  components:
    - type: ThiefBeacon
    - type: StealArea
      range: 2 # Slightly larger than fulton beacon's random offset
    - type: Item
      size: Normal
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.4,0.25,0.1"
          density: 20
          mask:
            - Impassable
    - type: Foldable
      folded: true
    - type: Clickable
    - type: InteractionOutline
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.FoldedVisuals.State:
          foldedLayer:
            True: { state: folded_extraction }
            False: { state: extraction_point }
    - type: Sprite
      sprite: Objects/Tools/thief_beacon.rsi
      drawdepth: SmallObjects
      noRot: true
      layers:
        - state: extraction_point
          map: [ "foldedLayer" ]

- type: entity
  id: ToolboxThief
  name: 無法辨識的竊盜工具箱 | undetermined thieving toolbox
  description: 這裡就是你最喜歡的盜賊所藏的補給品所在之處。試著記住有哪些東西。 | This is where your favorite thief's supplies lie. Try to remember which ones.
  parent: [ BaseItem, BaseMinorContraband ]
  components:
  - type: Sprite
    sprite: Objects/Tools/Toolboxes/toolbox_thief.rsi
    state: icon
  - type: ThiefUndeterminedBackpack
    possibleSets:
    # TODO Thief pinpointer needed
    - ChemistrySet
    - ToolsSet
    - ChameleonSet # TODO Chameleon stump PR needed
    - SyndieSet
    - SleeperSet
    - CommunicatorSet
    - SmugglerSet
  - type: ActivatableUI
    key: enum.ThiefBackpackUIKey.Key
  - type: UserInterface
    interfaces:
      enum.ThiefBackpackUIKey.Key:
        type: ThiefBackpackBoundUserInterface

- type: entity
  id: SatchelThief
  name: 來歷不明的竊盜包 | undetermined thieving satchel
  description: 這裡就是你最喜愛的竊賊的補給品所在之處。已為你摺疊好，方便攜帶。 | This is where your favorite thief's supplies lie. Folded for your convenience.
  parent: ToolboxThief
  components:
  - type: Sprite
    sprite: Clothing/Back/Satchels/smuggler.rsi
    state: folded
  - type: Item
    storedRotation: 90
  - type: ThiefUndeterminedBackpack
    spawnedStoragePrototype: ClothingBackpackSatchelSmugglerUnanchored
