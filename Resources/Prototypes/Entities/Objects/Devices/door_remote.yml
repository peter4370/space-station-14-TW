- type: entity
  parent: [DoorRemoteCanEletrifyDoors, BaseCommandContraband]
  id: DoorRemoteAll
  name: 超級車庫門遙控器 | super door remote
  description: 一款能遠端開啟和上鎖的裝置。這款裝置甚至連木門也能使用！ | A gadget which can open and bolt doors remotely. This one works even on wooden doors!
  suffix: Admeme
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#2eba22"
    - state: door_remotescreencolour
      color: "#22871a"
  - type: DoorRemote
    includeUserAccess: true
    requireInRangeUnoccluded: false
    requireTagWhitelist: false
  - type: Access
    groups:
    - AllAccess
    tags:
    - CentralCommand
    - NuclearOperative
    - SyndicateAgent
    - Wizard
    - Xenoborg

