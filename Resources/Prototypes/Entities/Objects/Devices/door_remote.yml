- type: entity
  parent: BaseItem
  id: DoorRemoteDefault
  name: 車門遙控器 | door remote
  description: 一款能夠遠端開啟和上鎖門的裝置。 | A gadget which can open and bolt doors remotely.
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/door_remote.rsi
  - type: Item
    storedRotation: -90
  - type: Access
  - type: DoorRemote
    options:
    - mode: OpenClose
      tooltip: &TextOpenClose door-remote-open-close-text
      icon: &IconOpenClose
        sprite: /Textures/Structures/Doors/Airlocks/Standard/airlock-base.rsi
        state: assembly
    - mode: ToggleBolts
      tooltip: &TextToggleBolt door-remote-toggle-bolt-text
      icon: &IconToggleBolt
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: bolt_door
    - mode: ToggleEmergencyAccess
      tooltip: &TextEmergencyAccess door-remote-emergency-access-text
      icon: &IconEmergencyAccess
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: emergency_on
  - type: StealTarget
    stealGroup: DoorRemote
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.DoorRemoteUiKey.Key
  - type: UserInterface
    interfaces:
      enum.DoorRemoteUiKey.Key:
        type: DoorRemoteBoundUserInterface

- type: entity
  parent: DoorRemoteDefault
  id: DoorRemoteCanEletrifyDoors
  abstract: true
  components:
  - type: DoorRemote
    options:
    - mode: ToggleOvercharge
      tooltip: door-remote-toggle-eletrify-text
      icon:
        sprite: /Textures/Interface/Actions/actions_ai.rsi
        state: door_overcharge_on
    - mode: OpenClose
      tooltip: *TextOpenClose
      icon: *IconOpenClose
    - mode: ToggleBolts
      tooltip: *TextToggleBolt
      icon: *IconToggleBolt
    - mode: ToggleEmergencyAccess
      tooltip: *TextEmergencyAccess
      icon: *IconEmergencyAccess

- type: entity
  parent: [DoorRemoteDefault, BaseCommandContraband]
  id: DoorRemoteCommand
  name: 門控遙控器 | command door remote
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#e6e600"
    - state: door_remotescreencolour
      color: "#9f9f00"
  - type: Access
    groups:
    - Command
  - type: DoorRemote

- type: entity
  parent: [DoorRemoteDefault, BaseCommandContraband]
  id: DoorRemoteCustom
  name: 客製化車庫門遙控器 | custom door remote
  description: 一款可遠端開啟及鎖門的小型裝置。此進階版本未內建存取功能，而是繼承使用者的身分識別存取權限。 | A gadget which can open and bolt doors remotely. This advanced variant does not have built-in access, instead inheriting the ID access of the user.
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#0077FF"
    - state: door_remotescreencolour
      color: "#0033EE"
  - type: Access
  - type: DoorRemote
    includeUserAccess: true

