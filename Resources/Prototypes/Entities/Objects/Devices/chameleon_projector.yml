- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  id: ChameleonProjectorNoBattery
  name: 變色龍投影機 | chameleon projector
  description: 全息寄生體技術可用於創造你周遭任何物體的硬光複製品。一旦被拾起或停用，偽裝效果即會消失。 | Holoparasite technology used to create a hard-light replica of any object around you. Disguise is destroyed when picked up or deactivated.
  components:
  - type: Sprite
    sprite: /Textures/Objects/Devices/chameleon_projector.rsi
    layers:
    - state: icon
    - state: powered
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: decharging
      map: [ "enum.PowerDeviceVisualLayers.Charging" ]
      visible: false
  - type: ChameleonProjector
    whitelist:
      components:
      - Anchorable
      - Item
      tags:
      - Bot # for funny bot moments
    blacklist:
      components: # TODO: This blacklist should be cut down by a lot once Chameleon Projector code is less buggy. See #40510
      - ChameleonDisguise # no becoming kleiner
      - Door # no faking doors
      - MindContainer # no
      - Pda # PDAs currently make you invisible /!\
      - SubFloorHide # no hiding under the floor
      - Wall # Walls make you invisible
      tags:
      - Catwalk # Catwalks make you invisible
      - Window # Windows make you invisible
    disguiseProto: ChameleonDisguise
  - type: StaticPrice
    price: 5000

- type: entity
  parent: ChameleonProjectorNoBattery
  id: ChameleonProjector
  name: 變色龍投影機 | chameleon projector
  description: 全息寄生體技術可用於創造你周遭任何物體的硬光複製品。一旦被拾起或停用，偽裝效果即會消失。 | Holoparasite technology used to create a hard-light replica of any object around you. Disguise is destroyed when picked up or deactivated.
  suffix: Battery
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
      enum.BatteryVisuals.Charging:
        enum.PowerDeviceVisualLayers.Charging:
          Charging: { visible: false }
          Decharging: { visible: true }
          Constant: { visible: false }
  - type: BatteryVisuals
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: 電源模組插槽-元件插槽-名稱-預設值 | power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: PowerCellDraw
    drawRate: 4 # About 3 minutes with a medium cell.
  - type: ToggleCellDraw
  - type: ItemToggle
    onActivate: false
    onUse: false

- type: entity
  categories: [ HideSpawnMenu ]
  id: ChameleonDisguise
  name: 尤里斯·麥克萊納 | Urist McKleiner
  components:
  # this and the name/desc get replaced, this is just placeholder incase something goes wrong
  - type: Sprite
    sprite: /Textures/Mobs/Species/Human/parts.rsi
    state: full
  - type: Transform
    noRot: true # players rotation and anchor is used instead
  - type: InteractionOutline
  - type: Clickable
  - type: Damageable
  - type: Injurable
  - type: ChameleonDisguise

# actions
- type: entity
  parent: BaseAction
  id: ActionDisguiseNoRot
  name: 切換旋轉方向 | Toggle Rotation
  description: 使用此功能可防止你的偽裝旋轉，讓你在某些情況下更容易隱藏身形。 | Use this to prevent your disguise from rotating, making it easier to hide in some scenarios.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/VerbIcons/refresh.svg.192dpi.png
  - type: InstantAction
    event: !type:DisguiseToggleNoRotEvent

- type: entity
  parent: BaseAction
  id: ActionDisguiseAnchor
  name: 切換錨點 | Toggle Anchored
  description: 對於許多物件來說，您會希望將其錨定，以免過於顯眼。 | For many objects you will want to be anchored to not be completely obvious.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    sprite: Objects/Tools/wrench.rsi
    layers:
    - state: icon
  - type: InstantAction
    event: !type:DisguiseToggleAnchoredEvent
