- type: entity
  parent: BaseItem
  id: DeviceQuantumSpinInverter
  name: 量子自旋反轉器 | quantum spin inverter
  description: 一種實驗性裝置，能夠透過切換兩個實體的粒子自旋值，來交換兩者的位置。必須與另一台裝置連結才能運作。 | An experimental device that is able to swap the locations of two entities by switching their particles' spin values. Must be linked to another device to function.
  components:
  - type: Sprite
    sprite: Objects/Devices/swapper.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Item
    size: Small
  - type: Appearance
  - type: ArrivalsBlacklist
  - type: SwapTeleporter
    teleporterWhitelist:
      tags:
      - QuantumSpinInverter
  - type: GenericVisualizer
    visuals:
      enum.SwapTeleporterVisuals.Linked:
        base:
          True: { state: linked }
          False: { state: icon }
  - type: Tag
    tags:
    - QuantumSpinInverter
