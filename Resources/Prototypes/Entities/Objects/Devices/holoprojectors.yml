- type: entity
  parent: BaseItem
  id: Holoprojector
  name: 全息標誌投影機 | holographic sign projector
  description: 一款方便實用的全息投影機，能投影出清潔人員的標誌。 | A handy-dandy holographic projector that displays a janitorial sign.
  components:
  - type: Item
    storedRotation: -90
  - type: HolosignProjector
  - type: UseDelay
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: 電源模組插槽-元件插槽-名稱-預設值 | power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: Sprite
    sprite: Objects/Devices/Holoprojectors/custodial.rsi
    state: icon
  - type: Tag
    tags:
    - HolosignProjector

- type: entity
  parent: Holoprojector
  id: HoloprojectorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: 電源模組插槽-元件插槽-名稱-預設值 | power-cell-slot-component-slot-name-default

- type: entity
  parent: Holoprojector
  id: HoloprojectorBorg
  suffix: borg
  name: 全息投影機 | holosign projector
  description: 一款經改良、適用於維護型賽博格的全息標誌投影機。具備自動充電功能。 | A modified holographic sign projector for use in custodial cyborgs. Automatically self-charges.
  components:
  - type: HolosignProjector
    chargeUse: 240
  - type: ItemSlots
    slots:
      cell_slot:
        name: 電源模組插槽-元件插槽-名稱-預設值 | power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
        disableEject: true
        swap: false

- type: entity
  parent: Holoprojector
  id: HoloprojectorClownBorg
  name: Holopeel 投影機 | holopeel projector
  description: 一款全息剝皮投影機，能投射出光滑且堅硬的「光影香蕉皮」。它可重複充電，讓樂趣永無止境！ | A holopeel projector that creates a slippery, hard light banana peel. It recharges, so that the fun never ends!
  suffix: borg
  components:
  - type: HolosignProjector
