- type: entity
  id: DeviceDesynchronizer
  parent: BaseItem
  name: 去同步器 | desynchronizer
  description: 一種實驗性裝置，能夠暫時使使用者與時空脫同步，在裝置運作期間，能讓使用者 effectively 消失。 | An experimental device that can temporarily desynchronize the user from spacetime, effectively making them disappear while it's active.
  components:
  - type: Sprite
    sprite: Objects/Devices/desynchronizer.rsi
    state: icon
  - type: TriggerOnUse
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: VoidPocket
  - type: UseDelay
    delay: 220 # long delay to ensure it can't be spammed, use it wisely
