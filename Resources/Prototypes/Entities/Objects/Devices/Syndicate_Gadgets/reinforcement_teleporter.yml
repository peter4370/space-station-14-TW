- type: entity
  parent: [BaseItem, BaseSyndicateContraband]
  abstract: true
  id: ReinforcementRadio
  name: 辛迪加強化無線電 | syndicate reinforcement radio
  description: 立刻找一位來路不明的合夥代理人！僅提供基本設備。 | Call in a syndicate agent of questionable quality, instantly! Only basic equipment provided.
  components:
  - type: Sprite
    sprite: Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: UserInterface
    interfaces:
      enum.GhostRoleRadioUiKey.Key:
        type: GhostRoleRadioBoundUserInterface
  - type: ActivatableUI
    key: enum.GhostRoleRadioUiKey.Key

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSyndicate
  name: 辛迪加強化無線電 | syndicate reinforcement radio
  description: 立刻請一位來歷可疑的合買代理前來！ | Call in a syndicate agent of questionable quality, instantly!
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-reinforcement-spy-name | ghost-role-information-syndicate-reinforcement-spy-name
    description: ghost-role-information-syndicate-reinforcement-spy-description | ghost-role-information-syndicate-reinforcement-spy-description
    rules: ghost-role-information-syndicate-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobHumanSyndicateAgentSpy
    selectablePrototypes: ["SyndicateAgentMedic", "SyndicateAgentSpy", "SyndicateAgentThief"]

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSyndicateNukeops # Reinforcement radio exclusive to nukeops uplink
  name: 核武特工無線電 | nuclear operative radio
  description: 立刻召喚一名實力成疑的核武特工！基本核武特工裝備已備妥。 | Call in a nuclear operative of questionable quality, instantly! Basic nukeop equipment provided.
  suffix: NukeOps
  components:
  - type: GhostRole
    name: ghost-role-information-nukeop-reinforcement-name | ghost-role-information-nukeop-reinforcement-name
    description: ghost-role-information-nukeop-reinforcement-description | ghost-role-information-nukeop-reinforcement-description
    rules: ghost-role-information-nukeop-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobHumanSyndicateAgentNukeops

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSyndicateAncestor
  name: 辛迪加遺傳祖先強化電台 | syndicate genetic ancestor reinforcement radio
  description: 召喚一位由您親自挑選、經過特別訓練的祖先前來協助您。 | Calls in a specially trained ancestor of your choosing to assist you.
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-monkey-reinforcement-name | ghost-role-information-syndicate-monkey-reinforcement-name
    description: ghost-角色資訊-辛迪加-猴子-強化-描述 | ghost-role-information-syndicate-monkey-reinforcement-description
    rules: ghost-role-information-syndicate-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobMonkeySyndicateAgent
    selectablePrototypes: ["SyndicateMonkey", "SyndicateKobold"]

- type: entity
  parent: ReinforcementRadioSyndicateAncestor
  id: ReinforcementRadioSyndicateAncestorNukeops # Reinforcement radio exclusive to nukeops uplink
  suffix: NukeOps
  components:
  - type: GhostRole
    rules: ghost-role-information-nukeop-reinforcement-rules
  - type: GhostRoleMobSpawner
    prototype: MobMonkeySyndicateAgentNukeops
    selectablePrototypes: ["SyndicateMonkeyNukeops", "SyndicateKoboldNukeops"]

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSyndicateSyndiCat
  name: 工會 加強 無線電 | syndicat reinforcement radio
  description: 召喚一隻受過嚴格訓練、攜帶微型炸彈的貓來協助你。 | Calls in a faithfully trained cat with a microbomb to assist you.
  components:
  - type: GhostRole
    name: ghost-role-information-SyndiCat-name | ghost-role-information-SyndiCat-name
    description: ghost-role-information-SyndiCat-description | ghost-role-information-SyndiCat-description
    rules: ghost-role-information-syndicate-reinforcement-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostRoleMobSpawner
    prototype: MobCatSyndy
  - type: EmitSoundOnUse
    sound: /Audio/Animals/cat_meow.ogg

- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioSyndicateCyborgAssault # Reinforcement radio exclusive to nukeops uplink
  name: 辛迪加 突擊 賽博格 增援 無線電 | syndicate assault cyborg reinforcement radio
  description: 立刻調派一名武裝精良的突擊賽博格！ | Call in a well armed assault cyborg, instantly!
  suffix: NukeOps
  components:
    - type: GhostRole
      name: ghost-role-information-syndicate-cyborg-assault-name | ghost-role-information-syndicate-cyborg-assault-name
      description: ghost-role-information-syndicate-cyborg-description | ghost-role-information-syndicate-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles:
      - MindRoleGhostRoleSilicon
      raffle:
        settings: default
      job: Borg
    - type: GhostRoleMobSpawner
      prototype: PlayerBorgSyndicateAssaultBattery
