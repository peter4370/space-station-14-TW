- type: entity
  parent: BaseItem
  id: voicesensor
  name: 語音感測器 | voice sensor
  description: 這款麥克風是由麥可·フォン在任職於麥可軟體公司期間發明的，當有人說出預先錄製的密碼短語時，它便會發送訊號！ | This microphone, invented by Micheal Phone during his time working at Michealsoft, sends signals when a prerecorded code phrase is uttered!
  components:
  - type: Sprite
    sprite: Objects/Devices/voicesensor.rsi
    state: icon
  - type: StaticPrice
    price: 40
  - type: DeviceLinkSource
    ports:
      - Trigger
  - type: SignalOnTrigger
    port: Trigger
  - type: TriggerOnVoice
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: UseDelay
  - type: EmitSoundOnTrigger
    sound:
      collection: TriggerActivate
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 15
