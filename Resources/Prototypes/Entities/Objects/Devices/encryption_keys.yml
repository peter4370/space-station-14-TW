- type: entity
  abstract: true
  parent: BaseItem
  id: EncryptionKey
  name: 加密金鑰 | encryption key
  description: 一款適用於耳機的小型加密晶片。 | A small cypher chip for headsets.
  components:
  - type: EncryptionKey
  - type: Item
    sprite: Objects/Devices/encryption_keys.rsi
  - type: Sprite
    sprite: Objects/Devices/encryption_keys.rsi

- type: entity
  parent: EncryptionKey
  id: EncryptionKeyCommon
  name: 公頻加密金鑰 | common encryption key
  description: 任何人都可以使用的加密金鑰。 | An encryption key used by anyone.
  components:
  - type: EncryptionKey
    channels:
    - Common
    defaultChannel: Common
  - type: Sprite
    layers:
    - state: crypt_gray
    - state: common_label
  - type: Tag
    tags:
    - EncryptionCommon

