- type: entity
  parent: StructureHealthFurnitureStrong
  id: ChurchBell
  name: 教堂鐘聲 | church bell
  description: 每當這口鐘響起一聲，你便感覺自己的靈魂正日益接近彼岸的世界…… | You feel your soul grow ever closer to the realms beyond for every chime this bell tolls...
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    noRot: true
    sprite: Structures/Specific/church-bell.rsi
    layers:
    - state: church-bell
  - type: InteractionPopup
    interactDelay: 1
    successChance: 1
    interactSuccessSound:
      collection: ChurchBell
  - type: Clickable
  - type: Rotatable
  - type: CollisionWake
    enabled: false
  - type: Physics
    canCollide: false
    bodyType: Static
  - type: Fixtures
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: BrassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetBrass1:
            min: 1
            max: 2
