- type: entity
  parent: BaseStatue
  id: XenoWardingTower
  name: 外星防禦塔 | xeno warding tower
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Specific/xeno_building.rsi
    layers:
      - state: wardingtower
      - state: wardingtower-unshaded
        shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
          - FullTileMask
        layer:
          - WallLayer
        density: 1000

- type: entity
  parent: XenoWardingTower
  id: CarpStatue
  name: 鯉魚雕像 | carp statue
  description: 這座雕像刻畫了其中一條勇敢的鯉魚——正是憑藉牠們的勇氣，我們才得以走到今天。雕像甚至用牠們的真牙製作而成！ | A statue of one of the brave carp that got us where we are today. Made with real teeth!
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Specific/carp_statue.rsi
    layers:
    - state: statue
    - state: eyes
    - state: eyes_unshaded
      shader: unshaded
    - state: teeth_unshaded
      shader: unshaded
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
  - type: Construction
    graph: CarpStatue
    node: statue

- type: entity
  parent: CarpStatue
  id: CarpStatueEmpty
  suffix: Empty
  description: 一塊貴金屬，即將化身為一尊璀璨的鯉魚雕像。 | A lump of precious metals, soon to be a brilliant carp statue.
  components:
  - type: Sprite
    layers:
    - state: statue
  - type: Construction
    node: empty

- type: entity
  parent: CarpStatue
  id: CarpStatueEyes
  suffix: Eyes
  description: 這是一尊雕像，紀念那些讓我們走到今天這一步的勇敢鯉魚之一。這條鯉魚需要去看牙醫了…… | A statue of one of the brave carp that got us where we are today. This one needs a dentist...
  components:
  - type: Sprite
    layers:
    - state: statue
    - state: eyes
    - state: eyes_unshaded
      shader: unshaded
  - type: Construction
    node: eyes
