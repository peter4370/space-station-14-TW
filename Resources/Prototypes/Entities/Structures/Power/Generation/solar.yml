- type: entity
  id: SolarPanelBasePhysSprite
  categories: [ HideSpawnMenu ]
  name: 太陽能板 | solar panel
  placement:
    mode: SnapgridCenter
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Clickable
  - type: InteractionOutline
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.1,0.45,0.1"
        density: 550
        mask:
        - MachineMask
        layer:
        - MidImpassable, LowImpassable, BulletImpassable
  - type: Sprite
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_glass
  - type: NodeContainer
    examinable: true
    nodes:
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_glass
    collectionName: SolarPanel
  - type: Anchorable
  - type: Pullable
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: output
  - type: RequireProjectileTarget
  - type: GuideHelp
    guides:
    - SolarPanels

- type: entity
  parent: [ SolarPanelBasePhysSprite, StructureHealthMachine ]
  id: SolarPanelPlasma
  name: 太陽能板等離子體 | solar panel plasma
  description: 幾片等離子玻璃，當光子撞擊時便會產生電力。 | A few sheets of plasma glass that generate electricity when hit by photons.
  components:
  - type: PowerSupplier
    supplyRampTolerance: 500
    supplyRampRate: 500
  - type: SolarPanel
    maxSupply: 1000
  - type: Sprite
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_plasma
  - type: Damageable
    damageModifierSet: GlassPlasmaMod
  - type: Destructible
    thresholds:
    - trigger: &DamageMachineNormal # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 175
      behaviors:
      - &SoundGlassBreak !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - *SoundGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: solarpanelplasma_broken
  - type: Construction
    graph: SolarPanel
    node: solarpanelplasma

- type: entity
  parent: [ SolarPanelBasePhysSprite, StructureHealthMachineStrong ]
  id: SolarPanelUranium
  name: 太陽能板鈾 | solar panel uranium
  description: 幾片鈾玻璃，當被光子擊中時便會產生電力。 | A few sheets of uranium glass that generate electricity when hit by photons.
  components:
  - type: PowerSupplier
    supplyRampTolerance: 500
    supplyRampRate: 500
  - type: SolarPanel
    maxSupply: 1500
  - type: Sprite
    sprite: Structures/Power/Generation/solar_panel.rsi
    state: solar_panel_uranium
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 275
      behaviors:
      - *SoundGlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 175
      behaviors:
      - *SoundGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: solarpaneluranium_broken
  - type: Construction
    graph: SolarPanel
    node: solarpaneluranium

- type: entity
  parent: [ SolarPanelBasePhysSprite, StructureHealthMachineWeak ]
  id: SolarPanel
  name: 太陽能板 | solar panel
  description: 幾片玻璃，當被光子撞擊時便會產生電力。 | A few sheets of glass that generate electricity when hit by photons.
  components:
  - type: PowerSupplier
    supplyRampTolerance: 500
    supplyRampRate: 500
  - type: SolarPanel
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - *SoundGlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - *SoundGlassBreak
      - !type:ChangeConstructionNodeBehavior
        node: solarpanel_broken
  - type: Construction
    graph: SolarPanel
    node: solarpanel
  - type: SolarPanelReplacementMarker

- type: entity
  parent: [ SolarPanelBasePhysSprite, StructureHealthMachineFlimsy ]
  id: SolarPanelBroken
  name: 太陽能板 | solar panel
  description: 一片損壞的太陽能板。 | A broken solar panel.
  suffix: Broken
  components:
  - type: Sprite
    state: solar_panel_glass_broken
  - type: Damageable
    damageModifierSet: SteelMod
  - type: Destructible
    thresholds:
    - trigger: &DamageMachineFlimsy
        !type:DamageTrigger
        damage: 50
      behaviors:
      - *SoundGlassBreak
      - &ChangeNodeAssembly !type:ChangeConstructionNodeBehavior
        node: solarassembly
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 2
  - type: Construction
    graph: SolarPanel
    node: solarpanel_broken

