- type: entity
  parent: [ BaseMachinePowered, StructureHealthMachineWeak ]
  id: FaxMachineBase
  name: 長距離傳真機 | long range fax machine
  description: Bluespace 技術在官僚體制中的應用。 | Bluespace technologies on the application of bureaucracy.
  components:
  - type: Sprite
    sprite: Structures/Machines/fax_machine.rsi
    drawdepth: SmallObjects
    layers:
    - state: icon
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: Icon
    sprite: Structures/Machines/fax_machine.rsi
    state: icon
  - type: Appearance
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ActivatableUI
    key: enum.FaxUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.FaxUiKey.Key:
        type: FaxBoundUi
  - type: StationAiWhitelist
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: Faxecute
    damage:
      types:
        Blunt: 100
  - type: FaxMachine
    paperSlot:
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      whitelist:
        components:
          - FaxableObject #used to be PaperComponent - brainfood1183
      blacklist:
        components:
          - CargoSlip
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        faxEyes:
          True: { visible: true }
          False: { visible: false }
      enum.FaxMachineVisuals.VisualState:
        printing:
          Printing: { visible: true }
          Normal: { visible: false }
        enum.FaxMachineVisuals.VisualState:
          Inserting: { visible: true }
          Normal: { visible: false }
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      Paper: !type:ContainerSlot
  - type: DeviceNetworkRequiresPower
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: Fax
    transmitFrequencyId: Fax
  - type: RequireProjectileTarget

# Special
- type: entity
  parent: FaxMachineBase
  id: FaxMachineCentcom
  name: CentComm 長距離傳真機 | CentComm long range fax machine
  suffix: CentCom
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#bfe3ff"
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: FaxMachine
    name: "中央司令部 | Central Command"
    notifyAdmins: true

- type: entity
  parent: FaxMachineBase
  id: FaxMachineSyndie
  name: 辛迪加長距離傳真機 | syndicate long range fax machine
  suffix: Syndicate
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#a3a3a3"
    - state: idle
      map: [ "faxEyes" ]
    - state: printing
      map: [ "printing" ]
      visible: false
    - state:
      map: [ "enum.FaxMachineVisuals.VisualState" ]
  - type: FaxMachine
    name: "ERR*?*%！ | ERR*?*%!"
    responsePings: false
    notifyAdmins: true
  - type: Emagged
    emagType: Interaction

- type: entity
  parent: FaxMachineBase
  id: FaxMachineCaptain
  name: 「船長」長距離傳真機 | captain long range fax machine
  suffix: NukeCodes
  components:
    - type: FaxMachine
      name: "船長辦公室 | Captain's Office"
      receiveNukeCodes: true
    - type: StealTarget
      stealGroup: FaxMachineCaptain
