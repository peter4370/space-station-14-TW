  id: !type:CreateVariants
    values: [ GasPort, GasPortAlt1, GasPortAlt2 ]
  name: 連接埠 | connector port
  description: 用於連接與大氣控制相關的攜帶式裝置。 | For connecting portable devices related to atmospherics control.
