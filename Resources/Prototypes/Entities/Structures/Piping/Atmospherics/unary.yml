    - type: Appearance
    - type: PipeColorVisuals
    - type: GasPassiveVent
    - type: Construction
      graph: !type:CreateVariants
        values: [ GasUnary, GasUnaryAlt1, GasUnaryAlt2 ]
      node: passivevent
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentOpening
    - type: GuideHelp
