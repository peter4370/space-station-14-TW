    values: [ GasThermoMachineHellfireHeater, GasThermoMachineHellfireHeaterAlt1, GasThermoMachineHellfireHeaterAlt2 ]
  name: 地獄之火暖爐 | hellfire heater
  description: 一種能加熱連接管路中氣體的先進機器。其副作用是會將熱量洩漏到周圍區域。熱得要命！ | An advanced machine that heats gas in connected pipes. Has the side effect of leaking heat into the surrounding area. Hot as Hell!
