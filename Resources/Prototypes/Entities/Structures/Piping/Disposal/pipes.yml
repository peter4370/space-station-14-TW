- type: entity
  parent: DisposalJunction
  id: DisposalSignalRouter
  name: 廢棄訊號路由器 | disposal signal router
  description: 一個由訊號控制的三向路由器。 | A signal-controlled three-way router.
  components:
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: signal-router-free
  - type: DisposalTube
    exits:
    - West
    - South
    - North
  - type: DisposalSignalRouter
  - type: DeviceLinkSink
    ports:
    - On
    - Off
    - Toggle
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          False: { state: signal-router-free }
          True: { state: signal-router }
  - type: Flippable
    mirrorEntity: DisposalSignalRouterFlipped
  - type: Construction
    graph: DisposalPipe
    node: signal_router

- type: entity
  parent: DisposalSignalRouter
  id: DisposalSignalRouterFlipped
  suffix: flipped
  components:
  - type: Sprite
    layers:
    - map: [ "pipe" ]
      state: signal-router-flipped-free
  - type: DisposalTube
    exits:
    - East
    - South
    - North
  - type: GenericVisualizer
    visuals:
      enum.AnchorVisuals.Anchored:
        pipe:
          False: { state: signal-router-flipped-free }
          True: { state: signal-router-flipped }
  - type: Construction
    node: signal_router_flipped
