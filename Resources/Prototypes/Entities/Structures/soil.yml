- type: entity
  parent: SolutionLarge
  abstract: true
  id: BaseHydroponicsSoil
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
        mask:
        - FullTileMask
        layer:
        - FullTileMask
  - type: Sprite
    noRot: true
  - type: PlantTray
    drawWarnings: false
  - type: Solution
    id: soil
  - type: RefillableSolution
    solution: soil
    maxRefill: 50
  - type: Transform
    anchored: true
  - type: Reactive
    reactions:
    - reagents: [Water]
      methods: [Touch, Ingestion, Injection]
      effects:
      - !type:AddReagentToSolution
        reagent: Water
        solution: soil
  - type: Appearance
  - type: PlantTrayVisuals

- type: entity
  parent: [ BaseHydroponicsSoil, StructureHealthContainer ]
  id: hydroponicsSoil
  name: 土壤 | soil
  description: 由有機物和礦物質混合而成的混合物，用來在太空中培育植物。看起來似乎有些乾。 | A mix of organic matter and minerals creating a soil to grow your plant in space. Seems to be dry.
  components:
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: soil

- type: entity
  parent: hydroponicsSoil
  id: FungalSoil
  name: 真菌土壤 | fungal soil
  description: 由有機質與真菌根系混合而成的混合物，可作為在太空中種植植物的土壤。看起來似乎有些乾燥。 | A mix of organic matter and fungal root creating a soil to grow your plant in space. Seems to be dry.
  components:
  - type: Construction
    graph: Soil
    node: fungalSoil
  - type: Sprite
    sprite: Structures/Hydroponics/misc.rsi
    state: fungal_soil
    noRot: true
  - type: PlantTray
    waterLevel: 0
    nutritionLevel: 0
