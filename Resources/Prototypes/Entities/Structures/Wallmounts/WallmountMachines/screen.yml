- type: entity
  parent: [ BaseWallmountMachine, StructureHealthMachineWeak ]
  id: Screen
  name: 螢幕 | screen
  description: 顯示文字或時間。 | Displays text or time.
  components:
  - type: Rotatable
  - type: TextScreenVisuals
    textOffset: 0,3
    timerOffset: 0,-4
    rows: 2
    rowLength: 6
    scrollEnabled: true
    frameState:
      sprite: Structures/Wallmounts/screen.rsi
      state: outer_frame
  - type: Sprite
    noRot: true
    drawdepth: WallMountedItems
    sprite: Structures/Wallmounts/screen.rsi
    state: screen # Note: outer_frame will be added on top of text layers.
  - type: Appearance
  - type: Damageable
    damageModifierSet: GlassMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: Screen
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: ShuttleTimer

# Dummy screen for comms console
- type: entity
  parent: Screen
  id: ScreenDummy
  categories: [HideSpawnMenu]
  components:
  - type: Sprite

- type: entity
  id: ArrivalsShuttleTimer
  parent: Screen
  name: 抵港螢幕 | arrivals screen
  description: 顯示穿梭機預計抵達時間。 | Displays time of arrivals shuttle ETA.
  components:
  - type: DeviceNetwork
    deviceNetId: Private
    receiveFrequencyId: ArrivalsShuttleTimer
