  name: 破損的海報 | broken poster
  description: "從這張海報的原始印刷品上根本看不出任何東西。它已經毀了。 | You can't make out anything from the poster's original print. It's ruined."
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Wallmounts/posters.rsi
    state: poster_broken
  - type: Construction
    graph: PosterGraph
    node: tornPoster

