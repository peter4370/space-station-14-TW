- type: entity
  abstract: true
  parent: BaseSignWeak
  id: PosterBase
  components:
  - type: Sprite
    sprite: Structures/Wallmounts/posters.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          PosterBroken:
            min: 1
            max: 1
        offset: 0
  - type: Construction
    graph: PosterGraph
    node: start

- type: entity
  parent: BaseSignWeak
