- type: entity
  parent: [ BaseWallmountCabinetGlass, StructureHealthContainerStrong ]
  id: FireAxeCabinet
  name: 消防斧櫃 | fire axe cabinet
  description: 上面貼著一張小標籤，寫著「僅限緊急情況使用」，並附有斧頭的安全使用說明。說得好像真有那麼回事似的。 | There is a small label that reads "For Emergency use only" along with details for safe use of the axe. As if.
  placement:
    mode: SnapgridCenter
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 140
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Sprite
    sprite: Structures/Wallmounts/fireaxe_cabinet.rsi
    layers:
    - state: cabinet
    - state: fireaxe
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
    - state: locked
      shader: unshaded
      map: ["enum.LockVisualLayers.Lock"]
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          tags:
          - FireAxe
  - type: Lock
  - type: AccessReader
    access: [["Atmospherics"], ["Command"]]

- type: entity
  parent: FireAxeCabinet
  id: FireAxeCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true
  - type: Lock
    locked: false

- type: entity
  parent: FireAxeCabinet
  id: FireAxeCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - FireAxe

- type: entity
  parent: [FireAxeCabinetFilled, FireAxeCabinetOpen]
  id: FireAxeCabinetFilledOpen
  suffix: Filled, Open
