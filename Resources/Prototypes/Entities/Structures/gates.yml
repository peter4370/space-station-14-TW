- type: entity
  parent: BaseLogicItem
  id: EdgeDetector
  name: 邊緣偵測器 | edge detector
  description: 將上升沿與下降沿拆分為獨立的脈衝，並偵測你的「鋒利度」。 | Splits rising and falling edges into unique pulses and detects how edgy you are.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: edge_detector
  - type: EdgeDetector
  - type: DeviceLinkSink
    ports:
    - Input
  - type: DeviceLinkSource
    ports:
    - OutputHigh
    - OutputLow
    lastSignals:
      OutputHigh: false
      OutputLow: false
  - type: Construction
    node: edge_detector

- type: entity
  parent: BaseLogicItem
  id: PowerSensor
  name: 功率感測器 | power sensor
  description: 會根據電力網的變化產生訊號。可在不同電纜電壓之間切換。 | Generates signals in response to powernet changes. Can be cycled between cable voltages.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: power_sensor
  - type: PowerSensor
  - type: PowerSwitchable
    examineText: power-sensor-voltage-examine
    switchText: power-sensor-voltage-switch
    cables:
    - voltage: HV
      node: hv
    - voltage: MV
      node: mv
    - voltage: LV
      node: lv
  - type: UseDelay
    delay: 1
  - type: NodeContainer
    examinable: true
    nodes:
      hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
      lv:
        !type:CableDeviceNode
        nodeGroupID: Apc
        enabled: false
  - type: DeviceLinkSource
    ports:
    - PowerCharging
    - PowerDischarging
    lastSignals:
      PowerCharging: false
      PowerDischarging: false
  - type: Construction
    node: power_sensor

- type: entity
  parent: BaseLogicItem
  id: MemoryCell
  name: 記憶單元 | memory cell
  description: 一種 D 型鎖存器電路，用於儲存訊號，該訊號可根據輸入端與使能端而改變。 | A D-Latch circuit that stores a signal which can be changed depending on input and enable ports.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: memory_cell
  - type: MemoryCell
  - type: DeviceLinkSink
    ports:
    - MemoryInput
    - MemoryEnable
  - type: DeviceLinkSource
    ports:
    - Output
  - type: Construction
    node: memory_cell

- type: entity
  parent: BaseLogicItem
  id: RandomGate
  name: 隨機閘門 | random gate
  description: 一種當輸入變化時會輸出隨機訊號的邏輯閘。 | A logic gate that outputs a random signal when input changes.
  components:
  - type: Sprite
    layers:
    - state: base
    - state: random_gate
  - type: RandomGate
  - type: DeviceLinkSink
    ports:
    - RandomGateInput
  - type: DeviceLinkSource
    ports:
    - Output
  - type: UserInterface
    interfaces:
      enum.RandomGateUiKey.Key:
        type: RandomGateBoundUserInterface
  - type: ActivatableUI
    key: enum.RandomGateUiKey.Key
  - type: Construction
    node: random_gate
