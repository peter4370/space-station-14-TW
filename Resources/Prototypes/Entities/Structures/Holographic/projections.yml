- type: entity
  abstract: true
  id: BaseHoloSign
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: TimedDespawn
    lifetime: 90
  - type: Clickable
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic

- type: entity
  parent: BaseHoloSign
  id: HolosignWetFloor
  name: 「地面濕滑」標誌 | wet floor sign
  description: 那些字詞閃爍不定，彷彿毫無意義。 | The words flicker as if they mean nothing.
  components:
  - type: Sprite
    sprite: Structures/Holo/wetfloor.rsi
    state: icon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseHoloSign
  id: HoloFan
  name: holofan | holofan
  description: 一道由堅硬光線構成的屏障，能阻擋空氣，但無法阻擋其他任何東西。 | A barrier of hard light that blocks air, but nothing else.
  components:
  - type: Sprite
    sprite: Structures/Holo/holofan.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.5,-0.5,0.5,0.5"
  - type: TimedDespawn
    lifetime: 180
  - type: Airtight
    noAirWhenFullyAirBlocked: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseHoloSign
  id: HoloPeel
  name: holopeel | holopeel
  description: 一片由滑溜溜的硬光構成的香蕉皮，請小心腳下！ | A banana peel made of slippery hard light, watch your step!
  components:
  - type: Sprite
    sprite: Structures/Holo/peel.rsi
    state: icon
  - type: Physics
    canCollide: true
  - type: Slippery
  - type: StepTrigger
    intersectRatio: 0.2
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - SlipLayer
  - type: TimedDespawn
    lifetime: 30
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: BaseHoloSign
  id: HolosignSecurity
  name: 全息屏障 | holographic barrier
  description: 一道能阻擋移動的堅硬光牆，但強度相當薄弱。 | A barrier of hard light that blocks movement, but pretty weak.
  components:
    - type: Physics
      canCollide: true
    - type: Sprite
      sprite: Structures/Holo/security.rsi
      state: icon
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.3,-0.3,0.3,0.3"
          mask:
            - TableMask
          layer:
            - TableLayer
    - type: TimedDespawn
      lifetime: 180
    - type: PointLight
      enabled: true
      radius: 3
      color: red
    - type: Climbable
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 30
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]

- type: entity
  parent: BaseHoloSign
  id: XenoborgDeflectorField
  name: 偏轉場 | deflector field
  description: 一種由相互交錯的力場構成的能量矩陣，能偏轉飛彈。威力強大，但持續時間短暫。 | An energy matrix, comprised of interlocking fields that deflect projectiles. Powerful, but short-lived.
  components:
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Sprite
    sprite: Structures/Holo/xenoborg.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.3,0.3,0.3"
        hard: true
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: TimedDespawn
    lifetime: 15
  - type: PointLight
    enabled: true
    radius: 3
    color: purple
  - type: Reflect
    reflectProb: 1
  - type: Climbable

- type: entity
  parent: BaseHoloSign
  id: HolosignForcefield
  name: 全息力場 | holographic force field
  description: 一個強大的時空封鎖場，任何東西都無法穿透，就連特斯拉或奇點也不例外。 | A powerful temporal containment field that doesn't let anything through, not even a tesla or singularity.
  components:
  - type: Physics
    canCollide: true
  - type: Sprite
    sprite: Structures/Holo/field.rsi
    state: icon
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: TimedDespawn
    lifetime: 180
  - type: PointLight
    enabled: true
    radius: 3
    color: blue
  - type: ContainmentField
    throwForce: 0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
