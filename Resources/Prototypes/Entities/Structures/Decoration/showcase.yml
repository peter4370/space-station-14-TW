- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseShowcaseRobot
  name: 安全機器人展示會 | security robot showcase
  description: 一具舊式安保機器人的非功能性複製品。 | A non-functional replica of an old security robot.
  components:
  - type: Sprite
    noRot: true
  - type: Anchorable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 5
            max: 10

- type: entity
  id: ShowcaseRobot
  parent: BaseShowcaseRobot
  name: 安全機器人展示會 | security robot showcase
  description: 一具舊式安保機器人的非功能性複製品。 | A non-functional replica of an old security robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_1

- type: entity
  id: ShowcaseRobotWhite
  parent: BaseShowcaseRobot
  name: 白色機器人展示櫃 | white robot showcase
  description: 一具無法運作的舊式機器人複製品。 | A non-functional replica of an old robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_2

- type: entity
  id: ShowcaseRobotAntique
  parent: BaseShowcaseRobot
  name: 貨運機器人展示 | cargo robot showcase
  description: 一具舊式貨運機器人的非功能性複製品。 | A non-functional replica of an old cargo robot.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_3

- type: entity
  id: ShowcaseRobotMarauder
  parent: BaseShowcaseRobot
  name: 「掠奪者」特輯 | marauder showcase
  description: 一尊塗成綠色的掠奪者模型，無法運作。 | A non-functional replica of a marauder, painted green.
  components:
  - type: Sprite
    sprite: Structures/Decoration/showcase.rsi
    state: showcase_4
