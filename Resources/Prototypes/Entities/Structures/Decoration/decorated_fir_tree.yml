- type: entity
  parent: BaseTree
  id: DecoratedFirTree
  name: 裝飾過的冷杉樹 | decorated fir tree
  description: 一棵充滿節日氣氛的聖誕樹，為這個充滿節日氣氛的佳節增添喜慶。 | A very festive tree for a very festive holiday.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/decorated_fir_tree.rsi
    layers:
      - state: base
      - state: balls
      - state: lights
        shader: unshaded
  - type: PointLight
    radius: 1.6
    energy: 2.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.6"
