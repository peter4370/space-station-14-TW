- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurniture ]
  id: BaseBonfire
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        mask:
        - Impassable
        layer:
        - Opaque
        - BulletImpassable
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageModifierSet: WoodMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
  - type: IgnitionSource
    temperature: 700
    ignited: true
  - type: RequireProjectileTarget

- type: entity
  parent: BaseBonfire
  id: Bonfire
  name: 篝火 | bonfire
  description: 還有什麼比在深夜時分，在星空下與朋友們一起彈吉他更美好的呢？ | What can be better than a late evening under the sky with guitar and friends?
  components:
  - type: Sprite
    layers:
    - state: burning
  - type: Construction
    graph: Bonfire
    node: bonfire

- type: entity
  parent: BaseBonfire
  id: BonfireStake
  name: 篝火與火柱 | bonfire with stake
  description: 一堆陰森的篝火，中間插著一根木樁……用來進行某種儀式。最好別問。 | A sinister bonfire with a stake for... ceremonial purposes. Best not to ask.
  components:
  - type: Sprite
    sprite: Structures/Decoration/bonfire_stake.rsi
    layers:
    - state: burning
    offset: "0, 0.5"
  - type: Strap
    position: Stand
    buckleOffset: "0, 0.4"
    buckleDoafterTime: 5
  - type: IgniteOnBuckle
  - type: Construction
    graph: Bonfire
    node: bonfireStake

- type: entity
  parent: BaseBonfire
  id: LegionnaireBonfire
  name: 軍團士兵的篝火 | legionnaire bonfire
  description: 在那裡，在熔岩與火山灰交織的土地上，正是烤棉花糖和馬鈴薯的好地方。 | There, in the land of lava and ash, place to to cook marshmallow and potato.
  components:
  - type: Sprite
    layers:
    - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
