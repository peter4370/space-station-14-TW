- type: entity
  parent: [ BaseStructureDynamic, StructureHealthFurnitureStrong ]
  id: BannerBase
  name: 底部橫幅 | base banner
  description: 這是橫幅的概念，你原本不應該看到這個。 | It's the concept of a banner, you shouldn't be seeing this.
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: DurathreadMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/poster_broken.ogg

- type: entity
  id: BannerNanotrasen
  parent: BannerBase
  name: nanotrasen 橫幅 | nanotrasen banner
  description: 一幅印有 Nanotrasen 標誌的橫幅。看起來頗為廉價。 | A banner displaying the Nanotrasen logo. It looks rather cheap.
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner

- type: entity
  id: BannerCargo
  parent: BannerBase
  name: 貨物橫幅 | cargo banner
  description: 一幅展示貨運部門色彩的橫幅。不是。卡戈尼亞。 | A banner displaying the colors of the cargo department. Not. Cargonia.
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner_cargo

