- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: BaseStatue
  components:
  - type: Sprite
    drawdepth: Mobs
  - type: Damageable
    damageModifierSet: RockMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg

- type: entity
  parent: BaseStatue
  id: StatueVenusRed
  name: 一位純潔少女的雕像 | statue of a pure maiden
  suffix: Red
  description: 一尊古代的大理石雕像。雕像中的人物留著一頭垂至地面的辮子，手中握著一個紅色的工具箱。 | An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a red toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_red
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueVenusBlue
  name: 一位純潔少女的雕像 | statue of a pure maiden
  suffix: Blue
  description: 一尊古老的大理石雕像。雕像中的人物留著一頭垂至地面的辮子，手中握著一個藍色的工具箱。 | An ancient marble statue. The subject is depicted with a floor-length braid and is wielding a blue toolbox.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/statues.rsi
    state: venus_blue
    drawdepth: Mobs
    offset: "0.0,0.5"

- type: entity
  parent: BaseStatue
  id: StatueOrnateClown
  name: 華麗的救世主雕像 | ornate savior statue
  description: 一尊鍍金雕像。它描繪了救世主的歸來——他將挺身而起，帶領小丑們迎向那宏大的喇叭聲。 | A gilded statue. It portrays the return of the savior who will rise up and lead the clowns to the great honk.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Decoration/statue-ornate-clown.rsi
    state: icon
    drawdepth: Mobs
    offset: "0.0,0.3125"
  - type: Construction
    graph: OrnateStatueClown
    node: ornateStatueClown
  - type: Damageable
    damageModifierSet: PreciousMetalMod
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.25,0.4,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseIronsandStatue
  description: 一尊在鐵砂沙漠中發現的神祕雕像。 | A mysterious statue found in a desert of iron sand.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: 鐵砂小雕像 | ironsand small statue
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer

