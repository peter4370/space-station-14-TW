- type: entity
  abstract: true
  parent: [ BaseStructureDynamic, StructureHealthBarrier ]
  id: PlasticFlapsBase
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Sprite
    sprite: Structures/Specific/plastic-flaps.rsi
    state: plasticflaps
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - MidImpassable
  - type: Damageable
    damageModifierSet: PlasticMod
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 3
  - type: StaticPrice
    price: 100
  - type: IconSmooth
    key: walls
    mode: NoSprite
  - type: PlacementReplacement
    key: walls
  - type: StructureAligner
  - type: StructureAlignerPylon

- type: entity
  id: PlasticFlapsClear
  parent: PlasticFlapsBase
  name: 塑膠翻蓋 | plastic flaps
  suffix: Clear
  description: 堅固耐用的塑膠擋板。絕對無法越過那些。沒門兒。 | Heavy duty, plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Construction
    graph: PlasticFlapsGraph
    node: plasticFlaps

- type: entity
  id: PlasticFlapsOpaque
  parent: PlasticFlapsBase
  name: 塑膠翻蓋 | plastic flaps
  suffix: Opaque
  description: 堅固耐用的塑膠擋板。絕對無法越過那些。沒門兒。 | Heavy duty, plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.49,-0.49,0.49,0.49"
        density: 100
        mask:
        - Impassable
        layer:
        - Opaque
        - MidImpassable
  - type: Occluder
  - type: Construction
    graph: PlasticFlapsGraph
    node: opaqueFlaps

- type: entity
  id: PlasticFlapsAirtightClear
  parent: PlasticFlapsBase
  name: 密封式塑膠蓋板 | airtight plastic flaps
  suffix: Airtight, Clear
  description: 重型、稍為堅固些、氣密性良好的塑膠擋板。絕對無法穿過那些。沒門。 | Heavy duty, slightly stronger, airtight plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Airtight
  - type: StaticPrice
    price: 100

- type: entity
  id: PlasticFlapsAirtightOpaque
  parent: PlasticFlapsBase
  name: 密封式塑膠蓋板 | airtight plastic flaps
  suffix: Airtight, Opaque
  description: 重型、稍為堅固些、氣密性良好的塑膠擋板。絕對無法穿過那些。沒門。 | Heavy duty, slightly stronger, airtight plastic flaps. Definitely can't get past those. No way.
  components:
  - type: Airtight
  - type: StaticPrice
    price: 100
