- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectSlowdown
  abstract: true
  name: 放緩 | slowdown
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
    blacklist:
      tags:
      - SlowImmune
  - type: MovementModStatusEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectSpeed
  abstract: true
  name: 速度 | speed
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - MovementSpeedModifier
      requireAll: true
  - type: MovementModStatusEffect

- type: entity
  parent: StatusEffectSpeed
  id: ReagentSpeedStatusEffect
  name: 試劑流速 | reagent speed

- type: entity
  parent: StatusEffectSlowdown
  id: VomitingSlowdownStatusEffect
  name: 嘔吐減緩 | vomiting slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: TaserSlowdownStatusEffect
  name: 遭泰瑟槍擊中而行動遲緩 | shot by taser slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: FlashSlowdownStatusEffect
  name: 被閃到而行動遲緩 | affected by flash slowdown

- type: entity
  parent: StatusEffectSlowdown
  id: StatusEffectStaminaLow
  name: 耐力過低 | stamina low

# Makes you more slippery, or perhaps less slippery.
- type: entity
  parent: MobStatusEffectDebuff # Debatable if this should be MobStatusEffectBase or not
  id: StatusEffectFriction
  name: 摩擦 | friction
  components:
  - type: FrictionStatusEffect

# Stunnable Status Effect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectStunned
  name: 暈眩 | stunned
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
    blacklist:
      tags:
      - StunImmune
  - type: StatusEffectAlert
    alert: Stun
  - type: StunnedStatusEffect
  - type: ExaminableStatusEffect
    messageId: status-effect-examine-stunned
