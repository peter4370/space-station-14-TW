- type: entity
  name: 西班牙軍用多功能刀 | spanish army knife
  parent: BaseItem
  id: ToolDebug
  description: 使用這個帶來的痛苦幾乎讓人難以承受。 | The pain of using this is almost too great to bear.
  suffix: DEBUG
  components:
  - type: Sprite
    sprite: Objects/Tools/debug.rsi
    state: icon
  - type: Clothing
    sprite: Objects/Tools/debug.rsi
    quickEquip: false
    slots:
      - Belt
  - type: MeleeWeapon
    damage:
      types:
        Slash: 10
  - type: ToolTileCompatible
  - type: Tool
  - type: Prying
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: [ Prying ]
        useSound: /Audio/Items/jaws_pry.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: [ Cutting ]
        useSound: /Audio/Items/jaws_cut.ogg
        changeSound: /Audio/Items/change_jaws.ogg
      - behavior: [ Screwing ]
        useSound: /Audio/Items/drill_use.ogg
        changeSound: /Audio/Items/change_drill.ogg
      - behavior: [ Anchoring ]
        useSound: /Audio/Items/drill_use.ogg
        changeSound: /Audio/Items/change_drill.ogg
